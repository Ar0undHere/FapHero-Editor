  FH.on('change:zoom', z => {
    const old = BASE_PPS * lastZoom, now = BASE_PPS * z;
    let ax = (FH.state.time - viewStart) * old;
    if (ax < 0 || ax > W) ax = W / 2;
    viewStart = viewStart + ax / old - ax / now; lastZoom = z; invalidate();
  });
  FH.on('project', () => { waves.clear(); scrollY = 0; resetView(); invalidate(); });
  ['change:selection', 'change:tool', 'change:pasting', 'change:itemSnap', 'chart'].forEach(n => FH.on(n, invalidate));
  cv.addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    e.preventDefault();
    if (e.shiftKey) scrollY = FH.clamp(scrollY + e.deltaY, 0, maxScroll());   // Shift+ホイール: 縦スクロール
    else {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      viewStart = FH.clamp(viewStart + d / pps(), -W * 0.5 / pps(), FH.duration());
    }
    invalidate();
  }, { passive: false });

  /* ---------- 操作 ---------- */
  const lx = e => e.clientX - cv.getBoundingClientRect().left;
  const ly = e => e.clientY - cv.getBoundingClientRect().top;
  const fpsOf = () => FH.state.project.meta.fps || 30;
  const snapGrid = v => FH.state.itemSnap === 'frame' ? Math.round(v * fpsOf()) / fpsOf() : FH.time.snap(v);   // 譜面グリッド or 1フレーム
  const snapItem = (v, skip, free) => { if (free) return v; const m = magnet(v, skip); return m !== v ? m : snapGrid(v); };
  function hit(x, y) {
    const its = FH.state.project.items;
    for (let i = its.length - 1; i >= 0; i--) {
      const it = its[i], x1 = xOf(it.start), x2 = Math.max(xOf(it.start + it.duration), x1 + 4), y0 = rowY(it.layer);
      if (x >= x1 - 2 && x <= x2 + 2 && y >= y0 && y <= y0 + ROW_H)
        return { it, part: x2 - x1 < 20 ? 'body' : x <= x1 + EDGE ? 'left' : x >= x2 - EDGE ? 'right' : 'body' };
    }
    return null;
  }
  const magnet = (t, skip) => {                              // 再生位置・0秒・他クリップの端に吸着(6px以内)
    const th = 6 / pps(); let best = t, bd = th;
    [FH.state.time, 0, ...FH.state.project.items.filter(i => !skip.has(i.id)).flatMap(i => [i.start, i.start + i.duration])]
      .forEach(c => { if (Math.abs(c - t) < bd) { bd = Math.abs(c - t); best = c; } });
    return best;
  };
  const seekLoop = ts => {                                   // 再生線ドラッグ: 端の外へ引っ張る距離が長いほど速くスクロール
    if (!seeking) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = seekX < 0 ? -1 : seekX > W ? 1 : 0;
    if (dir) viewStart = FH.clamp(viewStart + dir * Math.min(4000, 40 + (seekX < 0 ? -seekX : seekX - W) * 8) * dt / pps(), -W * 0.5 / pps(), FH.duration());
    FH.setTime(tOf(FH.clamp(seekX, 0, W))); invalidate(); requestAnimationFrame(seekLoop);
  };

  /* 範囲選択: 始点は時間位置(t0)と行方向の位置(cy)で持つので、スクロールしても追従してずれる */
  let mq = null;
  const bounds = it => { const x1 = xOf(it.start), y = rowY(it.layer); return [x1, y, Math.max(xOf(it.start + it.duration), x1 + 4), y + ROW_H]; };
  const mqRect = () => {
    const y0 = mq.cy - scrollY;
    return { x1: Math.min(xOf(mq.t0), mq.x), x2: Math.max(xOf(mq.t0), mq.x), y1: Math.min(y0, mq.y), y2: Math.max(y0, mq.y) };
  };
  function applyMq() {
    const r = mqRect();
    const ids = FH.state.project.items.filter(it => { const b = bounds(it); return b[0] <= r.x2 && b[2] >= r.x1 && b[1] <= r.y2 && b[3] >= r.y1; }).map(it => it.id);
    const key = ids.join(','); if (key === mq.key) return;
    mq.key = key; select([...mq.base, ...ids]);
  }
  const mqLoop = ts => {
    if (!mq) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = mq.x < 0 ? -1 : mq.x > W ? 1 : 0;
    if (dir) viewStart = FH.clamp(viewStart + dir * 240 * dt / pps(), -W * 0.5 / pps(), FH.duration());
    if (mq.moved) applyMq();
    invalidate(); requestAnimationFrame(mqLoop);
  };

  function dragTo(x, y, free) {
    const d = drag;
    if (!d.moved && Math.hypot(x - d.x0, y - d.y0) < 3) return;
    d.moved = true;
    const P = FH.state.project, its = P.items.filter(i => d.orig.has(i.id)), dt = tOf(x) - d.t0;
    const pit = its.find(i => i.id === d.id), po = d.orig.get(d.id), hasSrc = pit.type !== 'image';
    if (d.mode === 'left') {
      const lo = hasSrc ? Math.max(0, po.start - po.trimIn) : 0, hi = po.start + po.duration - MIN_DUR;
      const sNew = FH.clamp(r3(snapItem(po.start + dt, d.orig, free)), lo, hi);
      pit.start = sNew; pit.duration = r3(po.start + po.duration - sNew);
      if (hasSrc) pit.trimIn = r3(po.trimIn + sNew - po.start);
    } else if (d.mode === 'right') {
      const md = P.media[pit.mediaId]?.duration, max = hasSrc && md ? md - po.trimIn : Infinity;
      const end = snapItem(po.start + po.duration + dt, d.orig, free);
      pit.duration = r3(FH.clamp(end - po.start, MIN_DUR, max));
    } else {
      const ns = po.start + dt, e0 = ns + po.duration;
      const ds = free ? 0 : magnet(ns, d.orig) - ns, de = free ? 0 : magnet(e0, d.orig) - e0;
      let adj = ds && de ? (Math.abs(ds) <= Math.abs(de) ? ds : de) : ds || de;
      if (!adj && !free) adj = snapGrid(ns) - ns;
      let delta = ns + adj - po.start, dRow = Math.round((y - d.y0) / (ROW_H + GAP));
      its.forEach(i => { const o = d.orig.get(i.id); delta = Math.max(delta, -o.start); dRow = Math.max(dRow, -o.layer); });
      its.forEach(i => { const o = d.orig.get(i.id); i.start = r3(o.start + delta); i.layer = o.layer + dRow; });

  cv.addEventListener('pointerdown', e => {
    const x = lx(e), y = ly(e), s = FH.state;
    cv.setPointerCapture(e.pointerId); justDragged = false;
    if (y <= RULER_H) { seeking = true; seekX = x; lastTs = performance.now(); requestAnimationFrame(seekLoop); return; }
    if (s.pasting) { FH.pasteAt('item', Math.max(0, e.altKey ? tOf(x) : snapGrid(tOf(x))), Math.max(0, rowAt(y))); return; }   // 貼り付け待ち
    const h = hit(x, y), multi = e.shiftKey || e.ctrlKey || e.metaKey;
    if (!h) {
      if (s.tool === 'cursor') {                                   // 空白からドラッグで範囲選択(クリックだけなら選択解除)
        mq = { t0: tOf(x), cy: y + scrollY, sx: x, sy: y, x, y, multi, base: multi ? new Set(s.selection) : new Set(), moved: false, key: null };
        lastTs = performance.now(); requestAnimationFrame(mqLoop);
      }
      return;
    }   // シングルノーツツールは click で読み込み
    const id = h.it.id, sel = new Set(s.selection), collapse = !multi && sel.has(id) && sel.size > 1;
    if (collapse) FH.state.multiHint = { ids: [...sel], at: performance.now() };   // ダブルクリックで一括編集を開くために覚えておく
    if (multi) { sel.has(id) ? sel.delete(id) : sel.add(id); select(sel); if (!sel.has(id)) return; }
    else if (!sel.has(id)) select([id]);
    const orig = new Map();
    s.project.items.forEach(i => { if (FH.state.selection.has(i.id)) orig.set(i.id, { start: i.start, duration: i.duration, trimIn: i.trimIn, layer: i.layer }); });
    drag = { mode: h.part, id, t0: tOf(x), x0: x, y0: y, moved: false, collapse, orig };
  });
  cv.addEventListener('pointermove', e => {
    const x = lx(e), y = ly(e);
    if (seeking) { seekX = x; return; }
    if (mq) { mq.x = x; mq.y = y; if (!mq.moved && Math.hypot(x - mq.sx, y - mq.sy) >= 3) mq.moved = true; if (mq.moved) applyMq(); return; }
    if (drag) { dragTo(x, y, e.altKey); return; }
    hover = { x, y, alt: e.altKey }; if (FH.state.pasting) invalidate();

    cv.style.cursor = y <= RULER_H ? 'ew-resize' : h ? (h.part === 'body' ? 'grab' : 'ew-resize') : 'default';
  });

    seeking = false;
    if (mq) { if (!mq.moved && !mq.multi) select([]); mq = null; invalidate(); }
    if (!drag) return;
    const P = FH.state.project;
    if (drag.moved) {
      if (P.items.some(a => P.items.some(b => overlap(a, b)))) {          // 重なったら元に戻す
        P.items.forEach(i => { const o = drag.orig.get(i.id); if (o) Object.assign(i, o); });
        FH.emit('chart');
      } else commit('移動');
      justDragged = true;
    } else if (drag.collapse) select([drag.id]);
    drag = null;
  };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('click', e => {                          // シングルノーツツール: クリック位置へ読み込み
    if (justDragged) { justDragged = false; return; }
    const x = lx(e), y = ly(e);
    if (FH.state.tool === 'single' && y > RULER_H && !hit(x, y)) openDialog({ t: Math.max(0, e.altKey ? tOf(x) : snapGrid(tOf(x))), row: rowAt(y) });
  });
  cv.addEventListener('pointerleave', () => { hover = null; invalidate(); });
  cv.addEventListener('dblclick', e => {
    const h = hit(lx(e), ly(e));
    if (h) FH.openConfig(h.it.id);
  });
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    const P = FH.state.project, sel = FH.state.selection, mine = P.items.filter(i => sel.has(i.id)).map(i => i.id);
    if (!mine.length) return;
    P.items = P.items.filter(i => !sel.has(i.id));

  });

/* ============================================================
   アイテムコンフィグ(ステップ6)
   ・タブ式: 譜面/アイテムをダブルクリック、または歯車で"譜面コンフィグ"タブを開く。× で閉じる
   ・入力部品: 下線テキスト欄(Enterで確定・Escで戻す) / スライダー(‹ › 付き) / 色 / チェック / 選択
   ・イージング: 項目(音量・座標など)を選び、キーフレーム(時刻・値・補間)を + で追加
   ・FH.evalParam(param, t) : ステップ7のプレビューが使う、時刻tでのパラメータ値
   ============================================================ */
(() => {
  const tabsEl = document.getElementById('ctabs'), form = document.getElementById('cfgForm'), devEl = document.getElementById('dev');
  const GLYPH = { audio: '♫', video: '▶', image: '▣' };
  const tabs = [{ key: 'dev' }, { key: 'sel' }]; let active = 'dev', lastSig = '', lastChartSig = '';
  const chartBox = document.getElementById('cfgChart');   // 「情報と設定」タブ内の譜面設定
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const r3 = v => Math.round(v * 1000) / 1000;
  const touch = () => { FH.set('dirty', true); FH.emit('chart'); };
  const commit = l => { touch(); FH.emit('commit', l); };
  const P = () => FH.state.project;
  const F = t => FH.time.format(t);

  /* ---------- イージング(補間)---------- */
  const EASE = { linear: u => u, in: u => u * u, out: u => 1 - (1 - u) * (1 - u),
                 inout: u => u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u),
                 in3: u => u ** 3, out3: u => 1 - (1 - u) ** 3, inout3: u => u < .5 ? 4 * u ** 3 : 1 - ((-2 * u + 2) ** 3) / 2,
                 sine: u => .5 - Math.cos(Math.PI * u) / 2, hold: () => 0 };
  const EASE_LABEL = { linear: 'リニア', in: '加速(2乗)', out: '減速(2乗)', inout: '加減速(2乗)', in3: '加速(3乗)', out3: '減速(3乗)', inout3: '加減速(3乗)', sine: 'サイン', hold: 'ステップ' };
  FH.EASE = EASE;
  FH.evalParam = (p, t) => {          // keys は時刻順。各キーの ease は「そのキーから次のキーまで」の補間
    const ks = p.keys, n = ks.length;
    if (!n) return p.base;
    if (t <= ks[0].t) return ks[0].v;
    if (t >= ks[n - 1].t) return ks[n - 1].v;
    let i = 0; while (ks[i + 1].t <= t) i++;
    const a = ks[i], b = ks[i + 1];
    return a.v + (b.v - a.v) * (EASE[a.ease] || EASE.linear)((t - a.t) / (b.t - a.t));
  };

  /* ---------- パラメータ定義(値は内部値。表示は scale 倍して unit を付ける) ---------- */
  const pct = (label, lo, hi, min, max, step = .01) => ({ label, unit: '%', scale: 100, lo, hi, min, max, step });
  const VIS = [
    { k: 'x', ...pct('X座標', -10, 10, -1, 1) }, { k: 'y', ...pct('Y座標', -10, 10, -1, 1) },
    { k: 'scaleX', ...pct('拡大率X', 0, 20, 0, 4) }, { k: 'scaleY', ...pct('拡大率Y', 0, 20, 0, 4) },
    { k: 'rotation', label: '回転角', unit: '°', scale: 1, lo: -3600, hi: 3600, min: -360, max: 360, step: 1, digits: 1 },
    { k: 'opacity', ...pct('透明度', 0, 1, 0, 1) },
    { k: 'anchorX', ...pct('基準点X', -5, 5, 0, 1) }, { k: 'anchorY', ...pct('基準点Y', -5, 5, 0, 1) }
  ];
  const VOL = { k: 'volume', ...pct('音量', 0, 4, 0, 2) };
  const specsFor = t => t === 'audio' ? [VOL] : t === 'video' || t === 'group' ? [...VIS, VOL] : VIS;

  /* ---------- 入力部品 ---------- */
  function field({ get, set, fmt, parse, cls = '', disabled = false, label = '値' }) {
    const i = el('input', 'u-in ' + cls); i.type = 'text'; i.spellcheck = false; i.value = fmt(get()); i.disabled = disabled;
    i.setAttribute('aria-label', label);
    i.addEventListener('keydown', e => {
      if (e.key === 'Enter') i.blur();
      else if (e.key === 'Escape') { i.value = fmt(get()); i.blur(); }
    });
    i.addEventListener('change', () => {
      const v = parse(i.value);
      if (v != null && set(v) !== false) commit('設定変更');
      i.value = fmt(get());
    });
    return i;
  }
  const timeField = (get, set, o = {}) => field({ get, set, fmt: F, parse: FH.time.parse, label: '時刻', ...o });
  const numFmt = s => v => `${+(v * s.scale).toFixed(s.digits ?? 2)}${s.unit}`;
  const numParse = s => str => {
    const n = parseFloat(String(str).replace(/[^\d.\-+eE]/g, ''));
    return isFinite(n) ? FH.clamp(n / s.scale, s.lo, s.hi) : null;
  };
  const numField = (get, set, s, o = {}) => field({ get, set, fmt: numFmt(s), parse: numParse(s), label: s.label, ...o });
  const textField = (get, set, label) => field({ get, set, fmt: s => s, parse: s => s, cls: 'wide', label });

  function slider(s, get, set) {
    const box = el('div', 'cfg-slider'), r = el('input'), dec = el('button', null, '‹'), inc = el('button', null, '›');
    r.type = 'range'; r.min = s.min; r.max = s.max; r.step = s.step; r.value = get(); r.setAttribute('aria-label', s.label);
    dec.setAttribute('aria-label', s.label + 'を下げる'); inc.setAttribute('aria-label', s.label + 'を上げる');
    const txt = numField(get, v => { set(v); r.value = v; }, s);
    const sync = () => { r.value = get(); txt.value = numFmt(s)(get()); };
    r.addEventListener('input', () => { set(+r.value); sync(); touch(); });
    r.addEventListener('change', () => commit('設定変更'));
    const nudge = d => () => { set(FH.clamp(r3(get() + d * s.step), s.lo, s.hi)); sync(); commit('設定変更'); };
    dec.onclick = nudge(-1); inc.onclick = nudge(1);
    box.append(dec, r, inc, txt);
    return box;
  }
  function colorField(get, set) {
    const i = el('input'); i.type = 'color'; i.value = get(); i.setAttribute('aria-label', '色');
    i.oninput = () => { set(i.value); touch(); };
    i.onchange = () => commit('色変更');
    return i;
  }
  function check(text, get, set) {
    const l = el('label', 'cfg-check'), c = el('input'); c.type = 'checkbox'; c.checked = get();
    c.onchange = () => { set(c.checked); commit('設定変更'); };
    l.append(c, text); return l;
  }
  function select(options, get, set, label) {
    const s = el('select', 'u-sel'); s.setAttribute('aria-label', label);
    options.forEach(([v, t]) => s.add(new Option(t, v))); s.value = get();
    s.onchange = () => { set(s.value); commit('設定変更'); };
    return s;
  }
  const row = (label, ...nodes) => { const r = el('div', 'cfg-row'); r.append(el('label', null, label), ...nodes); return r; };
  const head = t => el('div', 'cfg-h', t);

  /* ---------- アイテム(動画・画像・音声)のフォーム ---------- */
  const easeSel = {};   // アイテムごとに選択中のイージング項目を覚えておく
  const clash = it => P().items.some(o => o !== it && o.layer === it.layer && o.start < it.start + it.duration - 1e-6 && it.start < o.start + o.duration - 1e-6);

  /* エフェクトの値は 'fx:エフェクトID:名前' というキーで、本体の値と同じキーフレーム編集(イージング)の対象になる */
  const effSpecs = it => (it.effects || []).flatMap(eff => {
    const d = FH.FX[eff.type];
    return d ? d.params.map(sp => ({ ...sp, k: `fx:${eff.id}:${sp.k}`, label: `${d.label}: ${sp.label}` })) : [];
  });
  const paramOf = (it, k) => {
    if (!k.startsWith('fx:')) return it.params[k];
    const [, id, pk] = k.split(':'), eff = (it.effects || []).find(e => e.id === id);
    return eff && (eff.params[pk] || (eff.params[pk] = FH.param((FH.FX[eff.type].params.find(q => q.k === pk) || {}).def || 0)));
  };
  const spanOf = h => {                                            // キーフレームを打てる時間の範囲(グループはメンバー全体)
    if (h.type !== 'group') return [h.start, h.start + h.duration];
    const ms = P().items.filter(i => i.groupId === h.id);
    return ms.length ? [Math.min(...ms.map(i => i.start)), Math.max(...ms.map(i => i.start + i.duration))] : [0, FH.duration()];
  };
  /* ---------- グループ ---------- */
  const groupOf = it => it.groupId ? (P().groups || []).find(g => g.id === it.groupId) : null;
  const newGroupFor = items => {
    const p = P(); p.groups = p.groups || [];
    const g = FH.newGroup('グループ' + (p.groups.length + 1)); p.groups.push(g);
    items.forEach(o => { o.groupId = g.id; }); return g;
  };
  function membershipSelect(items) {                                // 所属グループの選択(なし / 既存 / 新しいグループ)
    const gs = P().groups || [], cur = new Set(items.map(o => o.groupId || ''));
    const sel = select([['', 'なし'], ...gs.map(g => [g.id, g.name]), ['__new', '＋ 新しいグループに入れる']],
      () => cur.size === 1 ? [...cur][0] : '',
      v => { if (v === '__new') newGroupFor(items); else items.forEach(o => { if (v) o.groupId = v; else delete o.groupId; }); }, 'グループ');
    sel.addEventListener('change', () => renderForm());
    return sel;
  }
  function groupNodes(g) {                                          // グループ全体の値・エフェクト・キーフレーム
    const members = P().items.filter(i => i.groupId === g.id);
    const n = [head(`グループ「${g.name}」の設定(メンバー${members.length}個にまとめて適用)`)];
    n.push(row('名前', textField(() => g.name, v => { g.name = v.trim() || g.name; }, 'グループ名')));
    specsFor('group').forEach(sp => n.push(row(sp.label, slider(sp, () => g.params[sp.k].base, v => { g.params[sp.k].base = v; }))));
    n.push(...effectsNodes(g), easingSection(g));
    const b = el('button', 'ex-btn', 'グループを解除');
    b.onclick = () => {
      const p = P(); p.items.forEach(i => { if (i.groupId === g.id) delete i.groupId; });
      p.groups = (p.groups || []).filter(x => x.id !== g.id); commit('グループ解除'); renderForm();
    };
    n.push(row('', b));
    return n;
  }

  function effectsNodes(it) {                                      // エフェクトの追加・並べ替え・削除と、値(スライダー)の編集
    it.effects = it.effects || [];
    const n = [head('エフェクト(上から順に適用)')];
    if (!FH.fxFilterOk) n.push(row('', el('span', 'cfg-empty', 'このブラウザはフィルター描画に対応していないため、ぼかし・明るさなどの色調整、ドロップシャドウ、グローは反映されません。')));
    const add = select([['', '＋ エフェクトを追加…'], ...Object.entries(FH.FX).map(([k, d]) => [k, d.label])], () => '', v => { if (v) it.effects.push(FH.newEffect(v)); }, 'エフェクトを追加');
    add.addEventListener('change', () => renderForm());
    n.push(row('', add));
    it.effects.forEach((eff, i) => {
      const d = FH.FX[eff.type]; if (!d) return;
      d.params.forEach(sp => { if (!eff.params[sp.k]) eff.params[sp.k] = FH.param(sp.def); });
      eff.opts = eff.opts || {};
      const hd = el('div', 'cfg-row'), on = el('input');
      on.type = 'checkbox'; on.checked = eff.on !== false; on.setAttribute('aria-label', d.label + 'を有効にする');
      on.onchange = () => { eff.on = on.checked; commit('設定変更'); };
      const btn = (t, tip, fn) => { const b = el('button', 'ex-btn', t); b.style.padding = '1px 8px'; b.title = tip; b.setAttribute('aria-label', tip); b.onclick = fn; return b; };
      const swap = j => { if (j < 0 || j >= it.effects.length) return; [it.effects[i], it.effects[j]] = [it.effects[j], it.effects[i]]; commit('エフェクトの順序'); renderForm(); };
      hd.append(on, el('strong', null, d.label), btn('▲', '上へ', () => swap(i - 1)), btn('▼', '下へ', () => swap(i + 1)),
        btn('×', 'エフェクトを削除', () => { it.effects.splice(i, 1); commit('エフェクト削除'); renderForm(); }));
      n.push(hd);
      d.params.forEach(sp => n.push(row(sp.label + (eff.params[sp.k].keys.length ? ' ◆' : ''), slider(sp, () => eff.params[sp.k].base, v => { eff.params[sp.k].base = v; }))));
      (d.opts || []).forEach(o => n.push(row(o.label, o.type === 'color'
        ? colorField(() => eff.opts[o.k] ?? o.def, v => { eff.opts[o.k] = v; })
        : select(o.options, () => eff.opts[o.k] ?? o.def, v => { eff.opts[o.k] = v; }, o.label))));
    });
    n.push(row('', el('span', 'cfg-empty', '◆ のある値はキーフレームが優先されます。キーフレームは、下の「イージング」で項目(例: 「ぼかし: 半径」)を選んで追加します。')));
    return n;
  }

  function easingSection(it) {
    const specs = [...specsFor(it.type), ...effSpecs(it)], box = el('div');   // 本体の値 + エフェクトの値
    let cur = specs.some(s => s.k === easeSel[it.id]) ? easeSel[it.id] : specs[0].k;
    const dd = select(specs.map(s => [s.k, s.label]), () => cur, v => { cur = v; easeSel[it.id] = v; draw(); }, 'イージング項目');
    dd.onchange = () => { cur = dd.value; easeSel[it.id] = cur; draw(); };      // 選択だけ(保存対象の変更ではない)
    const list = el('div', 'kf-list'), add = el('button', 'kf-add', '+');
    add.title = 'キーフレームを追加(現在の再生位置)'; add.setAttribute('aria-label', 'キーフレームを追加');
    function draw() {
      list.textContent = '';
      const spec = specs.find(s => s.k === cur), p = paramOf(it, cur);
      p.keys.sort((a, b) => a.t - b.t);
      p.keys.forEach((k, idx) => {
        const r = el('div', 'kf'), del = el('button', 'kf-del', '×');
        del.setAttribute('aria-label', 'キーフレームを削除');
        del.onclick = () => { p.keys.splice(idx, 1); draw(); commit('キーフレーム削除'); };
        const cs = select(Object.keys(EASE).map(e => [e, EASE_LABEL[e]]), () => k.ease || 'linear', v => { k.ease = v; }, '補間');
        r.append(
          timeField(() => k.t, v => { k.t = r3(Math.max(0, v)); p.keys.sort((a, b) => a.t - b.t); setTimeout(draw); }),
          numField(() => k.v, v => { k.v = v; }, spec), cs, del);
        list.append(r);
      });
      if (!p.keys.length) list.append(el('div', 'cfg-empty', 'キーフレームなし(上の値が常に使われます)'));
    }
    add.onclick = () => {
      const [sa, sb] = spanOf(it), p = paramOf(it, cur), t = r3(FH.clamp(FH.state.time, sa, sb));
      if (p.keys.some(k => Math.abs(k.t - t) < 1e-3)) return;
      p.keys.push({ t, v: FH.evalParam(p, t), ease: 'linear' });
      p.keys.sort((a, b) => a.t - b.t); draw(); commit('キーフレーム追加');
    };
    draw();
    box.append(head('イージング'), dd, list, add);
    return box;
  }

  function itemForm(it) {
    const md = P().media[it.mediaId]?.duration, av = it.type !== 'image', n = [];
    const guard = apply => v => { const old = { s: it.start, d: it.duration }; apply(v); if (clash(it)) { it.start = old.s; it.duration = old.d; return false; } };
    n.push(head(`${GLYPH[it.type]} ${it.name}`),
      row('配置時刻', timeField(() => it.start, guard(v => { it.start = r3(Math.max(0, v)); }))),
      row('長さ', timeField(() => it.duration, guard(v => {
        const max = av && md ? md - it.trimIn : Infinity; it.duration = r3(FH.clamp(v, 0.05, max));
      }))));
    if (av) n.push(row('切り出し開始', timeField(() => it.trimIn, v => {
      it.trimIn = r3(FH.clamp(v, 0, md ? Math.max(0, md - it.duration) : 1e6));
    })));
    n.push(head('値(キーフレームがなければこの値を使用)'));
    specsFor(it.type).forEach(s => n.push(row(s.label, slider(s, () => it.params[s.k].base, v => { it.params[s.k].base = v; }))));
    if (it.type !== 'audio') n.push(...effectsNodes(it));
    n.push(easingSection(it));
    n.push(head('グループ'), row('所属', membershipSelect([it])));       // グループに入れると、エフェクトやキーフレームをまとめて掛けられる
    const grp = groupOf(it); if (grp) n.push(...groupNodes(grp));
    if (it.type === 'video') {                                         // 動画の動きを追跡して、Funscriptのキーフレームを作る
      const tb = el('button', 'ex-btn', 'モーショントラッキング → Funscript…');
      tb.onclick = () => FH.track.open(it);
      n.push(head('Funscript'), row('', tb));
    }
    return n;
  }

  /* ---------- 譜面アイテムのフォーム ---------- */
  function chartItemForm({ kind, o }) {
    const c = P().chart, n = [];
    const t0 = (get, set, disabled) => row('配置時刻', timeField(get, set, { disabled }));
    if (kind === 'single') {
      n.push(head('シングルノーツ'), t0(() => o.time, v => { o.time = r3(Math.max(0, v)); }),
        row('色', colorField(() => o.color, v => { o.color = v; FH.state.lastNoteColor = v; })));
    } else if (kind === 'long') {
      n.push(head('ロングノーツ'),
        row('始点の時刻', timeField(() => o.start.time, v => { if (v > o.end.time - 0.001) return false; o.start.time = r3(Math.max(0, v)); })),
        row('始点の色', colorField(() => o.start.color, v => { o.start.color = v; FH.state.lastNoteColor = v; })),
        row('終点の時刻', timeField(() => o.end.time, v => { if (v < o.start.time + 0.001) return false; o.end.time = r3(v); })),
        row('終点の色', colorField(() => o.end.color, v => { o.end.color = v; FH.state.lastNoteColor = v; })));
    } else if (kind === 'event') {
      n.push(head('イベント'), t0(() => o.time, v => { o.time = r3(Math.max(0, v)); }),
        row('色', colorField(() => o.color, v => { o.color = v; })),
        row('表示テキスト', textField(() => o.text, v => { o.text = v; }, '表示テキスト')),
        row('', check('無効化モード(イベントを終了するタイミングとして扱う)', () => o.disable, v => { o.disable = v; })));
    } else {
      const list = kind === 'bpm' ? c.bpmEvents : c.timeSigEvents, locked = o.time <= 1e-6;
      const setT = v => { const t = r3(v); if (t < 0.001 || list.some(e => e !== o && Math.abs(e.time - t) < 1e-6)) return false; o.time = t; };
      n.push(head(kind === 'bpm' ? 'BPM' : '拍子'), t0(() => o.time, setT, locked));
      if (locked) n.push(row('', el('span', 'cfg-empty', '0秒の項目は時刻を変更できません')));
      if (kind === 'bpm') n.push(row('BPM', numField(() => o.bpm, v => { o.bpm = v; }, { label: 'BPM', unit: '', scale: 1, lo: 1, hi: 999 })));
      else n.push(row('拍子',
        numField(() => o.num, v => { o.num = Math.round(v); }, { label: '拍数', unit: '', scale: 1, lo: 1, hi: 64, digits: 0 }),
        el('span', null, '/'),
        select([1, 2, 4, 8, 16, 32].map(d => [d, d]), () => o.den, v => { o.den = +v; }, '分母')));
    }
    return n;
  }

  /* ---------- Funscript ---------- */
  function keyForm(o) {
    const n = [head('Funscript キーフレーム')], lnk = o.n ? locate(o.n) : null;
    n.push(row('時刻', timeField(() => o.t, v => { o.t = r3(Math.max(0, v)); if (o.n) o.lt = true; })),
      row('位置', numField(() => o.pos, v => { o.pos = v; if (o.n) o.lp = true; }, { label: '位置', unit: '%', scale: 1, lo: 0, hi: 100, digits: 1 })));
    const curve = el('canvas');                                    // 次の区間のイージング: プルダウン、または式 f(u) で指定
    curve.width = 168; curve.height = 64; curve.style.cssText = 'width:168px;height:64px;border:1px solid var(--edge);border-radius:4px';
    const drawCurve = () => {
      const g = curve.getContext('2d'), fn = FH.fun.easeOf(o), st = getComputedStyle(document.documentElement);
      g.clearRect(0, 0, 168, 64); g.strokeStyle = st.getPropertyValue('--edge').trim(); g.strokeRect(8.5, 8.5, 151, 47);
      g.strokeStyle = st.getPropertyValue('--green').trim(); g.lineWidth = 2; g.beginPath();
      for (let i = 0; i <= 60; i++) { const u = i / 60, v = Math.max(-0.3, Math.min(1.3, fn(u))), x = 8 + u * 152, y = 56 - v * 48; if (i) g.lineTo(x, y); else g.moveTo(x, y); }
      g.stroke();
    };
    const es = select([...Object.keys(EASE).map(e => [e, EASE_LABEL[e]]), ['formula', '式で指定']], () => o.e || 'sine',
      v => { o.e = v; if (v === 'formula' && !o.f) o.f = 'u'; }, '次の区間のイージング');
    es.addEventListener('change', () => renderForm());
    n.push(row('次の区間', es));
    if (o.e === 'formula') {
      n.push(row('式 f(u)', field({ get: () => o.f || 'u',
        set: v => { if (!FH.fun.compileFormula(v)) { FH.toast('式を解釈できません'); return false; } o.f = v; drawCurve(); },
        fmt: x => x, parse: x => x.trim(), cls: 'wide', label: '式 f(u)' })));
      n.push(row('', el('span', 'cfg-empty', 'u は区間内の進み具合(0→1)、結果は位置の変化割合(0→1)。例: u*u / sin(u*pi/2) / pow(u,3) / (1-cos(pi*u))/2 。関数: sin cos tan asin acos atan abs sqrt pow min max exp log floor ceil round sign、定数: pi e')));
    }
    n.push(row('カーブ', curve)); drawCurve();
    if (lnk) {
      const at = lnk.kind === 'long' ? lnk.o.start.time : lnk.o.time;
      n.push(row('連動ノーツ', el('span', null, `${lnk.kind === 'long' ? 'ロング' : 'シングル'} ${F(at)} の${{ a: '始まり', b: 'ノーツの位置', c: '戻り' }[o.r]}`)));
      n.push(row('', el('span', 'cfg-empty', o.lt || o.lp ? '手動で編集済み(ノーツを動かしても、編集した項目は動きません)' : 'ノーツに連動して自動で動きます')));
      const b = el('button', 'ex-btn', '自動に戻す');
      b.onclick = () => { delete o.lt; delete o.lp; commit('キーフレームを自動に戻す'); renderForm(); };
      n.push(row('', b));
    } else n.push(row('', el('span', 'cfg-empty', '手動で追加したキーフレームです')));
    return n;
  }
  function funSettingsForm() {
    const s = P().funscript.settings;
    const sl = (label, k, spec) => row(label, slider(spec, () => s[k], v => { s[k] = v; }));
    const pc = label => ({ label, unit: '%', scale: 1, lo: 0, hi: 100, min: 0, max: 100, step: 1, digits: 0 });
    const b = el('button', 'ex-btn', 'すべて自動に戻す');
    b.onclick = () => {
      if (!confirm('手動で編集・追加したキーフレームをすべて破棄し、ノーツから自動で作り直します。よろしいですか?')) return;
      const f = P().funscript; f.keys = []; f.gen = {}; commit('Funscriptを自動に戻す'); renderForm();
    };
    const restSel = select([['top', '平時は上端 → ノーツで下端へ落ち込む'], ['bottom', '平時は下端 → ノーツで上端へ上がる']],
      () => s.restTop === false ? 'bottom' : 'top', v => { s.restTop = v === 'top'; }, '上下の基準');
    return [head('ノーツからの自動割り当て'), row('上下の基準', restSel),
      sl('1往復の時間', 'strokeMs', { label: 'シングルノーツ1往復の時間', unit: 'ms', scale: 1, lo: 50, hi: 5000, min: 100, max: 1500, step: 10, digits: 0 }),
      sl('下端の位置', 'lo', pc('下端の位置')), sl('上端の位置', 'hi', pc('上端の位置')),
      head('速度制限'),
      row('', check('速すぎる動きを抑える(表示と出力に反映)', () => s.limitOn, v => { s.limitOn = v; })),
      sl('最大速度', 'maxSpeed', { label: '最大速度', unit: '%/秒', scale: 1, lo: 10, hi: 20000, min: 100, max: 2000, step: 10, digits: 0 }),
      head('キーフレーム'), row('', b)];
  }

  /* ---------- 一括編集(複数選択してダブルクリック): 選択中のアイテムに共通する項目だけを表示 ---------- */
  function multiForm() {
    const sel = [...FH.state.selection].map(id => locate(id)).filter(Boolean), n = [head('一括編集')];
    if (sel.length < 2) { n.push(row('', el('span', 'cfg-empty', '複数のアイテムを選択してダブルクリックすると、共通する項目をまとめて変更できます'))); return n; }
    const kinds = sel.map(f => f.kind), os = sel.map(f => f.o), allOf = (...ks) => kinds.every(k => ks.includes(k));
    const NAMES = { single: 'シングルノーツ', long: 'ロングノーツ', event: 'イベント', bpm: 'BPM', sig: '拍子', item: 'メディア', key: 'Funscriptキーフレーム' };
    const cnt = {}; kinds.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    n.push(row('選択中', el('span', null, Object.entries(cnt).map(([k, c]) => `${NAMES[k]}×${c}`).join(' / '))),
      row('', el('span', 'cfg-empty', '選択したアイテムに共通する項目だけを表示します。変更はすべてのアイテムに反映されます(値が異なる場合は、先頭のアイテムの値を表示)。')));

    // 時刻: 全種類に共通。同じ時刻にそろえても意味がないので「ずらす量」として扱う
    const startOf = f => f.kind === 'long' ? f.o.start.time : f.kind === 'item' ? f.o.start : f.kind === 'key' ? f.o.t : f.o.time;
    n.push(row('時刻をずらす', numField(() => 0, d => {
      let minT = Infinity; sel.forEach(f => { if (f.kind !== 'bpm' && f.kind !== 'sig') minT = Math.min(minT, startOf(f)); });
      if (isFinite(minT)) d = Math.max(d, -minT);                          // 先頭が0秒より前に出ないようにする
      const c = P().chart, itemStarts = sel.filter(f => f.kind === 'item').map(f => [f.o, f.o.start]);
      sel.forEach(f => {
        const o = f.o;
        if (f.kind === 'single' || f.kind === 'event') o.time = r3(o.time + d);
        else if (f.kind === 'long') { o.start.time = r3(o.start.time + d); o.end.time = r3(o.end.time + d); }
        else if (f.kind === 'item') o.start = r3(o.start + d);

        else {                                                             // BPM・拍子: 0秒のものは動かさず、同じ時刻には置かない

  /* ---------- 譜面の設定(「情報と設定」タブの中に表示) ---------- */

    if ((o = c.bpmEvents.find(n => n.id === id))) return { kind: 'bpm', o };

  const sig = () => active === 'sel' ? JSON.stringify([...FH.state.selection].map(id => (locate(id) || {}).o)) : active === 'chart' ? JSON.stringify(P().settings.chart) : active === 'fun' ? JSON.stringify(P().funscript.settings) : JSON.stringify(locate(active)?.o);

      : active === 'sel' ? (ids.length === 0 ? [head('コンフィグ'), row('', el('span', 'cfg-empty', '譜面・メディア・Funscriptのアイテムを選択すると、ここに設定が表示されます。複数選択すると、共通する項目をまとめて変更できます。'))]
                           : ids.length === 1 ? formFor(locate(ids[0])) : multiForm())

  function prune() {                       // 削除されたアイテムのタブを閉じる

    gone.forEach(t => { tabs.splice(tabs.indexOf(t), 1); });

  FH.on('config', e => openTab(e.id));
  FH.openConfig = id => {            // ダブルクリック: そのアイテム(複数選択中ならその選択)にして、コンフィグタブへ切り替える

/* ============================================================
   プレビューと再生(ステップ7)
   ・FH.renderFrame(ctx, w, h, t): 時刻tの1フレームを描く(メディア合成 + 譜面を最上レイヤー)。エクスポート(ステップ9)も同じ関数を使う
   ・映像: 行番号の大きい(下の)アイテムから先に描く。画像・動画は枠内に収めた大きさ(contain)が拡大率100%
   ・音声: Web Audio(FH.audio.master)経由で再生。音量(キーフレーム込み)を毎フレーム反映
   ・譜面: 中央のドットから左右に鏡映しでノーツが流れ、到達で消える。ロングは始点到達で帯が縮み、終点で消える
   ・出力の縦横比は FH.OUT(16:9)。プレビューは枠内に黒帯付きで表示
   ============================================================ */
(() => {
  const panel = document.getElementById('preview');
  panel.innerHTML = '<canvas role="img" aria-label="プレビュー"></canvas>';
  const cv = panel.firstChild, ctx = cv.getContext('2d');
  cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
  FH.OUT = { w: 1280, h: 720 };
  let W = 0, H = 0, dpr = 1, queued = false;
  const invalidate = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };

  /* ---------- 音声(Web Audio) ---------- */
  const audio = FH.audio = {
    ctx: null, master: null,
    ensure() {                                   // 書き出し側は master にも接続できる
      if (!this.ctx) {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        } catch (e) { this.ctx = null; }
      }
      return this.ctx;
    }
  };

  /* ---------- メディア要素 ---------- */
  const els = new Map();                         // アイテムID -> {el, mediaId, gain}
  const imgs = new Map();                        // メディアID -> Image
  const imgFor = it => {
    let im = imgs.get(it.mediaId);
    if (!im) { im = new Image(); im.onload = invalidate; im.src = FH.mediaURL(it.mediaId); imgs.set(it.mediaId, im); }
    return im;
  };
  function elFor(it) {
    let e = els.get(it.id);
    if (e && e.mediaId === it.mediaId) return e;
    const el = document.createElement(it.type === 'audio' ? 'audio' : 'video');
    el.preload = 'auto'; el.playsInline = true; el.src = FH.mediaURL(it.mediaId);
    ['seeked', 'loadeddata'].forEach(n => el.addEventListener(n, invalidate));
    let gain = null; const ac = audio.ensure();
    if (ac) { gain = ac.createGain(); ac.createMediaElementSource(el).connect(gain); gain.connect(audio.master); }
    els.set(it.id, e = { el, mediaId: it.mediaId, gain });
    return e;
  }
  function dispose(id) { const e = els.get(id); if (e) { e.el.pause(); e.el.removeAttribute('src'); e.el.load(); els.delete(id); } }

  // 現在時刻に合わせて、動画・音声要素の再生/停止・位置・速度・音量を揃える
  function syncMedia() {
    const s = FH.state, t = s.time, P = s.project;
    [...els.keys()].forEach(id => { const it = P.items.find(i => i.id === id); if (!it || els.get(id).mediaId !== it.mediaId) dispose(id); });
    P.items.forEach(it => {
      if (it.type === 'image') return;
      const active = t >= it.start && t < it.start + it.duration;
      if (!active) { const e = els.get(it.id); if (e && !e.el.paused) e.el.pause(); return; }
      const e = elFor(it), el = e.el, target = it.trimIn + (t - it.start);
      el.playbackRate = FH.clamp(s.speed, 0.0625, 16);
      const grp = it.groupId && (P.groups || []).find(g => g.id === it.groupId);               // グループの音量も掛ける
      const vol = (it.params.volume ? Math.max(0, FH.evalParam(it.params.volume, t)) : 1) * (grp && grp.params.volume ? Math.max(0, FH.evalParam(grp.params.volume, t)) : 1);
      if (e.gain) e.gain.gain.value = vol; else el.volume = Math.min(1, vol);
      if (s.playing) {
        if (el.paused) { if (Math.abs(el.currentTime - target) > 0.05) el.currentTime = target; el.play().catch(() => {}); }
        else if (Math.abs(el.currentTime - target) > 0.25) el.currentTime = target;     // ずれたら合わせ直す
      } else {
        if (!el.paused) el.pause();
        if (Math.abs(el.currentTime - target) > 0.02) el.currentTime = target;

  /* ---------- 描画: 1フレーム ---------- */
  const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) || 0);

  };

  /* ---------- 画像・動画のエフェクト ----------

     ・geom(振動・トリミング): 描く位置・範囲を変える
     ・post(モザイク・RGBずらし等): いったん別Canvasに描いてから、その上で画像処理してから重ねる

  };
  const hexRgba = (hex, a) => { const v = [1, 3, 5].map(i => parseInt((hex || '#000000').slice(i, i + 2), 16) || 0); return `rgba(${v[0]},${v[1]},${v[2]},${a})`; };

      case 'contrast': return `contrast(${u(v('v'))})`;
      case 'saturate': return `saturate(${u(v('v'))})`;
      case 'hue': return `hue-rotate(${v('v')}deg)`;
      case 'gray': return `grayscale(${FH.clamp(v('v'), 0, 1)})`;
      case 'sepia': return `sepia(${FH.clamp(v('v'), 0, 1)})`;

    }

  }
  let noiseSeed = null, noiseTile = null;
  function noiseCanvas(seed) {                                    // フィルムノイズの種(約24コマ/秒で切り替わる。シードから作るので毎回同じ)
    if (noiseSeed === seed && noiseTile) return noiseTile;

    cv.width = cv.height = n;

  function applyPost(eff, LY, lw, lh, bb, t, kk) {                // LY: 作業レイヤー({c: canvas, x: ctx})。座標は画素単位
    const L = LY.x, v = k => fxv(eff, k, t), tmp = name => { const o = layer(name, lw, lh); o.x.setTransform(1, 0, 0, 1, 0, 0); o.x.globalCompositeOperation = 'source-over'; o.x.globalAlpha = 1; o.x.clearRect(0, 0, lw, lh); return o; };

  }

  function drawSource(c, src, sw, sh, hd, w, h, t) {              // hd: params と effects を持つもの(メディアアイテム、またはグループ)
    const pv = k => FH.evalParam(hd.params[k], t), fit = Math.min(w / sw, h / sh), bw = sw * fit, bh = sh * fit;
    const m = c.getTransform && c.getTransform(), sc = m && typeof m.a === 'number' && m.a > 0 ? m.a : 1, kk = h / 720 * sc;   // 画素単位への換算
    const fx = (hd.effects || []).filter(e => e.on !== false && FH.FX[e.type]), kind = e => FH.FX[e.type].kind;
    const filt = FXOK ? fx.filter(e => kind(e) === 'filter').map(e => filterStr(e, t, kk)).join(' ') : '';
    const posts = fx.filter(e => kind(e) === 'post');
    let ox = 0, oy = 0, crop = null;
    fx.forEach(e => {
      if (e.type === 'wobble') {                                   // 振動: 画面幅に対する割合で揺らす
        const a = fxv(e, 'amp', t), hz = fxv(e, 'hz', t);

      } else if (e.type === 'crop') crop = { l: FH.clamp(fxv(e, 'l', t), 0, 1), r: FH.clamp(fxv(e, 'r', t), 0, 1), t: FH.clamp(fxv(e, 't', t), 0, 1), b: FH.clamp(fxv(e, 'b', t), 0, 1) };
    });
    const ax = pv('anchorX'), ay = pv('anchorY'), tx = w / 2 + pv('x') * w + ox, ty = h / 2 + pv('y') * h + oy, rot = pv('rotation') * Math.PI / 180, sx = pv('scaleX'), sy = pv('scaleY');
    const put = g => {                                             // 基準点を(中心+座標)に置き、回転・拡大して描く
      g.translate(tx, ty); g.rotate(rot); g.scale(sx, sy);
      if (crop) { g.beginPath(); g.rect(-ax * bw + crop.l * bw, -ay * bh + crop.t * bh, Math.max(0, bw * (1 - crop.l - crop.r)), Math.max(0, bh * (1 - crop.t - crop.b))); g.clip(); }
      g.drawImage(src, -ax * bw, -ay * bh, bw, bh);

    if (!posts.length) { c.save(); c.globalAlpha = opacity; if (filt) c.filter = filt; put(c); c.restore(); return; }

    const lw = Math.max(1, Math.ceil(w * sc)), lh = Math.max(1, Math.ceil(h * sc)), LY = layer('main', lw, lh), L = LY.x;
    L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = 'source-over'; L.globalAlpha = 1; L.clearRect(0, 0, lw, lh);
    L.save(); L.setTransform(sc, 0, 0, sc, 0, 0); if (filt) L.filter = filt; put(L); L.restore();
    const cs = [[0, 0], [bw, 0], [bw, bh], [0, bh]].map(([px, py]) => {   // 後処理の基準にする、画像の外接矩形(画素単位)

    });
    const bb = { x0: FH.clamp(Math.min(...cs.map(q => q[0])), 0, lw), x1: FH.clamp(Math.max(...cs.map(q => q[0])), 0, lw),

    posts.forEach(e => applyPost(e, LY, lw, lh, bb, t, kk));

  }

  function drawItem(c, it, w, h, t) {
    let src, sw, sh;

    else {

  }

  function drawGroup(c, g, members, w, h, t) {                    // メンバーをいったん1枚に重ね、その1枚にグループの値とエフェクトを掛ける
    const m = c.getTransform && c.getTransform(), sc = m && typeof m.a === 'number' && m.a > 0 ? m.a : 1;
    const lw = Math.max(1, Math.ceil(w * sc)), lh = Math.max(1, Math.ceil(h * sc)), GY = layer('grp', lw, lh), G = GY.x;
    G.setTransform(1, 0, 0, 1, 0, 0); G.globalCompositeOperation = 'source-over'; G.globalAlpha = 1; G.clearRect(0, 0, lw, lh);
    G.save(); G.setTransform(sc, 0, 0, sc, 0, 0);

  }

  const FONT_DEFAULT = '"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif';
  function drawChart(c, w, h, t) {
    const P = FH.state.project, S = P.settings.chart, k = h / 720;           // サイズ設定は720p基準のpx
    const cx = S.dotX * w, cy = S.dotY * h, th = S.laneAngle * Math.PI / 180, dx = Math.cos(th), dy = Math.sin(th);
    const exit = (sx, sy) => {                                                // ドットから枠の端までの距離
      let d = Infinity;
      if (sx > 1e-6) d = Math.min(d, (w - cx) / sx); else if (sx < -1e-6) d = Math.min(d, -cx / sx);
      if (sy > 1e-6) d = Math.min(d, (h - cy) / sy); else if (sy < -1e-6) d = Math.min(d, -cy / sy);
      return Math.max(0, d);
    };
    const Lr = exit(dx, dy), Ll = exit(-dx, -dy), L = Math.max(Lr, Ll, 1);
    const D = Math.max(2, (S.noteSize ?? 36) * k), R = D / 2;                // ノーツの直径(枠線を含む)
    const ow = Math.min(Math.max(0, (S.noteOutlineWidth ?? 6) * k), R - 0.5); // ノーツの枠線の太さ
    const OL = S.noteOutline || '#000000', LC = S.laneColor || '#000000';
    const capRound = (S.noteShape || 'circle') === 'circle';                  // ロングノーツの端: 円なら丸、他は角
    const speed = Math.max(1, (S.scrollSpeed ?? 420) * k);                    // 譜面のスクロール速度(px/秒)
    const pt = (sd, d) => [cx + sd * dx * d, cy + sd * dy * d];
    const shape = (x, y, r, color) => { FH.shapePath(c, x, y, r, S); c.fillStyle = color; c.fill(); };
    c.save();
    c.beginPath(); c.rect(0, 0, w, h); c.clip();
    c.lineCap = 'butt';
    c.strokeStyle = LC; c.lineWidth = Math.max(0.5, (S.laneWidth ?? 3) * k);  // レーン
    c.beginPath(); c.moveTo(cx - dx * Ll, cy - dy * Ll); c.lineTo(cx + dx * Lr, cy + dy * Lr); c.stroke();

    let ev = null;                                                            // 現在のイベント(無効化イベントで終了)
    [...P.chart.events].sort((a, b) => a.time - b.time).forEach(e => { if (e.time <= t) ev = e; });
    const on = ev && !ev.disable ? ev : null;
    shape(cx, cy, R, OL); shape(cx, cy, Math.max(0.5, R - ow), on ? on.color : LC);   // 中央ドット(ノーツより下・同じ直径と形状)

    P.chart.notes.forEach(n => {
      if (n.type === 'long') {
        const ds = (n.start.time - t) * speed, de = (n.end.time - t) * speed;   // ドットまでの距離

        const a = Math.max(ds, 0), b = Math.min(de, L);                          // 始点がドットに着いたら a=0 のまま帯が縮む

        const sides = [-1, 1].map(sd => {

          const g = c.createLinearGradient(x1, y1, x2, y2);

          g.addColorStop(1, lerpColor(n.start.color, n.end.color, (b - ds) / (de - ds)));
          return { x1, y1, x2, y2, g };
        });
        const line = q => { c.beginPath(); c.moveTo(q.x1, q.y1); c.lineTo(q.x2, q.y2); c.stroke(); };
        // 左右の枠線を先にまとめて描き、その上に中身を描く → 中央で重なった部分の枠線が見えなくなる
        c.lineCap = 'butt';

        c.lineWidth = Math.max(0.5, D - ow * 2); sides.forEach(q => { c.strokeStyle = q.g; line(q); });
        // 端点: シングルノーツと同じ図形(中心が始点・終点の位置)。始点はドットに着いても中心に残り、終点が着いて重なると消える
        const ends = [[a, n.start.color]];
        if (de > 0 && de <= L) ends.push([de, n.end.color]);

        ends.forEach(([d, col]) => [-1, 1].forEach(sd => { const [x, y] = pt(sd, d); shape(x, y, Math.max(0.5, R - ow), col); }));

        const ps = [-1, 1].map(sd => pt(sd, d));

        ps.forEach(([x, y]) => shape(x, y, Math.max(0.5, R - ow), n.color));
      }
    });

    if (S.hitFx !== false) {                                                      // ノーツを取るときの視覚エフェクト(時刻だけで決まるので、シークや書き出しでも同じ)
      const dur = Math.max(0.05, (S.hitFxMs ?? 450) / 1000), sz = S.hitFxSize ?? 1, style = S.hitFxStyle || 'ring';
      const colOf = col => S.hitFxColorMode === 'custom' ? (S.hitFxColor || '#ffffff') : col, eo = u => 1 - (1 - u) * (1 - u);
      const burst = (th, col) => {

        c.save(); c.globalAlpha = 1 - u; c.strokeStyle = colOf(col); c.fillStyle = colOf(col); c.lineCap = 'round';
        if (style === 'ring' || style === 'all') {                                // 広がるリング

        }

        if (n.type === 'long') {

            c.save(); c.globalAlpha = 0.65; c.strokeStyle = colOf(n.start.color); c.lineWidth = Math.max(2, R * 0.22);

          }
