<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FapHero Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#16171b; --panel:#212227; --panel2:#2a2b32; --edge:#3b3d47;
  --text:#e8e9ed; --sub:#8d909c; --green:#39e07a; --red:#ff4b4b; --hl:#ffd54a;
  --split:6px; --radius:4px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100%;padding:6px}
#left{display:flex;flex-direction:column;width:var(--lw,50%);min-width:320px}
#right{display:flex;flex-direction:column;flex:1;min-width:320px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);
  position:relative;overflow:hidden;min-height:0}
.panel>.title{position:absolute;top:6px;left:10px;color:var(--sub);font-size:12px;pointer-events:none}
#toolbar{min-height:44px;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:4px 8px;color:var(--text)}
.tb-btn{width:30px;height:30px;display:grid;place-items:center;padding:0;border:1px solid transparent;
  border-radius:var(--radius);background:none;color:var(--text);cursor:pointer}
.tb-btn:hover{background:var(--panel2)}
.tb-btn.on{background:var(--panel2);border-color:var(--green);color:var(--green)}
.tb-btn:focus-visible,#gridSel:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.tb-sep{width:1px;height:22px;background:var(--edge);margin:0 6px}
.tb-grid{position:relative;display:flex;align-items:center;gap:2px}
#gridSel{height:28px;background:var(--panel2);color:var(--text);border:1px solid var(--edge);
  border-radius:var(--radius);padding:0 4px;font:inherit;cursor:pointer}
.tb-grid input{position:absolute;right:0;top:0;width:100%;height:28px;padding:0 6px;font:inherit;
  background:var(--bg);color:var(--text);border:1px solid var(--green);border-radius:var(--radius)}
.tb-sliders{display:flex;flex-direction:column;margin-left:6px}
.tb-row{display:flex;align-items:center;gap:2px;height:20px;color:var(--sub)}
.tb-row svg{width:16px;height:16px;margin-right:2px}
.tb-row input[type=range]{width:104px;height:16px;margin:0;accent-color:var(--green)}
.tb-row button{width:16px;height:18px;padding:0;border:0;background:none;color:var(--sub);cursor:pointer;font-size:14px;line-height:1}
.tb-row button:hover{color:var(--text)}
.tb-val{width:48px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.tb-gear{margin-left:auto}
.tb-btn:disabled{opacity:.35;cursor:default;background:none}
/* テーマ: 既定はダーク。data-theme="light"でライト、未指定(システム準拠)ならOS設定に従う */
:root{color-scheme:dark;--stripe1:rgba(255,255,255,.02);--stripe2:rgba(255,255,255,.045)}
:root[data-theme="light"]{color-scheme:light;
  --bg:#e9ebf0;--panel:#ffffff;--panel2:#f0f1f5;--edge:#c8cbd6;--text:#1c1d22;--sub:#636776;
  --green:#12a047;--red:#e5322d;--hl:#d98200;--stripe1:rgba(0,0,0,.025);--stripe2:rgba(0,0,0,.05)}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){color-scheme:light;
    --bg:#e9ebf0;--panel:#ffffff;--panel2:#f0f1f5;--edge:#c8cbd6;--text:#1c1d22;--sub:#636776;
    --green:#12a047;--red:#e5322d;--hl:#d98200;--stripe1:rgba(0,0,0,.025);--stripe2:rgba(0,0,0,.05)}
}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;padding:6px 14px;
  background:var(--panel2);color:var(--text);border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);pointer-events:none}
#toast[hidden]{display:none}
#trackDlg{width:min(600px,94vw);padding:16px 20px;background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:8px}
#trackDlg::backdrop{background:rgba(0,0,0,.55)}
#trackDlg h2{margin:0 0 8px;font-size:15px}
#trackDlg progress{width:100%;height:10px;margin:8px 0;accent-color:var(--green)}
#trackDlg .cfg-row>label{width:130px}
#exportDlg{min-width:380px;padding:16px 20px;background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:8px}
#exportDlg::backdrop{background:rgba(0,0,0,.55)}
#exportDlg h2{margin:0 0 12px;font-size:15px}
#exportDlg progress{width:100%;height:10px;margin:8px 0;accent-color:var(--green)}
.ex-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ex-btn{padding:5px 16px;background:var(--panel2);color:var(--text);border:1px solid var(--edge);border-radius:var(--radius);font:inherit;cursor:pointer}
.ex-btn:hover:not(:disabled){border-color:var(--green)}
.ex-btn:disabled{opacity:.4;cursor:default}
#chartCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#items{display:flex;flex-direction:column}
.tp{flex:none;padding:6px 8px 4px;border-bottom:1px solid var(--edge);background:var(--panel2)}
.tp-scrub{display:flex;align-items:center;gap:4px}
.tp-scrub input{flex:1;min-width:0;height:16px;margin:0;accent-color:var(--green)}
.tp-scrub button{width:20px;height:20px;padding:0;border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px;line-height:1}
.tp-scrub button:hover{color:var(--text)}
.tp-row{display:flex;align-items:center;gap:2px;margin-top:2px}
.tp-row .tb-btn{width:28px;height:28px}
.tp-time{width:88px;margin-right:8px;padding:2px 6px;background:var(--bg);color:var(--text);
  border:1px solid var(--edge);border-radius:var(--radius);font:inherit;font-variant-numeric:tabular-nums}
.tl{position:relative;flex:1;min-height:0}
#itemsCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#dev button{margin-top:8px;padding:4px 10px;background:var(--panel2);color:var(--text);
  border:1px solid var(--edge);border-radius:var(--radius);font:inherit;cursor:pointer}
#dev button:hover{border-color:var(--green)}
#chart{height:var(--chartH,160px);flex:none}
#fun{height:var(--funH,150px);flex:none;display:flex;flex-direction:column}
.fun-head{flex:none;display:flex;align-items:center;gap:10px;padding:3px 8px;border-bottom:1px solid var(--edge);background:var(--panel2);font-size:12px}
.fun-title{font-weight:600}
.fun-lab{display:flex;align-items:center;gap:4px;color:var(--sub)}
.fun-head .u-sel{padding:1px 4px}
.fun-head .ex-btn{padding:1px 10px}
.fun-hint{margin-left:auto;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fun-body{display:flex;flex:1;min-height:0}
.fun-main{position:relative;flex:1;min-width:0}
.fun-dev{position:relative;flex:none;width:140px;border-left:1px solid var(--edge)}
.fun-main canvas,.fun-dev canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#config{flex:1}
#preview{height:var(--prevH,55%);flex:none;background:#000}
#items{flex:1}
.vsplit{width:var(--split);cursor:col-resize;flex:none}
.hsplit{height:var(--split);cursor:row-resize;flex:none}
.vsplit:hover,.hsplit:hover{background:var(--edge)}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);text-align:center;pointer-events:none}
#preview .placeholder{color:#555}
#config{display:flex;flex-direction:column}
.ctabs{flex:none;display:flex;gap:2px;padding:4px 6px 0;overflow-x:auto;border-bottom:1px solid var(--edge);background:var(--panel2)}
.ctab{display:flex;align-items:center;gap:6px;max-width:200px;padding:3px 6px 3px 10px;border:1px solid transparent;border-bottom:0;
  border-radius:6px 6px 0 0;color:var(--sub);cursor:pointer;white-space:nowrap}
.ctab.on{background:var(--panel);color:var(--text);border-color:var(--edge)}
.ctab:focus-visible{outline:2px solid var(--green)}
.ctab .t{overflow:hidden;text-overflow:ellipsis}
.ctab .x{width:16px;height:16px;line-height:15px;text-align:center;border-radius:3px}
.ctab .x:hover{background:var(--edge);color:var(--text)}
.cbody{position:relative;flex:1;min-height:0}
#dev,.cform{position:absolute;inset:0;padding:10px 14px;overflow:auto}
#dev{font-size:12px}
.cfg-row{display:flex;align-items:center;gap:10px;margin:0 0 6px;min-height:28px}
.cfg-row>label{width:88px;flex:none;color:var(--sub)}
.cfg-h{margin:14px 0 6px;font-weight:600}
.cfg-h:first-child{margin-top:0}
.cfg-empty{color:var(--sub);padding:4px 0}
.u-in{width:96px;padding:2px;background:none;border:0;border-bottom:1px solid var(--sub);color:var(--text);
  font:inherit;font-variant-numeric:tabular-nums}
.u-in:focus{outline:0;border-bottom-color:var(--green)}
.u-in:disabled{opacity:.5}
.u-in.wide{width:240px}
.u-sel{padding:3px 6px;background:var(--panel2);color:var(--text);border:1px solid var(--edge);border-radius:var(--radius);font:inherit}
.cfg-slider{display:flex;align-items:center;gap:2px}
.cfg-slider input[type=range]{width:170px;accent-color:var(--green)}
.cfg-slider button{width:20px;height:22px;padding:0;border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px;line-height:1}
.cfg-slider button:hover{color:var(--text)}
.cfg-slider .u-in{width:76px;margin-left:8px;text-align:right}
.cfg-row input[type=color]{width:40px;height:24px;padding:0;background:none;border:1px solid var(--edge);border-radius:var(--radius)}
.cfg-check{display:flex;align-items:center;gap:6px;accent-color:var(--green)}
.kf-list{max-height:180px;overflow:auto;margin:6px 0;padding:6px 10px;background:var(--bg);border:1px solid var(--edge);border-radius:var(--radius)}
.kf{display:flex;align-items:center;gap:14px;margin:3px 0}
.kf .u-in{width:84px}
.kf-del,.kf-add{width:26px;height:26px;padding:0;background:var(--panel2);color:var(--text);border:1px solid var(--edge);
  border-radius:var(--radius);cursor:pointer;font-size:15px;line-height:1}
.kf-del:hover,.kf-add:hover{border-color:var(--green)}
#dev table{border-collapse:collapse;width:100%}
#dev td{padding:2px 8px 2px 0;border-bottom:1px solid var(--edge)}
#dev td:first-child{color:var(--sub);white-space:nowrap;width:1%}
#dev pre{margin:8px 0 0;padding:8px;background:var(--bg);border-radius:var(--radius);
  max-height:180px;overflow:auto;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace}
.hint{color:var(--sub);margin-top:8px}
kbd{background:var(--panel2);border:1px solid var(--edge);border-radius:3px;padding:0 5px}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="toolbar" class="panel" role="toolbar" aria-label="ツールバー"></div>
    <div style="height:var(--split);flex:none"></div>
    <div id="chart" class="panel"></div>
    <div class="hsplit" data-target="chart" data-var="--chartH"></div>
    <div id="fun" class="panel"></div>
    <div class="hsplit" data-target="fun" data-var="--funH"></div>
    <div id="config" class="panel">
      <div id="ctabs" class="ctabs" role="tablist" aria-label="コンフィグタブ"></div>
      <div class="cbody"><div id="cfgForm" class="cform" hidden></div><div id="dev">
        <div class="cfg-h">プロジェクト</div>
        <div class="cfg-row"><label for="projName">プロジェクト名</label><input id="projName" class="u-in wide" type="text" spellcheck="false"></div>
        <div class="cfg-row"><label for="themeSel">テーマ</label>
          <select id="themeSel" class="u-sel"><option value="system">システム準拠</option><option value="light">ライトモード</option><option value="dark">ダークモード</option></select></div>
        <div class="cfg-row"><label for="fpsSel">フレームレート</label>
          <select id="fpsSel" class="u-sel"><option value="24">24 fps</option><option value="30">30 fps</option><option value="60">60 fps</option></select></div>
        <div id="cfgChart"></div>
        <div class="cfg-h">状態</div>
        <div id="devBody"></div></div></div>
    </div>
  </div>
  <div class="vsplit" data-target="left" data-var="--lw" data-axis="x"></div>
  <div id="right">
    <div id="preview" class="panel"></div>
    <div class="hsplit" data-target="preview" data-var="--prevH"></div>
    <div id="items" class="panel">
      <div id="tp" class="tp"></div>
      <div id="tl" class="tl"><canvas id="itemsCv" role="img" aria-label="アイテムタイムライン"></canvas></div>
      <input type="file" id="fileIn" multiple accept="video/*,image/*,audio/*" hidden>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ============================================================
   FapHero Editor  -  ステップ1: 土台
   ・FH.state      : 編集中の全状態(時刻/再生/速度/ズーム/ツール/グリッド/選択)
   ・FH.on / emit  : 状態変更の通知(各UIはこれを購読する)
   ・FH.time       : BPM/拍子に基づく時刻⇔拍の変換、グリッド生成
   ・FH.newProject : プロジェクトデータ構造(JSON化できる部分)
   ・FH.blobs      : メディア実体(保存時にJSZipでZIPへ格納。JSONには含めない)
   時刻はすべて「秒」で保持する。
   ============================================================ */
const FH = (() => {
  /* ---------- イベントバス ---------- */
  const handlers = {};
  const on = (name, fn) => ((handlers[name] ??= []).push(fn), fn);
  const off = (name, fn) => { handlers[name] = (handlers[name] || []).filter(f => f !== fn); };
  const emit = (name, data) => (handlers[name] || []).forEach(f => f(data));

  const uid = p => p + Math.random().toString(36).slice(2, 9);

  /* ---------- 定数 ---------- */
  const GRIDS = [4,6,8,12,16,24,32,48,64,96,128,192,384,1920];
  const SPEED_RANGE = [0.25, 4];
  const ZOOM_RANGE = [0.05, 40];
  const TOOLS = ['cursor','single','long','event','bpm','timesig'];
  const DEFAULT_COLOR = '#39e07a';

  /* ---------- プロジェクトのデータ構造 ---------- */
  // 値の変化(イージング)を持つパラメータ: base=キーフレームなしの値, keys=[{t,v,ease}]
  const param = base => ({ base, keys: [] });

  function newVisualParams() {
    return {                    // 動画・画像の編集パラメータ(すべてイージング可能)
      x: param(0), y: param(0),                 // 座標(プレビュー比率 -1〜1 を想定)
      scaleX: param(1), scaleY: param(1),       // 拡大率
      rotation: param(0),                       // 回転角(度)
      opacity: param(1),                        // 透明度
      anchorX: param(0.5), anchorY: param(0.5)  // 基準点
    };
  }
  const newAudioParams = () => ({ volume: param(1) });

  function newItem(type, name, mediaId, start = 0, duration = 5) {
    return {
      id: uid('item_'), type,                   // 'video' | 'image' | 'audio'
      name, mediaId,                            // media[mediaId] を参照
      start, duration,                          // タイムライン上の開始時刻・長さ(秒)
      trimIn: 0,                                // 元メディアの切り出し開始(秒)
      layer: 0,                                 // 行番号(0が最上段=最前面。アイテムタイムラインの行と同じ)
      effects: [],                              // 画像・動画のエフェクト: {id,type,on,params:{名前:{base,keys}},opts:{...}} の配列(上から順に適用)
      params: type === 'audio' ? newAudioParams()
            : type === 'video' ? { ...newVisualParams(), ...newAudioParams() }   // 動画は映像+音量
            : newVisualParams()
    };
  }

  function newGroup(name) {              // グループ: 映像の値(座標・拡大率・回転・透明度など)・音量・エフェクトを、メンバー全体にまとめて掛ける
    return { id: uid('grp_'), name, type: 'group', params: { ...newVisualParams(), ...newAudioParams() }, effects: [] };
  }

  function newProject() {
    return {
      version: 1,
      meta: { name: '無題', duration: 60, fps: 30 },
      chart: {
        bpmEvents:   [{ id: uid('bpm_'), time: 0, bpm: 120 }],
        timeSigEvents:[{ id: uid('ts_'),  time: 0, num: 4, den: 4 }],
        notes: [],  // {id,type:'single',time,color}
                    // {id,type:'long',start:{time,color},end:{time,color}}
        events: []  // {id,time,color,text,disable}  disable=イベント終了の合図
      },
      items: [],    // newItem() の配列
      media: {},
      groups: [],   // メディアのグループ: {id,name,type:'group',params,effects}。メンバーは item.groupId で参照
      funscript: {  // ノーツから自動で作られるキーフレーム(時刻は秒、位置は0〜100%)。keys: {id,t,pos,n?:ノーツID,r?:'a'|'b'|'c',lt?:時刻固定,lp?:位置固定}
        settings: { strokeMs: 400, lo: 0, hi: 100, restTop: true, limitOn: true, maxSpeed: 500, posSnap: 1 },   // restTop: 平時は上端(ノーツで下端へ落ち込む)。falseなら平時は下端
        keys: [],
        gen: {}     // 自動生成済みのノーツID(消したキーフレームが復活しないようにする)
      },    // mediaId -> {name,mime,size}  (実体は FH.blobs)
      settings: {   // 譜面コンフィグ(ステップ6でUI化)
        chart: {
          dotX: 0.5, dotY: 0.88,     // 中央ドットの位置(プレビュー幅・高さに対する比率)
          laneAngle: 0,              // レーン角度(度)
          textOffsetX: 0, textOffsetY: 0,  // テキスト表示位置のオフセット(px。ドットの真下に置いた位置からのずれ)
          laneColor: '#000000', noteOutline: '#000000',   // レーンの色・ノーツの枠線の色
          laneWidth: 3, noteOutlineWidth: 6, noteSize: 36, noteFill: '#ffffff', noteShape: 'circle', noteSides: 5, noteCorner: 0, noteRotate: 0, fontFamily: '', hitFx: true, hitFxStyle: 'ring', hitFxColorMode: 'note', hitFxColor: '#ffffff', hitFxSize: 1, hitFxMs: 450, scrollSpeed: 420, followEnabled: true, followThreshold: 0.8   // レーン太さ・枠線太さ・ノーツ直径(720p基準のpx)・ノーツの流れる速さ(px/秒)
        }
      }
    };
  }

  /* ---------- 状態 ---------- */
  const state = {
    project: newProject(),
    time: 0,            // 現在位置(秒)
    playing: false,
    speed: 1,           // 再生速度 0.25〜4
    zoom: 1,            // 譜面・アイテム共通のズーム
    tool: 'cursor',
    grid: 16,           // グリッド分割数
    selection: new Set(),
    pasting: null,      // 貼り付け待ち中のクリップボード(半透明で位置決め)
    itemSnap: 'chart',  // アイテムのスナップ: 'chart'=譜面グリッド / 'frame'=1フレーム
    lastNoteColor: '#ffffff',  // 直前に編集したノーツの色(新規ノーツの色)
    playStart: 0,       // 直近に再生を始めた時刻(「再生開始時刻に飛ぶ」用)
    dirty: false
  };
  const blobs = new Map(); // mediaId -> Blob

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function set(key, value) {
    if (state[key] === value) return;
    state[key] = value;
    emit('change:' + key, value);
    emit('change', key);
  }

  /* ---------- 全体の長さ ---------- */
  function duration() {
    const p = state.project;
    let end = p.meta.duration;
    p.items.forEach(i => end = Math.max(end, i.start + i.duration));
    p.chart.notes.forEach(n => end = Math.max(end, n.time ?? n.end.time));
    return end;
  }

  /* ---------- 操作用 API ---------- */
  const setTime = t => set('time', clamp(t, 0, duration()));
  const setSpeed = v => set('speed', clamp(v, ...SPEED_RANGE));
  const setZoom = v => set('zoom', clamp(v, ...ZOOM_RANGE));
  const setTool = t => { if (TOOLS.includes(t)) { set('pasting', null); set('tool', t); } };
  const setGrid = n => Number.isInteger(n) && n > 0 && set('grid', n);
  function play() { if (state.time >= duration()) setTime(0); state.playStart = state.time; set('playing', true); }
  function pause() { set('playing', false); }
  const toggle = () => state.playing ? pause() : play();
  function loadProject(p) { state.project = p; set('time', 0); emit('project', p); }

  /* ---------- 再生クロック ---------- */
  let last = performance.now();
  (function tick(now) {
    const dt = (now - last) / 1000; last = now;
    if (state.playing) {
      const t = state.time + dt * state.speed;
      if (t >= duration()) { setTime(duration()); pause(); } else setTime(t);
    }
    requestAnimationFrame(tick);
  })(last);

  /* ---------- 時刻 ⇔ 拍(BPM変化に対応) ---------- */
  const T = {
    bpmList() { return [...state.project.chart.bpmEvents].sort((a, b) => a.time - b.time); },
    bpmAt(t) {
      let cur = this.bpmList()[0];
      for (const e of this.bpmList()) if (e.time <= t) cur = e;
      return cur.bpm;
    },
    timeToBeat(t) {
      const list = this.bpmList(); let beat = 0;
      for (let i = 0; i < list.length; i++) {
        const s = list[i].time, e = i + 1 < list.length ? list[i + 1].time : Infinity;
        if (t <= s) break;
        beat += (Math.min(t, e) - s) * list[i].bpm / 60;
      }
      return beat;
    },
    beatToTime(beat) {
      const list = this.bpmList(); let rest = beat;
      for (let i = 0; i < list.length; i++) {
        const s = list[i].time, e = i + 1 < list.length ? list[i + 1].time : Infinity;
        const span = (e - s) * list[i].bpm / 60;
        if (rest <= span || e === Infinity) return s + rest * 60 / list[i].bpm;
        rest -= span;
      }
      return 0;
    },
    // 区間 [t0,t1] 内のグリッド線の時刻。div分音符(4分=1拍)単位。
    gridTimes(t0, t1, div = state.grid) {
      const step = 4 / div, out = [];
      for (let k = Math.ceil(this.timeToBeat(t0) / step - 1e-9); ; k++) {
        const t = this.beatToTime(k * step);
        if (t > t1 + 1e-9) break;
        out.push({ time: t, index: k, isBeat: Math.abs((k * step) % 1) < 1e-9 });
      }
      return out;
    },
    snap(t, div = state.grid) {
      const step = 4 / div;
      return this.beatToTime(Math.round(this.timeToBeat(t) / step) * step);
    },
    // 表示用 "分:秒.小数2桁"(例 00:03.72)
    format(t) {
      const c = Math.round(Math.max(0, t) * 100);
      const p = (n, w) => String(n).padStart(w, '0');
      return `${p(Math.floor(c / 6000), 2)}:${p(Math.floor(c / 100) % 60, 2)}.${p(c % 100, 2)}`;
    },
    parse(s) {
      const m = /^\s*(?:(\d+):)?(\d+(?:\.\d+)?)\s*$/.exec(s);
      return m ? (+(m[1] || 0)) * 60 + parseFloat(m[2]) : null;
    }
  };

  return { state, blobs, on, off, emit, uid, set, clamp, GRIDS, TOOLS, SPEED_RANGE, ZOOM_RANGE,
    DEFAULT_COLOR, newProject, newItem, newGroup, param, duration, time: T,
    setTime, setSpeed, setZoom, setTool, setGrid, play, pause, toggle, loadProject };
})();

/* ============================================================
   テーマ(ライト / ダーク / システム準拠)
   ・「情報と設定」タブのプルダウンで切り替え。選択は localStorage に保存
   ・CSS変数を切り替えたあと FH.emit('theme') を発行 → Canvas側が色を読み直す
   ============================================================ */
(() => {
  const root = document.documentElement, sel = document.getElementById('themeSel');
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  let mode = 'system';
  try { mode = localStorage.getItem('fh-theme') || 'system'; } catch (e) {}
  if (!['system', 'light', 'dark'].includes(mode)) mode = 'system';
  const apply = () => {
    if (mode === 'system') root.removeAttribute('data-theme'); else root.dataset.theme = mode;
    FH.emit('theme', mode);
  };
  FH.setTheme = m => {
    if (!['system', 'light', 'dark'].includes(m)) return;
    mode = m; sel.value = m;
    try { localStorage.setItem('fh-theme', m); } catch (e) {}
    apply();
  };
  sel.value = mode;
  sel.addEventListener('change', () => FH.setTheme(sel.value));
  mq.addEventListener('change', () => { if (mode === 'system') apply(); });   // OS側の切り替えに追従
  apply();
})();

/* ============================================================
   ノーツ形状(プレビューと譜面エディタで共通)
   FH.shapePath(ctx, 中心x, 中心y, 半径R, 設定) : 形状のパスを作る(塗りは呼び出し側)
   設定: noteShape('circle'|'square'|'diamond'|'polygon'|'star'), noteSides(3〜12), noteCorner(角の丸み 0〜100%), noteRotate(°)
   四角は「一辺 = 直径」、それ以外は「外接円の直径 = 直径」
   ============================================================ */
(() => {
  function roundPoly(c, pts, k) {
    const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], st = mid(pts[n - 1], pts[0]);
    c.moveTo(st[0], st[1]);
    for (let i = 0; i < n; i++) {
      const q = pts[i], pv = pts[(i + n - 1) % n], nx = pts[(i + 1) % n];
      const v1 = [pv[0] - q[0], pv[1] - q[1]], v2 = [nx[0] - q[0], nx[1] - q[1]], l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
      const ang = Math.acos(Math.max(-1, Math.min(1, (v1[0] * v2[0] + v1[1] * v2[1]) / (l1 * l2 || 1))));
      const rmax = Math.min(l1, l2) / 2 * Math.tan(ang / 2), m2 = mid(q, nx);     // 辺の半分に収まる最大の丸み
      c.arcTo(q[0], q[1], m2[0], m2[1], rmax * k);
    }
    c.closePath();
  }
  FH.shapePath = (c, cx, cy, R, S) => {
    const shape = S.noteShape || 'circle', rot = (S.noteRotate || 0) * Math.PI / 180;
    const sides = Math.max(3, Math.min(12, Math.round(S.noteSides || 5))), k = Math.max(0, Math.min(100, S.noteCorner || 0)) / 100;
    c.beginPath();
    if (shape === 'circle' || R < 1) { c.arc(cx, cy, Math.max(R, 0.1), 0, Math.PI * 2); return; }
    const ngon = (n, r, off) => Array.from({ length: n }, (_, i) => { const a = off + rot + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
    let pts;
    if (shape === 'square') pts = ngon(4, R * Math.SQRT2, Math.PI / 4);
    else if (shape === 'diamond') pts = ngon(4, R, 0);
    else if (shape === 'star') {
      pts = []; for (let i = 0; i < sides * 2; i++) { const r = i % 2 ? R * 0.5 : R, a = -Math.PI / 2 + rot + i * Math.PI / sides; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    } else pts = ngon(sides, R, -Math.PI / 2);
    if (k <= 0) { pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); } else roundPoly(c, pts, k);
  };
})();

/* ============================================================
   画像・動画のエフェクト一覧(FH.FX)
   kind: 'filter'=Canvasのフィルター(ぼかし・色調整など) / 'geom'=位置・切り抜き / 'post'=描いた後の画像処理
   params: キーフレーム(イージング)を付けられる数値。値は内部値で、表示は scale 倍して unit を付ける
   opts  : キーフレームを付けない設定(色・合成方法)
   FH.newEffect(type) : 既定値の入った新しいエフェクトを作る
   ============================================================ */
(() => {
  const N = (k, label, unit, scale, def, min, max, lo, hi, step, digits = 0) => ({ k, label, unit, scale, def, min, max, lo, hi, step, digits });
  const pc = (k, label, def, max = 1, hi = 1) => N(k, label, '%', 100, def, 0, max, 0, hi, 0.01);
  FH.FX = {
    blur:       { label: 'ぼかし', kind: 'filter', params: [N('r', '半径', 'px', 1, 4, 0, 40, 0, 400, 0.5, 1)] },
    brightness: { label: '明るさ', kind: 'filter', params: [pc('v', '明るさ', 1, 3, 10)] },
    contrast:   { label: 'コントラスト', kind: 'filter', params: [pc('v', 'コントラスト', 1, 3, 10)] },
    saturate:   { label: '彩度', kind: 'filter', params: [pc('v', '彩度', 1, 3, 10)] },
    hue:        { label: '色相回転', kind: 'filter', params: [N('v', '角度', '°', 1, 0, -180, 180, -720, 720, 1)] },
    gray:       { label: 'モノクロ', kind: 'filter', params: [pc('v', '強さ', 1)] },
    sepia:      { label: 'セピア', kind: 'filter', params: [pc('v', '強さ', 1)] },
    invert:     { label: '色反転', kind: 'filter', params: [pc('v', '強さ', 1)] },
    shadow:     { label: 'ドロップシャドウ', kind: 'filter',
                  params: [N('x', 'X', 'px', 1, 6, -60, 60, -600, 600, 1), N('y', 'Y', 'px', 1, 6, -60, 60, -600, 600, 1),
                           N('b', 'ぼかし', 'px', 1, 8, 0, 60, 0, 600, 1), pc('a', '濃さ', 0.6)],
                  opts: [{ k: 'color', type: 'color', label: '色', def: '#000000' }] },
    wobble:     { label: '振動', kind: 'geom', params: [N('amp', '強さ', '%', 100, 0.02, 0, 0.2, 0, 1, 0.001, 1), N('hz', '速さ', 'Hz', 1, 6, 0, 30, 0, 120, 0.1, 1)] },
    crop:       { label: 'トリミング', kind: 'geom', params: [pc('l', '左', 0), pc('r', '右', 0), pc('t', '上', 0), pc('b', '下', 0)] },
    mosaic:     { label: 'モザイク', kind: 'post', params: [N('s', 'ブロックの大きさ', 'px', 1, 12, 1, 80, 1, 400, 1)] },
    rgb:        { label: 'RGBずらし', kind: 'post', params: [N('a', 'ずらし量', 'px', 1, 6, 0, 40, 0, 200, 0.5, 1), N('ang', '方向', '°', 1, 0, -180, 180, -720, 720, 1)] },
    glow:       { label: 'グロー', kind: 'post', params: [N('r', '広がり', 'px', 1, 16, 0, 60, 0, 300, 1), pc('s', '強さ', 0.6, 2, 4)] },
    tint:       { label: 'カラーオーバーレイ', kind: 'post', params: [pc('a', '強さ', 0.5)],
                  opts: [{ k: 'color', type: 'color', label: '色', def: '#ff3355' },
                         { k: 'blend', type: 'select', label: '合成', def: 'normal', options: [['normal', '通常'], ['multiply', '乗算'], ['screen', 'スクリーン'], ['overlay', 'オーバーレイ'], ['lighter', '加算']] }] },
    vignette:   { label: 'ビネット', kind: 'post', params: [pc('s', '強さ', 0.6), pc('r', '範囲', 0.8, 1.5, 2)] },
    noise:      { label: 'フィルムノイズ', kind: 'post', params: [pc('s', '強さ', 0.25), N('g', '粒の大きさ', 'px', 1, 2, 1, 8, 1, 32, 1)] },
    scan:       { label: '走査線', kind: 'post', params: [N('sp', '間隔', 'px', 1, 4, 2, 24, 2, 100, 1), pc('s', '強さ', 0.35)] }
  };
  FH.newEffect = type => {
    const d = FH.FX[type];
    return { id: FH.uid('fx_'), type, on: true,
      params: Object.fromEntries(d.params.map(q => [q.k, FH.param(q.def)])),
      opts: Object.fromEntries((d.opts || []).map(o => [o.k, o.def])) };
  };
})();

/* ============================================================
   レイアウト: 分割バーのドラッグ
   ============================================================ */
document.querySelectorAll('.vsplit,.hsplit').forEach(bar => {
  bar.addEventListener('pointerdown', ev => {
    const target = document.getElementById(bar.dataset.target);
    const horizontal = bar.dataset.axis === 'x';
    bar.setPointerCapture(ev.pointerId);
    const move = e => {
      const r = target.getBoundingClientRect();
      const size = horizontal ? e.clientX - r.left : e.clientY - r.top;
      document.documentElement.style.setProperty(bar.dataset.var, Math.max(80, size) + 'px');
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
});

/* ============================================================
   ツールバー(ステップ2)
   ・ファイル/編集ボタンは FH.emit('action', id) を発行(処理はステップ8・9で購読)
   ・ツールボタンは FH.state.tool を切り替える
   ============================================================ */
(() => {
  const ic = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    new: '<path d="M6 3h8l4 4v14H6z M14 3v4h4"/>',
    open: '<path d="M3 7h6l2 2h10v10H3z"/>',
    save: '<path d="M5 3h12l3 3v15H5z M8 3v6h8V3 M8 21v-7h8v7"/>',
    export: '<path d="M12 15V4 M8 8l4-4 4 4 M5 14v6h14v-6"/>',
    cut: '<circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M9 15L18 4 M15 15L6 4"/>',
    copy: '<rect x="8" y="8" width="12" height="13" rx="1"/><path d="M16 8V4H4v13h4"/>',
    paste: '<rect x="5" y="5" width="14" height="16" rx="1"/><path d="M9 5V3h6v2 M8 11h8 M8 15h8"/>',
    undo: '<path d="M9 8h6a5 5 0 010 10H8 M9 4L5 8l4 4"/>',
    redo: '<path d="M15 8H9a5 5 0 000 10h7 M15 4l4 4-4 4"/>',
    cursor: '<path d="M6 3l12 9-5.5 1.2L15 20l-3 1-2.5-6.8L6 18z"/>',
    single: '<circle cx="12" cy="12" r="7"/>',
    long: '<rect x="3" y="9" width="18" height="6" rx="3"/>',
    event: '<path d="M7 21V3 M7 4h11l-3 4 3 4H7"/>',
    bpm: '<path d="M7 21L9 4h6l2 17z M12 16l4-9"/>',
    timesig: '<path d="M5 12h14"/><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="18" r="1.4"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9L7 7 M17 17l2.1 2.1 M19.1 4.9L17 7 M7 17l-2.1 2.1"/>',
    speed: '<path d="M7 5l11 7-11 7z"/>',
    zoom: '<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>'
  };
  const act = (id, label) => `<button class="tb-btn" data-act="${id}" title="${label}" aria-label="${label}">${ic(I[id])}</button>`;
  const tool = (id, label) => `<button class="tb-btn" data-tool="${id}" title="${label}" aria-label="${label}" aria-pressed="false">${ic(I[id])}</button>`;
  const sep = '<span class="tb-sep"></span>';
  const row = (id, label, icon) => `<div class="tb-row" title="${label}">${ic(I[icon])}
    <button data-step="${id}" data-dir="-1" aria-label="${label}を下げる">‹</button>
    <input type="range" id="${id}Range" aria-label="${label}">
    <button data-step="${id}" data-dir="1" aria-label="${label}を上げる">›</button>
    <span class="tb-val" id="${id}Val"></span></div>`;

  const tb = document.getElementById('toolbar');
  tb.innerHTML =
    act('new', '新規') + act('open', '開く') + act('save', '保存') + act('export', 'エクスポート') + sep +
    act('cut', 'カット') + act('copy', 'コピー') + act('paste', 'ペースト') + act('undo', '取り消す') + act('redo', 'やり直す') + sep +
    tool('cursor', 'カーソル(1)') + tool('single', 'シングルノーツ(2)') + tool('long', 'ロングノーツ(3)') +
    tool('event', 'イベント(4)') + tool('bpm', 'BPM(5)') + tool('timesig', '拍子(6)') + sep +
    `<div class="tb-grid"><select id="gridSel" title="グリッド分割(Ctrl+クリックで直接入力)" aria-label="グリッド分割"></select></div>` +
    `<div class="tb-sliders">${row('speed', '再生速度', 'speed')}${row('zoom', 'ズーム', 'zoom')}</div>`;

  /* ---- ボタン ---- */
  tb.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act) FH.emit('action', b.dataset.act);
    else if (b.dataset.tool) FH.setTool(b.dataset.tool);
    else if (b.dataset.step === 'speed') FH.stepSpeed(+b.dataset.dir);
    else if (b.dataset.step === 'zoom') FH.stepZoom(+b.dataset.dir);
  });
  FH.on('change:tool', t => tb.querySelectorAll('[data-tool]').forEach(b => {
    const on = b.dataset.tool === t;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  }));

  /* ---- 再生速度(段階式) ---- */
  const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4];
  const nearest = v => SPEEDS.reduce((b, s, i) => Math.abs(Math.log(s / v)) < Math.abs(Math.log(SPEEDS[b] / v)) ? i : b, 0);
  FH.stepSpeed = d => FH.setSpeed(SPEEDS[FH.clamp(nearest(FH.state.speed) + d, 0, SPEEDS.length - 1)]);
  const sp = document.getElementById('speedRange');
  sp.min = 0; sp.max = SPEEDS.length - 1; sp.step = 1;
  sp.oninput = () => FH.setSpeed(SPEEDS[+sp.value]);

  /* ---- ズーム(対数スライダー) ---- */
  const zr = document.getElementById('zoomRange'), [zMin, zMax] = FH.ZOOM_RANGE.map(Math.log2);
  zr.min = zMin; zr.max = zMax; zr.step = 0.01;
  zr.oninput = () => FH.setZoom(2 ** +zr.value);
  FH.stepZoom = d => FH.setZoom(FH.state.zoom * (d > 0 ? 1.25 : 0.8));
  document.addEventListener('wheel', e => {          // Ctrl+ホイールでズーム
    if (!e.ctrlKey) return;
    e.preventDefault(); FH.stepZoom(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  /* ---- グリッド分割(Ctrl+クリックで直接入力) ---- */
  const sel = document.getElementById('gridSel');
  const fillGrid = () => {
    const g = FH.state.grid;
    const list = (FH.GRIDS.includes(g) ? FH.GRIDS : [...FH.GRIDS, g]).sort((a, b) => a - b);
    sel.innerHTML = list.map(n => `<option value="${n}">${n}分</option>`).join('');
    sel.value = g;
  };
  sel.onchange = () => FH.setGrid(+sel.value);
  sel.addEventListener('mousedown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const box = document.createElement('input');
    box.type = 'number'; box.min = 1; box.max = 7680; box.value = FH.state.grid;
    box.setAttribute('aria-label', 'グリッド分割数を入力');
    sel.parentNode.appendChild(box); box.focus(); box.select();
    let closed = false;
    const close = () => { if (!closed) { closed = true; box.remove(); sel.focus(); } };
    box.onkeydown = ev => {
      if (ev.key === 'Enter') {
        const v = parseInt(box.value, 10);
        if (v >= 1 && v <= 7680) FH.setGrid(v);
        close();
      } else if (ev.key === 'Escape') close();
    };
    box.onblur = close;
  });

  /* ---- 状態 → 表示の同期 ---- */
  const sync = () => {
    const s = FH.state;
    sp.value = nearest(s.speed);
    document.getElementById('speedVal').textContent = Math.round(s.speed * 100) + '%';
    zr.value = Math.log2(s.zoom);
    document.getElementById('zoomVal').textContent = s.zoom.toFixed(2) + 'x';
    fillGrid();
  };
  ['speed', 'zoom', 'grid'].forEach(k => FH.on('change:' + k, sync));
  sync();
  FH.emit('change:tool', FH.state.tool);
  const TOOL_KEYS = { 1: 'cursor', 2: 'single', 3: 'long', 4: 'event', 5: 'bpm', 6: 'timesig' };   // 数字キーでツール切り替え
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || /TEXTAREA|SELECT/.test(t.tagName) || (t.tagName === 'INPUT' && t.type !== 'range')) return;
    if (TOOL_KEYS[e.key]) FH.setTool(TOOL_KEYS[e.key]);
  });
})();

/* ============================================================
   譜面タイムライン(ステップ3: 表示のみ。編集はステップ4)
   ・Canvas描画: ルーラー / グリッド(拍子・BPM反映) / レーン / ノーツ / イベント・BPM・拍子マーカー / 再生位置線
   ・ズーム: FH.state.zoom(1.0で1秒=120px)  スクロール: ホイール  シーク: 上部ルーラーをクリック/ドラッグ
   ・再生中は再生位置が画面の30%位置に固定されて流れる
   ・譜面データを変更したら FH.emit('chart') で再描画
   ============================================================ */
(() => {
  const panel = document.getElementById('chart');
  panel.innerHTML = '<canvas id="chartCv" role="img" aria-label="譜面タイムライン"></canvas>';
  const cv = panel.firstChild, ctx = cv.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { text: css('--text'), sub: css('--sub'), edge: css('--edge'), panel2: css('--panel2'),
              green: css('--green'), red: css('--red'), panel: css('--panel'), hl: css('--hl') };
  FH.on('theme', () => {
    Object.assign(C, { text: css('--text'), sub: css('--sub'), edge: css('--edge'), panel2: css('--panel2'),
                       green: css('--green'), red: css('--red'), panel: css('--panel'), hl: css('--hl') });
    invalidate();
  });
  const FONT = '"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif';
  const BASE_PPS = 120, RULER_H = 18, PLAY_X = 0.3;
  let W = 0, H = 0, dpr = 1, viewStart = 0, queued = false;

  const pps = () => BASE_PPS * FH.state.zoom;
  const xOf = t => (t - viewStart) * pps();
  const tOf = x => viewStart + x / pps();
  FH.view = { get start() { return viewStart; }, set start(v) { viewStart = v; invalidate(); }, pps };   // Funscriptタイムラインと横位置・ズームを共有
  const resetView = () => { viewStart = FH.state.time - PLAY_X * W / pps(); };
  const followPlay = t => {                  // 再生線が閾値(画面幅に対する割合)を超えたら、その位置を保ったままスクロール
    const S = FH.state.project.settings.chart;
    if (S.followEnabled === false) return;
    const thr = FH.clamp(S.followThreshold ?? 0.8, 0, 1);
    if (xOf(t) > thr * W || xOf(t) < 0) viewStart = t - thr * W / pps();
  };
  const invalidate = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };
  const near = (v, m) => { const r = ((v % m) + m) % m; return r < 1e-6 || m - r < 1e-6; };

  /* ---------- 描画 ---------- */
  /* 譜面コンフィグ(レーン色・太さ、ノーツ直径・枠線・形状)を、プレビューの半分の大きさで反映する */
  const EDIT_SCALE = 0.5;
  const lum = hex => {
    const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
    return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
  };
  const lowContrast = (a, b) => { const la = lum(a), lb = lum(b); return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05) < 2.2; };
  const noteGeom = () => {
    const S = FH.state.project.settings.chart, D = Math.max(6, (S.noteSize ?? 36) * EDIT_SCALE);
    return { S, D, R: D / 2, ow: Math.min(Math.max(0, (S.noteOutlineWidth ?? 6) * EDIT_SCALE), D / 2 - 0.5),
             OL: S.noteOutline || '#000000', LC: S.laneColor || '#000000', LW: Math.max(1.5, (S.laneWidth ?? 3) * EDIT_SCALE) };
  };

  function draw() {
    queued = false;
    if (!W) return;
    FH.emit('view');
    const s = FH.state, P = s.project.chart, T = FH.time, k = pps();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const laneY = Math.round(Math.min(H - 30, Math.max(84, H * 0.6)));
    const t0 = tOf(-24), t1 = tOf(W + 24);

    // 0秒より前・全体の長さより後ろを暗くする
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    const xs = xOf(0), xe = xOf(FH.duration());
    if (xs > 0) ctx.fillRect(0, RULER_H, Math.min(xs, W), H - RULER_H);
    if (xe < W) ctx.fillRect(Math.max(xe, 0), RULER_H, W - Math.max(xe, 0), H - RULER_H);

    // ルーラー
    ctx.fillStyle = C.panel2; ctx.fillRect(0, 0, W, RULER_H);
    ctx.strokeStyle = C.edge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, RULER_H + .5); ctx.lineTo(W, RULER_H + .5); ctx.stroke();
    const st = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600].find(v => v * k >= 84) || 600;
    ctx.fillStyle = C.sub; ctx.strokeStyle = C.sub; ctx.font = '11px ' + FONT;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (let i = Math.max(0, Math.ceil(t0 / st)); i * st <= t1; i++) {
      const x = Math.round(xOf(i * st)) + .5, label = T.format(i * st);
      ctx.beginPath(); ctx.moveTo(x, RULER_H - 5); ctx.lineTo(x, RULER_H); ctx.stroke();
      ctx.fillText(st >= 1 ? label.slice(0, 5) : label, x + 4, RULER_H / 2);
    }

    // グリッド(拍子ごとの区間で、小節線・拍線・分割線を描き分ける)
    const sigs = [...P.timeSigEvents].sort((a, b) => a.time - b.time).map(e => ({ ...e, beat: T.timeToBeat(e.time) }));
    if (!sigs.length) sigs.push({ time: 0, num: 4, den: 4, beat: 0 });
    const b0 = T.timeToBeat(Math.max(0, t0)), b1 = T.timeToBeat(t1);
    sigs.forEach((sg, i) => {
      const segEnd = sigs[i + 1] ? sigs[i + 1].beat : Infinity;
      const from = Math.max(b0, sg.beat), to = Math.min(b1, segEnd);
      if (from >= to) return;
      const unit = 4 / sg.den, meas = sg.num * unit, step = 4 / s.grid;
      const pxBeat = k * 60 / T.bpmAt(T.beatToTime(from));
      const iter = step * pxBeat >= 6 ? step : unit * pxBeat >= 6 ? unit : meas;
      for (let n = Math.ceil((from - sg.beat) / iter - 1e-9), c = 0; c < 3000; n++, c++) {
        const beat = sg.beat + n * iter;
        if (beat > to + 1e-9) break;
        const off = beat - sg.beat, x = Math.round(xOf(T.beatToTime(beat))) + .5;
        const len = near(off, meas) ? 18 : near(off, unit) ? 11 : 6;
        ctx.strokeStyle = len === 6 ? C.edge : len === 11 ? C.sub : C.text;
        ctx.lineWidth = len === 18 ? 2 : 1.5;
        ctx.beginPath();
        ctx.moveTo(x, laneY - 4 - len); ctx.lineTo(x, laneY - 4);
        ctx.moveTo(x, laneY + 4); ctx.lineTo(x, laneY + 4 + len);
        ctx.stroke();
      }
    });

    // レーン(色・太さを反映。背景に近い色のときは薄い縁取りを足して見えるようにする)
    const { S: NS, D: ND, R: NR_, ow: NOW, OL: NOL, LC: NLC, LW: NLW } = noteGeom();
    if (lowContrast(NLC, C.panel)) {
      ctx.strokeStyle = C.text; ctx.globalAlpha = .4; ctx.lineWidth = NLW + 3;
      ctx.beginPath(); ctx.moveTo(0, laneY); ctx.lineTo(W, laneY); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = NLC; ctx.lineWidth = NLW;
    ctx.beginPath(); ctx.moveTo(0, laneY); ctx.lineTo(W, laneY); ctx.stroke();

    // ノーツ(直径・枠線の太さと色・形状を反映)
    const capRound = (NS.noteShape || 'circle') === 'circle';
    const drawNote = (x, fill) => {
      ctx.save();
      FH.shapePath(ctx, x, laneY, NR_, NS); ctx.fillStyle = NOL; ctx.fill();
      if (NR_ - NOW > 0.5) { FH.shapePath(ctx, x, laneY, NR_ - NOW, NS); ctx.fillStyle = fill; ctx.fill(); }
      ctx.restore();
    };
    const drawLong = (x1, x2, c1, c2) => {                     // 端点はシングルノーツと同じ図形(中心が開始・終了時刻)、間は帯でつなぐ
      const bt = ND - NOW * 2, g = ctx.createLinearGradient(x1, 0, Math.max(x2, x1 + 1), 0);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.save();
      ctx.fillStyle = NOL; ctx.fillRect(x1, laneY - ND / 2, x2 - x1, ND);                  // 帯の枠線
      if (bt > 0.5) { ctx.fillStyle = g; ctx.fillRect(x1, laneY - bt / 2, x2 - x1, bt); }   // 帯の中身
      ctx.restore();
      drawNote(x1, c1); drawNote(x2, c2);
    };
    P.notes.forEach(n => {
      if (n.type === 'long') {
        const x1 = xOf(n.start.time), x2 = xOf(n.end.time);
        if (Math.max(x1, x2) + NR_ < -30 || Math.min(x1, x2) - NR_ > W + 30) return;
        drawLong(x1, x2, n.start.color, n.end.color);
      } else {
        const x = xOf(n.time);
        if (x < -30 - ND || x > W + 30 + ND) return;
        drawNote(x, n.color);
      }
    });

    // イベント・拍子・BPMのマーカー(旗)
    const marker = (x, rowY, color, label, nextX, bold) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, laneY - 6); ctx.lineTo(x, rowY - 9); ctx.stroke();
      ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(x, rowY - 9); ctx.lineTo(x + 9, rowY - 5.5); ctx.lineTo(x, rowY - 2); ctx.closePath(); ctx.fill();
      const maxW = (nextX == null ? W + 400 : nextX - 4) - (x + 13);
      if (label && maxW > 4) {
        ctx.save(); ctx.beginPath(); ctx.rect(x + 13, rowY - 15, maxW, 20); ctx.clip();
        ctx.font = (bold ? 'bold 12px ' : '11px ') + FONT; ctx.fillStyle = color;
        ctx.textBaseline = 'middle'; ctx.fillText(label, x + 13, rowY - 5.5); ctx.restore();
      }
    };
    const group = (list, rowY, colorOf, labelOf, bold) => {
      const a = [...list].sort((p, q) => p.time - q.time);
      a.forEach((e, i) => {
        const x = xOf(e.time), nx = a[i + 1] ? xOf(a[i + 1].time) : null;
        if (x > W + 20 || x < -500 || (nx != null && nx < -4)) return;
        marker(x, rowY, colorOf(e), labelOf(e), nx, bold);
      });
    };
    group(P.events, laneY - 58, e => e.disable ? C.sub : e.color, e => e.disable ? '×' : e.text, true);
    group(P.timeSigEvents, laneY - 40, () => C.sub, e => `÷${e.num}/${e.den}`, false);
    group(P.bpmEvents, laneY - 22, () => C.sub, e => `BPM ${e.bpm}`, false);

    // 選択中アイテムはハイライト色で縁取りする
    const hlStroke = () => { ctx.strokeStyle = C.hl; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(); };
    if (s.selection.size) items().forEach(it => {
      if (!s.selection.has(it.id)) return;
      if (it.kind === 'single') { FH.shapePath(ctx, xOf(it.o.time), laneY, NR_ + 3, NS); hlStroke(); }
      else if (it.kind === 'long') {
        const x1 = xOf(it.o.start.time), x2 = xOf(it.o.end.time), r = NR_ + 3;
        ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(Math.min(x1, x2) - r, laneY - r, Math.abs(x2 - x1) + r * 2, r * 2, r);
        else ctx.rect(Math.min(x1, x2) - r, laneY - r, Math.abs(x2 - x1) + r * 2, r * 2);
        hlStroke();
      } else { const x = xOf(it.o.time), ry = laneY - ROWS[it.kind]; ctx.beginPath(); ctx.rect(x - 4, ry - 13, 18, 15); hlStroke(); }
    });

    if (lp) {                                                    // ロングノーツのドラッグ配置: 配置後の見た目を半透明で表示
      const t1 = snapT(tOf(lp.x), lp.free), a = Math.min(lp.t0, t1), b = Math.max(lp.t0, t1);
      ctx.save(); ctx.globalAlpha = .45;
      drawLong(xOf(a), xOf(b > a + 1e-6 ? b : nextGrid(a)), s.lastNoteColor, s.lastNoteColor);
      ctx.restore();
    }

    // 貼り付け待ち: コピーした譜面アイテムを半透明で表示(カーソル位置にスナップ)
    if (s.pasting && hover && hover.y > RULER_H && !seeking && !drag && isFinite(s.pasting.base.chart)) {
      const dt = snapT(tOf(hover.x), hover.alt) - s.pasting.base.chart;
      ctx.save(); ctx.globalAlpha = .45;
      s.pasting.en.forEach(e => {
        if (e.k === 'item') return;
        if (e.k === 'single') drawNote(xOf(e.o.time + dt), e.o.color);
        else if (e.k === 'long') {
          drawLong(xOf(e.o.start.time + dt), xOf(e.o.end.time + dt), e.o.start.color, e.o.end.color);
        } else {
          const x = xOf(e.o.time + dt), ry = laneY - ROWS[e.k], col = e.k === 'event' ? e.o.color : C.sub;
          ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x, laneY - 6); ctx.lineTo(x, ry - 9); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x, ry - 9); ctx.lineTo(x + 9, ry - 5.5); ctx.lineTo(x, ry - 2); ctx.fill();
        }
      });
      ctx.restore();
    }

    // 配置ツール選択中: カーソル位置(グリッドにスナップ)に配置プレビューを薄く表示
    if (!s.pasting && !lp && s.tool !== 'cursor' && hover && hover.y > RULER_H && !seeking && !drag && !hit(hover.x, hover.y)) {
      const t = snapT(tOf(hover.x), hover.alt), x = xOf(t);
      ctx.save(); ctx.globalAlpha = .45; ctx.fillStyle = C.green; ctx.strokeStyle = C.green;
      if (s.tool === 'single') drawNote(x, s.lastNoteColor);
      else if (s.tool === 'long') drawLong(x, xOf(nextGrid(t)), s.lastNoteColor, s.lastNoteColor);
      else {
        const ry = laneY - ROWS[s.tool === 'timesig' ? 'sig' : s.tool];
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, laneY - 6); ctx.lineTo(x, ry - 9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, ry - 9); ctx.lineTo(x + 9, ry - 5.5); ctx.lineTo(x, ry - 2); ctx.fill();
      }
      ctx.restore();
    }

    if (mq && mq.moved) {                                        // 範囲選択の枠
      const r = mqRect();
      ctx.save(); ctx.globalAlpha = .15; ctx.fillStyle = C.green; ctx.fillRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
      ctx.globalAlpha = 1; ctx.strokeStyle = C.green; ctx.lineWidth = 1; ctx.strokeRect(r.x1 + .5, r.y1 + .5, r.x2 - r.x1, r.y2 - r.y1);
      ctx.restore();
    }

    // 再生位置線
    const px = xOf(s.time);
    if (px > -10 && px < W + 10) {
      ctx.strokeStyle = C.red; ctx.fillStyle = C.red; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, laneY - 26); ctx.lineTo(px, laneY + 26); ctx.stroke();
      [laneY - 26, laneY + 26].forEach(y => { ctx.beginPath(); ctx.arc(px, y, 3, 0, Math.PI * 2); ctx.fill(); });
      ctx.beginPath(); ctx.moveTo(px - 5, RULER_H - 8); ctx.lineTo(px + 5, RULER_H - 8); ctx.lineTo(px, RULER_H - 1);
      ctx.closePath(); ctx.fill();
    }
  }

  /* ---------- サイズ ---------- */
  let first = true;
  new ResizeObserver(() => {
    dpr = window.devicePixelRatio || 1;
    W = panel.clientWidth; H = panel.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (first && W) { first = false; resetView(); }
    invalidate();
  }).observe(panel);

  /* ---------- 状態との連携 ---------- */
  FH.on('change:time', () => {
    if (seeking) { invalidate(); return; }                        // ルーラーをドラッグ中は視点を動かさない
    const s = FH.state, x = xOf(s.time);
    if (s.playing) followPlay(s.time);                            // 再生中: 閾値を超えたら追従スクロール
    else if (x < 0 || x > W) viewStart = s.time - 0.5 * W / pps(); // 範囲外へ移動したら中央へ
    invalidate();
  });
  let lastZoom = FH.state.zoom;
  FH.on('change:zoom', z => {                                     // 再生位置(画面外なら中央)を基準にズーム
    const old = BASE_PPS * lastZoom, now = BASE_PPS * z;
    let ax = (FH.state.time - viewStart) * old;
    if (ax < 0 || ax > W) ax = W / 2;
    viewStart = viewStart + ax / old - ax / now;
    lastZoom = z; invalidate();
  });
  FH.on('project', () => { FH.set('selection', new Set()); resetView(); invalidate(); });
  ['change:grid', 'change:tool', 'change:selection', 'change:pasting', 'chart'].forEach(n => FH.on(n, invalidate));

  /* ---------- 操作(スクロール・シーク) ---------- */
  cv.addEventListener('wheel', e => {
    if (e.ctrlKey) return;                                        // Ctrl+ホイールはズーム(ツールバー側)
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    viewStart = FH.clamp(viewStart + d / pps(), -W * 0.5 / pps(), FH.duration());
    invalidate();
  }, { passive: false });

  /* ---------- 再生位置線のドラッグ(端の外へ出たら一定速度で自動スクロール) ---------- */
  // 再生線をドラッグして端の外へ出したときのスクロール速度(px/秒): 引っ張る距離が長いほど速い
  const edgeSpeed = x => Math.min(4000, 40 + (x < 0 ? -x : Math.max(0, x - W)) * 8);
  let seeking = false, seekX = 0, lastTs = 0;
  const seekLoop = ts => {
    if (!seeking) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = seekX < 0 ? -1 : seekX > W ? 1 : 0;
    if (dir) viewStart = FH.clamp(viewStart + dir * edgeSpeed(seekX) * dt / pps(), -W * 0.5 / pps(), FH.duration());
    FH.setTime(tOf(FH.clamp(seekX, 0, W)));  // 再生位置は画面の端に張り付いたまま、視点が流れる
    invalidate(); requestAnimationFrame(seekLoop);
  };

  /* ---------- 編集(ステップ4) ----------
     カーソル: クリックで選択(Shift/Ctrl+クリックで追加・解除)、ドラッグで移動、ロングノーツは両端で伸縮、Delete/Backspaceで削除
     配置ツール: レーン上クリックでグリッドにスナップして配置(Alt押下でスナップ無効)
     既存アイテム上のクリックは、どのツールでも選択・移動になる */
  const ROWS = { event: 58, sig: 40, bpm: 22 };   // マーカー行の高さ(描画側と同じ値)
  const laneYOf = () => Math.round(Math.min(H - 30, Math.max(84, H * 0.6)));
  const snapT = (t, free) => Math.max(0, free ? t : FH.time.snap(t));
  const nextGrid = t => {                         // tの次のグリッド時刻
    const T = FH.time, st = 4 / FH.state.grid;
    return T.beatToTime((Math.floor(T.timeToBeat(t) / st + 1e-6) + 1) * st);
  };
  const items = () => {
    const P = FH.state.project.chart;
    return [...P.notes.map(o => ({ id: o.id, kind: o.type, o })),
            ...P.events.map(o => ({ id: o.id, kind: 'event', o })),
            ...P.timeSigEvents.map(o => ({ id: o.id, kind: 'sig', o })),
            ...P.bpmEvents.map(o => ({ id: o.id, kind: 'bpm', o }))];
  };
  const locked = it => (it.kind === 'sig' || it.kind === 'bpm') && it.o.time <= 1e-6;  // 0秒のBPM・拍子は固定
  const select = ids => FH.set('selection', new Set(ids));
  const commit = label => { FH.set('dirty', true); FH.emit('chart'); FH.emit('commit', label); };

  function hit(x, y) {
    const L = laneYOf(), all = items(), NRh = noteGeom().R;
    for (let i = all.length - 1; i >= 0; i--) {   // ノーツ(レーン上)
      const it = all[i];
      if (it.kind === 'single') {
        if (Math.hypot(x - xOf(it.o.time), y - L) <= NRh + 2) return { it, part: 'body' };
      } else if (it.kind === 'long') {
        const x1 = xOf(it.o.start.time), x2 = xOf(it.o.end.time);          // 端点の図形の中心が開始・終了時刻
        if (Math.abs(y - L) <= NRh && x >= x1 - NRh && x <= x2 + NRh)
          return { it, part: x2 - x1 < NRh * 2 + 4 ? 'body' : x <= x1 + NRh ? 'start' : x >= x2 - NRh ? 'end' : 'body' };
      }
    }
    let best = null, bd = 1e9;                    // 旗マーカー(柱と旗の周辺。重なる場合はクリック高さに近い行)
    all.forEach(it => {
      if (!ROWS[it.kind]) return;
      const ox = xOf(it.o.time), ry = L - ROWS[it.kind];
      if (x >= ox - 6 && x <= ox + 12 && y >= ry - 12 && y <= L - 4) {
        const d = Math.abs(y - (ry - 5));
        if (d < bd) { bd = d; best = { it, part: 'body' }; }
      }
    });
    return best;
  }

  function place(tool, rawT, free, endT) {
    const T = FH.time, P = FH.state.project, c = P.chart, t = snapT(rawT, free), u = FH.uid;
    let o, created = true;
    if (tool === 'single') { o = { id: u('n_'), type: 'single', time: t, color: FH.state.lastNoteColor }; c.notes.push(o); }
    else if (tool === 'long') {
      o = { id: u('n_'), type: 'long', start: { time: t, color: FH.state.lastNoteColor }, end: { time: endT !== undefined ? endT : nextGrid(t), color: FH.state.lastNoteColor } };
      c.notes.push(o);
    } else {
      const list = tool === 'event' ? c.events : tool === 'bpm' ? c.bpmEvents : c.timeSigEvents;
      o = list.find(e => Math.abs(e.time - t) < 1e-6);   // 同じ時刻にあれば新規作成せず選択だけ
      if (o) created = false;
      else {
        let init;
        if (tool === 'bpm') init = { bpm: T.bpmAt(t) };
        else if (tool === 'timesig') {
          let cur = c.timeSigEvents[0]; c.timeSigEvents.forEach(e => { if (e.time <= t && e.time >= cur.time) cur = e; });
          init = { num: cur.num, den: cur.den };
        } else init = { color: FH.DEFAULT_COLOR, text: 'イベント', disable: false };
        o = { id: u(tool === 'event' ? 'ev_' : tool === 'bpm' ? 'bpm_' : 'ts_'), time: t, ...init };
        list.push(o);
      }
    }
    if (t > P.meta.duration - 2) P.meta.duration = Math.ceil(t) + 10;   // 末尾付近に置いたら全体の長さを延ばす
    select([o.id]);
    if (created) commit('配置'); else FH.emit('chart');
  }

  function removeSelected() {
    const c = FH.state.project.chart, sel = FH.state.selection;
    const mine = items().filter(it => sel.has(it.id)).map(it => it.id);   // この譜面タイムラインのアイテムだけ対象
    if (!mine.length) return;
    const prot = o => o.time <= 1e-6;             // 0秒のBPM・拍子は削除できない
    c.notes = c.notes.filter(o => !sel.has(o.id));
    c.events = c.events.filter(o => !sel.has(o.id));
    c.bpmEvents = c.bpmEvents.filter(o => !sel.has(o.id) || prot(o));
    c.timeSigEvents = c.timeSigEvents.filter(o => !sel.has(o.id) || prot(o));
    select([...sel].filter(id => !mine.includes(id))); commit('削除');
  }

  let drag = null, hover = null;
  const lx = e => e.clientX - cv.getBoundingClientRect().left;
  const ly = e => e.clientY - cv.getBoundingClientRect().top;

  /* ロングノーツの配置ドラッグ: 押した位置から離した位置までを始点・終点にする(右→左でも可)。クリックだけなら1グリッド分 */
  let lp = null;
  const lpLoop = ts => {
    if (!lp) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = lp.x < 0 ? -1 : lp.x > W ? 1 : 0;           // 端の外では一定速度でスクロール
    if (dir) viewStart = FH.clamp(viewStart + dir * 240 * dt / pps(), -W * 0.5 / pps(), FH.duration());
    invalidate(); requestAnimationFrame(lpLoop);
  };

  /* 範囲選択: 始点は時間位置(t0)で持つので、スクロールしても譜面に追従してずれる */
  let mq = null;
  const bounds = it => {
    const L = laneYOf(), NRb = noteGeom().R;
    if (it.kind === 'single') { const x = xOf(it.o.time); return [x - NRb, L - NRb, x + NRb, L + NRb]; }
    if (it.kind === 'long') return [xOf(it.o.start.time) - NRb, L - NRb, xOf(it.o.end.time) + NRb, L + NRb];
    const x = xOf(it.o.time), ry = L - ROWS[it.kind];
    return [x - 4, ry - 12, x + 12, ry];
  };
  const mqRect = () => ({ x1: Math.min(xOf(mq.t0), mq.x), x2: Math.max(xOf(mq.t0), mq.x), y1: Math.min(mq.y0, mq.y), y2: Math.max(mq.y0, mq.y) });
  function applyMq() {
    const r = mqRect();
    const ids = items().filter(it => { const b = bounds(it); return b[0] <= r.x2 && b[2] >= r.x1 && b[1] <= r.y2 && b[3] >= r.y1; }).map(it => it.id);
    const key = ids.join(','); if (key === mq.key) return;
    mq.key = key; select([...mq.base, ...ids]);
  }
  const mqLoop = ts => {
    if (!mq) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = mq.x < 0 ? -1 : mq.x > W ? 1 : 0;           // 端の外では一定速度でスクロール
    if (dir) viewStart = FH.clamp(viewStart + dir * 240 * dt / pps(), -W * 0.5 / pps(), FH.duration());
    if (mq.moved) applyMq();
    invalidate(); requestAnimationFrame(mqLoop);
  };

  function dragTo(x, free) {
    const d = drag;
    if (!d.moved && Math.abs(x - d.x0) < 3) return;
    d.moved = true;
    const dt = tOf(x) - d.t0, all = items().filter(it => d.orig.has(it.id));
    const pit = all.find(a => a.id === d.id);
    if (d.mode === 'start' || d.mode === 'end') {   // ロングノーツの始点・終点
      const o = d.orig.get(d.id);
      if (d.mode === 'start') pit.o.start.time = FH.clamp(snapT(o.s + dt, free), 0, pit.o.end.time - 0.001);
      else pit.o.end.time = Math.max(snapT(o.e + dt, free), pit.o.start.time + 0.001);
    } else {                                        // 選択中アイテムをまとめて移動
      if (locked(pit)) return;
      const p = d.orig.get(d.id), base = p.s ?? p.t;
      let delta = snapT(base + dt, free) - base;
      all.forEach(it => {
        if (locked(it)) return;
        const o = d.orig.get(it.id), min = it.kind === 'bpm' || it.kind === 'sig' ? 0.001 : 0;
        delta = Math.max(delta, min - (o.s ?? o.t));
      });
      all.forEach(it => {
        if (locked(it)) return;
        const o = d.orig.get(it.id);
        if (it.kind === 'long') { it.o.start.time = o.s + delta; it.o.end.time = o.e + delta; }
        else it.o.time = o.t + delta;
      });
    }
    FH.emit('chart');
  }

  cv.addEventListener('pointerdown', e => {
    const x = lx(e), y = ly(e), s = FH.state;
    cv.setPointerCapture(e.pointerId);
    if (y <= RULER_H) { seeking = true; seekX = x; lastTs = performance.now(); requestAnimationFrame(seekLoop); return; }
    if (s.pasting) { FH.pasteAt('chart', snapT(tOf(x), e.altKey)); return; }   // 貼り付け待ち: クリックで配置
    const h = hit(x, y), multi = e.shiftKey || e.ctrlKey || e.metaKey;
    if (!h) {
      if (s.tool === 'cursor') {                                   // 空白からドラッグで範囲選択(クリックだけなら選択解除)
        mq = { t0: tOf(x), y0: y, sx: x, x, y, multi, base: multi ? new Set(s.selection) : new Set(), moved: false, key: null };
        lastTs = performance.now(); requestAnimationFrame(mqLoop);
      } else if (s.tool === 'long') {
        lp = { t0: snapT(tOf(x), e.altKey), sx: x, x, moved: false, free: e.altKey };
        lastTs = performance.now(); requestAnimationFrame(lpLoop);
      } else place(s.tool, tOf(x), e.altKey);
      return;
    }
    const id = h.it.id, sel = new Set(s.selection), collapse = !multi && sel.has(id) && sel.size > 1;
    if (collapse) FH.state.multiHint = { ids: [...sel], at: performance.now() };   // ダブルクリックで一括編集を開くために覚えておく
    if (multi) { sel.has(id) ? sel.delete(id) : sel.add(id); select(sel); if (!sel.has(id)) return; }
    else if (!sel.has(id)) select([id]);
    const orig = new Map();
    items().forEach(it => {
      if (!FH.state.selection.has(it.id)) return;
      orig.set(it.id, it.kind === 'long' ? { s: it.o.start.time, e: it.o.end.time } : { t: it.o.time });
    });
    drag = { mode: h.part, id, t0: tOf(x), x0: x, moved: false, collapse, orig };
  });
  cv.addEventListener('pointermove', e => {
    const x = lx(e), y = ly(e);
    if (seeking) { seekX = x; return; }
    if (mq) { mq.x = x; mq.y = y; if (!mq.moved && Math.hypot(x - mq.sx, y - mq.y0) >= 3) mq.moved = true; if (mq.moved) applyMq(); return; }
    if (lp) { lp.x = x; lp.free = e.altKey; if (Math.abs(x - lp.sx) >= 3) lp.moved = true; invalidate(); return; }
    if (drag) { dragTo(x, e.altKey); return; }
    hover = { x, y, alt: e.altKey };
    const h = y > RULER_H ? hit(x, y) : null;
    cv.style.cursor = y <= RULER_H ? 'ew-resize' : h ? (h.part === 'body' ? 'grab' : 'ew-resize') : 'default';
    if (FH.state.tool !== 'cursor' || FH.state.pasting) invalidate();
  });
  const endPointer = () => {
    seeking = false;
    if (mq) { if (!mq.moved && !mq.multi) select([]); mq = null; invalidate(); }
    if (lp) {
      const l = lp, t1 = snapT(tOf(l.x), l.free), a = Math.min(l.t0, t1), b = Math.max(l.t0, t1);
      lp = null; invalidate();
      if (l.moved && b - a > 1e-6) place('long', a, true, b); else place('long', l.t0, true);
    }
    if (!drag) return;
    if (drag.moved) commit('移動'); else if (drag.collapse) select([drag.id]);
    drag = null;
  };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', () => { hover = null; invalidate(); });
  cv.addEventListener('dblclick', e => {            // コンフィグを開く(処理はステップ6)
    const h = hit(lx(e), ly(e));
    if (h) FH.openConfig(h.it.id);
  });
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
    else if (e.key === 'Escape' && !FH.state.pasting) select([]);
  });

  /* ---------- 動作確認用のサンプル譜面 ---------- */
  FH.loadDemo = () => {
    const p = FH.newProject(), c = p.chart, u = FH.uid, G = '#39e07a', B = '#4aa8ff', WH = p.settings.chart.noteFill || '#ffffff';
    c.bpmEvents = [{ id: u('bpm_'), time: 0, bpm: 120 }, { id: u('bpm_'), time: 8, bpm: 150 }];
    c.timeSigEvents = [{ id: u('ts_'), time: 0, num: 4, den: 4 }, { id: u('ts_'), time: 14.4, num: 3, den: 4 }];
    c.events = [
      { id: u('ev_'), time: 0, color: G, text: 'FULL STROKE', disable: false },
      { id: u('ev_'), time: 5.5, color: C.sub, text: '', disable: true },
      { id: u('ev_'), time: 7, color: '#ff5a5a', text: 'SLOW', disable: false },
      { id: u('ev_'), time: 10, color: '#ffb020', text: 'SPEED UP', disable: false }
    ];
    [1, 1.5, 2, 2.5, 5, 5.5, 6, 6.5, 9, 9.4, 9.8, 10.2].forEach((t, i) =>
      c.notes.push({ id: u('n_'), type: 'single', time: t, color: WH }));
    c.notes.push({ id: u('n_'), type: 'long', start: { time: 3, color: WH }, end: { time: 4.5, color: B } });
    c.notes.push({ id: u('n_'), type: 'long', start: { time: 11, color: WH }, end: { time: 13, color: WH } });
    FH.loadProject(p);
  };
  document.getElementById('dev').addEventListener('click', e => { if (e.target.id === 'demoBtn') FH.loadDemo(); });
})();

/* ============================================================
   アイテムタイムライン(ステップ5)
   ・再生バー: スクラブスライダー / ‹ › / 時刻表示(入力でジャンプ) / 最初・再生開始時刻・再生停止・最後 / 読み込み
   ・クリップ: 行(layer)ごとに配置。ドラッグで移動(縦で行変更)、左右端でトリミング、Delete で削除
   ・読み込み: シングルノーツツールでクリック / ファイルをドロップ / 再生バーの読み込みボタン
   ・同じ行で重なる配置は不可(重なったらドラッグ前の状態に戻る)
   ・メディア実体は FH.blobs、再生用URLは FH.mediaURL(id) で取得(ステップ7で使用)
   ============================================================ */
(() => {
  const svg = d => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    first: '<path d="M6 5v14 M19 5l-9 7 9 7z"/>', start: '<rect x="7" y="7" width="10" height="10"/>',
    play: '<path d="M8 5l11 7-11 7z"/>', pause: '<path d="M8 5v14 M16 5v14"/>',
    last: '<path d="M18 5v14 M5 5l9 7-9 7z"/>', imp: '<path d="M12 4v12 M8 12l4 4 4-4 M5 20h14"/>'
  };
  const tpEl = document.getElementById('tp');
  tpEl.innerHTML =
    `<div class="tp-scrub"><button data-tp="back" title="戻る(Shiftで1秒)" aria-label="戻る">‹</button>
       <input type="range" id="scrub" min="0" step="0.01" value="0" aria-label="時刻">
       <button data-tp="fwd" title="進む(Shiftで1秒)" aria-label="進む">›</button></div>
     <div class="tp-row"><input class="tp-time" id="tpTime" value="00:00.00" aria-label="現在時刻(入力してEnterでジャンプ)">
       <button class="tb-btn" data-tp="first" title="最初に飛ぶ" aria-label="最初に飛ぶ">${svg(ICON.first)}</button>
       <button class="tb-btn" data-tp="start" title="再生開始時刻に飛ぶ" aria-label="再生開始時刻に飛ぶ">${svg(ICON.start)}</button>
       <button class="tb-btn" data-tp="play" id="tpPlay" title="再生・停止" aria-label="再生・停止">${svg(ICON.play)}</button>
       <button class="tb-btn" data-tp="last" title="最後に飛ぶ" aria-label="最後に飛ぶ">${svg(ICON.last)}</button>
       <button class="tb-btn" data-tp="imp" title="メディアを読み込む" aria-label="メディアを読み込む" style="margin-left:8px">${svg(ICON.imp)}</button>
       <select id="itemSnap" class="u-sel" style="margin-left:8px" title="アイテムのスナップ" aria-label="アイテムのスナップ"><option value="chart">スナップ: 譜面グリッド</option><option value="frame">スナップ: 1フレーム</option></select></div>`;
  const scrub = document.getElementById('scrub'), tpTime = document.getElementById('tpTime'), playBtn = document.getElementById('tpPlay');
  const snapSel = document.getElementById('itemSnap');
  snapSel.value = FH.state.itemSnap;
  snapSel.addEventListener('change', () => { FH.set('itemSnap', snapSel.value); snapSel.blur(); });
  const tl = document.getElementById('tl'), cv = document.getElementById('itemsCv'), ctx = cv.getContext('2d');
  const fileIn = document.getElementById('fileIn');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { text: css('--text'), sub: css('--sub'), edge: css('--edge'), panel2: css('--panel2'), red: css('--red'),
              s1: css('--stripe1'), s2: css('--stripe2'), hl: css('--hl') };
  FH.on('theme', () => {
    Object.assign(C, { text: css('--text'), sub: css('--sub'), edge: css('--edge'), panel2: css('--panel2'),
                       red: css('--red'), s1: css('--stripe1'), s2: css('--stripe2'), hl: css('--hl') });
    invalidate();
  });
  const FONT = '"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif';
  const BASE_PPS = 120, RULER_H = 18, PLAY_X = 0.3, ROW_H = 34, GAP = 4, TOP = RULER_H + 8, EDGE = 6, MIN_DUR = 0.05;
  const COLOR = { audio: '#3f8cff', video: '#9b6bff', image: '#e6a23c' }, GLYPH = { audio: '♫', video: '▶', image: '▣' };
  let W = 0, H = 0, dpr = 1, viewStart = 0, scrollY = 0, queued = false, first = true;
  let seeking = false, seekX = 0, lastTs = 0, drag = null, pending = null, justDragged = false, hover = null;

  const pps = () => BASE_PPS * FH.state.zoom;
  const xOf = t => (t - viewStart) * pps();
  const tOf = x => viewStart + x / pps();
  const rowY = r => TOP + r * (ROW_H + GAP) - scrollY;
  const rowAt = y => Math.floor((y + scrollY - TOP) / (ROW_H + GAP));
  const r3 = v => Math.round(v * 1000) / 1000;
  const resetView = () => { viewStart = FH.state.time - PLAY_X * W / pps(); };
  const followPlay = t => {                  // 再生線が閾値(画面幅に対する割合)を超えたら、その位置を保ったままスクロール
    const S = FH.state.project.settings.chart;
    if (S.followEnabled === false) return;
    const thr = FH.clamp(S.followThreshold ?? 0.8, 0, 1);
    if (xOf(t) > thr * W || xOf(t) < 0) viewStart = t - thr * W / pps();
  };
  const invalidate = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };
  const select = ids => FH.set('selection', new Set(ids));
  const commit = label => { FH.set('dirty', true); FH.emit('chart'); FH.emit('commit', label); };
  const maxScroll = () => Math.max(0, rowY(Math.max(-1, ...FH.state.project.items.map(i => i.layer)) + 3) + scrollY - H);

  /* ---------- メディア読み込み ---------- */
  const urls = {};
  FH.mediaURL = id => (urls[id] ??= URL.createObjectURL(FH.blobs.get(id)));
  const typeOf = f => {
    const m = /^(audio|video|image)\//.exec(f.type); if (m) return m[1];
    if (/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name)) return 'audio';
    if (/\.(mp4|webm|mov|mkv|m4v)$/i.test(f.name)) return 'video';
    if (/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name)) return 'image';
    return null;
  };
  const probe = (f, type) => new Promise(res => {
    const url = URL.createObjectURL(f), done = v => { URL.revokeObjectURL(url); res(v); };
    if (type === 'image') {
      const im = new Image(); im.onload = () => done({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = () => done({}); im.src = url;
    } else {
      const el = document.createElement(type === 'audio' ? 'audio' : 'video'); el.preload = 'metadata';
      el.onloadedmetadata = () => done({ duration: isFinite(el.duration) ? el.duration : 5, w: el.videoWidth, h: el.videoHeight });
      el.onerror = () => done({ duration: 5 }); el.src = url;
    }
  });
  const overlap = (a, b) => a !== b && a.layer === b.layer && a.start < b.start + b.duration - 1e-6 && b.start < a.start + a.duration - 1e-6;
  async function importFiles(files, at) {
    const P = FH.state.project, ids = [];
    let t = Math.max(0, at.t), row = Math.max(0, at.row);
    for (const f of files) {
      const type = typeOf(f); if (!type) continue;           // 対応外のファイルは無視
      const meta = await probe(f, type), mid = FH.uid('m_');
      FH.blobs.set(mid, f);
      P.media[mid] = { name: f.name, mime: f.type, size: f.size, ...meta };
      const it = FH.newItem(type, f.name, mid, t, type === 'image' ? 5 : r3(meta.duration || 5));
      it.layer = row; while (P.items.some(o => overlap(it, o))) it.layer++;   // 空いている行まで下げる
      P.items.push(it); ids.push(it.id);
    }
    if (ids.length) { select(ids); commit('読み込み'); }
  }
  fileIn.onchange = () => { const fs = [...fileIn.files]; fileIn.value = ''; importFiles(fs, pending || { t: FH.state.time, row: 0 }); pending = null; };
  const openDialog = at => { pending = at; fileIn.click(); };
  tl.addEventListener('dragover', e => e.preventDefault());
  tl.addEventListener('drop', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    importFiles([...e.dataTransfer.files], { t: Math.max(0, snapGrid(tOf(e.clientX - r.left))), row: rowAt(e.clientY - r.top) });
  });

  /* ---------- 再生バー ---------- */
  tpEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const s = FH.state, step = e.shiftKey ? 1 : 0.1;
    ({ back: () => FH.setTime(s.time - step), fwd: () => FH.setTime(s.time + step), first: () => FH.setTime(0),
       start: () => { FH.pause(); FH.setTime(s.playStart); }, play: () => FH.toggle(),
       last: () => FH.setTime(FH.duration()), imp: () => openDialog({ t: s.time, row: 0 }) })[b.dataset.tp]?.();
    b.blur();
  });
  scrub.addEventListener('input', () => FH.setTime(+scrub.value));
  scrub.addEventListener('change', () => scrub.blur());
  tpTime.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = FH.time.parse(tpTime.value); if (v != null) FH.setTime(v); tpTime.blur(); }
    else if (e.key === 'Escape') tpTime.blur();
  });
  tpTime.addEventListener('blur', () => { tpTime.value = FH.time.format(FH.state.time); });
  const syncBar = () => {
    scrub.max = FH.duration(); scrub.value = FH.state.time;
    if (document.activeElement !== tpTime) tpTime.value = FH.time.format(FH.state.time);
  };
  ['change:time', 'project', 'chart'].forEach(n => FH.on(n, syncBar));
  FH.on('change:playing', p => { playBtn.innerHTML = svg(p ? ICON.pause : ICON.play); });
  syncBar();

  /* ---------- 描画 ---------- */
  /* ---------- 波形(音声を含む音声・動画のクリップに表示) ----------
     メディアを1回だけデコードして、1秒あたり400個のピーク値にまとめて保存する。描画はそこから画面の幅に合わせて取り出す */
  const WAVE_RATE = 400;
  const waves = new Map();                                   // メディアID -> {peaks, scale} | 'loading' | 'none'
  FH.waveInfo = id => { const w = waves.get(id); return w && w.peaks ? { bins: w.peaks.length, scale: w.scale } : (w || null); };
  function ensureWave(it) {
    if (waves.has(it.mediaId)) return waves.get(it.mediaId);
    waves.set(it.mediaId, 'loading');
    (async () => {
      const id = it.mediaId;
      try {
        const blob = FH.blobs.get(id), Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!blob || !Ctx || blob.size > 400e6) throw new Error('skip');                 // 大きすぎるファイルは波形を作らない
        const buf = await new Ctx(1, 1, 44100).decodeAudioData(await blob.arrayBuffer());
        const n = Math.max(1, Math.ceil(buf.duration * WAVE_RATE)), peaks = new Float32Array(n), spb = buf.sampleRate / WAVE_RATE;
        for (let ch = 0; ch < buf.numberOfChannels; ch++) {
          const d = buf.getChannelData(ch);
          for (let b = 0; b < n; b++) {
            const a0 = Math.floor(b * spb), a1 = Math.min(d.length, Math.floor((b + 1) * spb)); let m = peaks[b];
            for (let i = a0; i < a1; i++) { const v = d[i] < 0 ? -d[i] : d[i]; if (v > m) m = v; }
            peaks[b] = m;
          }
          await new Promise(r => setTimeout(r));                                          // 長い音声でも画面を固まらせない
        }
        let mx = 0; for (let i = 0; i < n; i++) if (peaks[i] > mx) mx = peaks[i];
        waves.set(id, { peaks, scale: mx > 0.001 ? Math.min(8, 1 / mx) : 1 });             // 小さい音でも見えるよう、最大値で正規化
      } catch (e) { waves.set(id, 'none'); }                                              // 音声のない動画・デコードできない形式
      invalidate();
    })();
    return 'loading';
  }
  function drawWave(wv, it, x1, x2, y) {
    const x0 = Math.max(Math.floor(x1), 0), xe = Math.min(Math.ceil(x2), W);
    if (xe <= x0) return;
    const peaks = wv.peaks, n = peaks.length, mid = y + ROW_H / 2, amp = ROW_H / 2 - 3;
    ctx.save(); ctx.beginPath(); ctx.rect(x1, y, x2 - x1, ROW_H); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let px = x0; px < xe; px++) {
      const m0 = it.trimIn + (tOf(px) - it.start), m1 = it.trimIn + (tOf(px + 1) - it.start);   // この1画素が受け持つメディア内の時刻
      const b0 = Math.max(0, Math.floor(m0 * WAVE_RATE)), b1 = Math.min(n - 1, Math.max(b0, Math.ceil(m1 * WAVE_RATE) - 1));
      let m = 0; for (let b = b0; b <= b1; b++) if (peaks[b] > m) m = peaks[b];
      const hh = Math.max(1, Math.min(1, m * wv.scale) * amp);
      ctx.fillRect(px, mid - hh, 1, hh * 2);
    }
    ctx.restore();
  }
  const groupColor = id => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h},70%,58%)`; };

  const rr = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
  function draw() {
    queued = false;
    if (!W) return;
    const s = FH.state, P = s.project, T = FH.time, k = pps();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    const xs = xOf(0), xe = xOf(FH.duration());
    if (xs > 0) ctx.fillRect(0, 0, Math.min(xs, W), H);
    if (xe < W) ctx.fillRect(Math.max(xe, 0), 0, W - Math.max(xe, 0), H);
    const rows = Math.max(-1, ...P.items.map(i => i.layer)) + 3;
    for (let r = 0; r < rows; r++) { ctx.fillStyle = r % 2 ? C.s1 : C.s2; ctx.fillRect(0, rowY(r) - 2, W, ROW_H + 4); }
    {                                                         // グリッド線(スナップ設定に合わせて表示。細かすぎる場合は間引く)
      const g0 = Math.max(0, tOf(0)), g1 = tOf(W);
      ctx.lineWidth = 1; ctx.globalAlpha = .6;
      const gl = (t, strong) => {
        const x = Math.round(xOf(t)) + .5; ctx.strokeStyle = strong ? C.sub : C.edge;
        ctx.beginPath(); ctx.moveTo(x, RULER_H); ctx.lineTo(x, H); ctx.stroke();
      };
      if (s.itemSnap === 'frame') {
        const fps = P.meta.fps || 30, fr = 1 / fps;
        if (fr * k >= 6) for (let i = Math.ceil(g0 / fr); i * fr <= g1; i++) gl(i * fr, i % fps === 0);
      } else {
        const pxBeat = k * 60 / T.bpmAt(g0), div = (4 / s.grid) * pxBeat >= 6 ? s.grid : pxBeat >= 6 ? 4 : 0;
        if (div) T.gridTimes(g0, g1, div).forEach(g => gl(g.time, g.isBeat));
      }
      ctx.globalAlpha = 1;
    }

    P.items.forEach(it => {
      const x1 = xOf(it.start), x2 = Math.max(xOf(it.start + it.duration), x1 + 4), y = rowY(it.layer);
      if (x2 < -5 || x1 > W + 5 || y + ROW_H < RULER_H || y > H) return;
      rr(x1, y, x2 - x1, ROW_H, 6);
      ctx.globalAlpha = .3; ctx.fillStyle = COLOR[it.type]; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = COLOR[it.type]; ctx.lineWidth = 1.5; ctx.stroke();
      if (it.type !== 'image') { const wv = ensureWave(it); if (wv && wv.peaks) drawWave(wv, it, x1, x2, y); }   // 音声を含む場合は波形
      if (it.groupId) { ctx.fillStyle = groupColor(it.groupId); ctx.fillRect(x1 + 3, y + 4, 4, ROW_H - 8); }       // グループの目印(色)
      if (x2 - x1 > 24) {
        ctx.save(); ctx.beginPath(); ctx.rect(x1 + 6, y, x2 - x1 - 10, ROW_H); ctx.clip();
        ctx.font = '12px ' + FONT; ctx.fillStyle = C.text; ctx.textBaseline = 'middle';
        ctx.fillText(`${GLYPH[it.type]} ${it.name}`, x1 + 8, y + ROW_H / 2); ctx.restore();
      }
    });
    P.items.forEach(it => {                                   // 選択中はハイライト色で縁取りする
      if (!s.selection.has(it.id)) return;
      const x1 = xOf(it.start), x2 = Math.max(xOf(it.start + it.duration), x1 + 4), y = rowY(it.layer);
      rr(x1 - 2, y - 2, x2 - x1 + 4, ROW_H + 4, 8); ctx.strokeStyle = C.hl; ctx.lineWidth = 2.5; ctx.stroke();
    });
    if (!P.items.length) {
      ctx.fillStyle = C.sub; ctx.font = '12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ファイルをドロップ、またはシングルノーツツールでクリックして読み込み', W / 2, H / 2 + RULER_H / 2); ctx.textAlign = 'left';
    }

    if (mq && mq.moved) {                                        // 範囲選択の枠
      const r = mqRect();
      ctx.save(); ctx.globalAlpha = .15; ctx.fillStyle = C.red; ctx.fillRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
      ctx.globalAlpha = 1; ctx.strokeStyle = C.red; ctx.lineWidth = 1; ctx.strokeRect(r.x1 + .5, r.y1 + .5, r.x2 - r.x1, r.y2 - r.y1);
      ctx.restore();
    }
    if (s.pasting && hover && hover.y > RULER_H && isFinite(s.pasting.base.item)) {   // 貼り付け待ち: 半透明で表示
      const dt = (hover.alt ? tOf(hover.x) : snapGrid(tOf(hover.x))) - s.pasting.base.item;
      const en = s.pasting.en.filter(e => e.k === 'item'), minL = Math.min(...en.map(e => e.o.layer)), row0 = Math.max(0, rowAt(hover.y));
      ctx.save(); ctx.globalAlpha = .45;
      en.forEach(e => {
        const x1 = xOf(Math.max(0, e.o.start + dt)), x2 = Math.max(xOf(Math.max(0, e.o.start + dt) + e.o.duration), x1 + 4), y = rowY(row0 + e.o.layer - minL);
        rr(x1, y, x2 - x1, ROW_H, 6); ctx.fillStyle = COLOR[e.o.type]; ctx.fill();
      });
      ctx.restore();
    }
    ctx.fillStyle = C.panel2; ctx.fillRect(0, 0, W, RULER_H);   // ルーラー
    ctx.strokeStyle = C.edge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, RULER_H + .5); ctx.lineTo(W, RULER_H + .5); ctx.stroke();
    const st = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600].find(v => v * k >= 84) || 600;
    ctx.fillStyle = C.sub; ctx.strokeStyle = C.sub; ctx.font = '11px ' + FONT; ctx.textBaseline = 'middle';
    for (let i = Math.max(0, Math.ceil(tOf(-24) / st)); i * st <= tOf(W + 24); i++) {
      const x = Math.round(xOf(i * st)) + .5, label = T.format(i * st);
      ctx.beginPath(); ctx.moveTo(x, RULER_H - 5); ctx.lineTo(x, RULER_H); ctx.stroke();
      ctx.fillText(st >= 1 ? label.slice(0, 5) : label, x + 4, RULER_H / 2);
    }
    const px = xOf(s.time);                                   // 再生位置線
    if (px > -10 && px < W + 10) {
      ctx.strokeStyle = C.red; ctx.fillStyle = C.red; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, RULER_H); ctx.lineTo(px, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px - 5, RULER_H - 8); ctx.lineTo(px + 5, RULER_H - 8); ctx.lineTo(px, RULER_H - 1); ctx.closePath(); ctx.fill();
    }
  }
  new ResizeObserver(() => {
    dpr = window.devicePixelRatio || 1; W = tl.clientWidth; H = tl.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (first && W) { first = false; resetView(); }
    scrollY = FH.clamp(scrollY, 0, maxScroll()); invalidate();
  }).observe(tl);

  /* ---------- 状態との連携(ズーム・追従は譜面タイムラインと同じ動き) ---------- */
  FH.on('change:time', () => {
    if (seeking) { invalidate(); return; }
    const s = FH.state, x = xOf(s.time);
    if (s.playing) followPlay(s.time); else if (x < 0 || x > W) viewStart = s.time - 0.5 * W / pps();
    invalidate();
  });
  let lastZoom = FH.state.zoom;
