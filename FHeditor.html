    }

    if (on && on.text) {
      const fs = Math.round(h * 0.04), padX = fs * 0.5, padY = fs * 0.25;
      c.font = `bold ${fs}px ${S.fontFamily || FONT_DEFAULT}`;                   // フォントは譜面設定で指定
      const tw = c.measureText(on.text).width, bw = tw + padX * 2, bh = fs + padY * 2;
      const bx = cx + S.textOffsetX * k - bw / 2, by = cy + R + 8 * k + S.textOffsetY * k;   // ドットの真下 + オフセット
      c.fillStyle = '#000'; c.fillRect(bx, by, bw, bh);                          // 黒い四角(角は丸めない)
      c.fillStyle = on.color; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(on.text, bx + bw / 2, by + bh / 2 + fs * 0.04);
    }
    c.restore();
  }

  FH.renderFrame = (c, w, h, t) => {
    c.save();
    c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
    c.beginPath(); c.rect(0, 0, w, h); c.clip();
    const P = FH.state.project, groups = P.groups || [], byGroup = new Map(), entries = [];
    P.items.filter(it => it.type !== 'audio' && t >= it.start && t < it.start + it.duration).forEach(it => {
      const g = it.groupId && groups.find(x => x.id === it.groupId);
      if (!g) { entries.push({ z: it.layer, it }); return; }
      let e = byGroup.get(g.id);                                   // グループは、最前面のメンバーの重なり順で1つのまとまりとして描く
      if (!e) { e = { z: it.layer, g, members: [] }; byGroup.set(g.id, e); entries.push(e); }
      e.members.push(it); e.z = Math.min(e.z, it.layer);
    });
    entries.sort((a, b) => b.z - a.z)                              // 下の行から先に描く(0行目が最前面)
      .forEach(e => e.g ? drawGroup(c, e.g, e.members.sort((a, b) => b.layer - a.layer), w, h, t) : drawItem(c, e.it, w, h, t));
    drawChart(c, w, h, t);
    c.restore();
  };

  /* ---------- プレビュー表示 ---------- */
  function draw() {
    queued = false;
    if (!W) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#101114'; ctx.fillRect(0, 0, W, H);
    const ar = FH.OUT.w / FH.OUT.h, fw = Math.min(W, H * ar), fh = fw / ar;
    ctx.save(); ctx.translate((W - fw) / 2, (H - fh) / 2);
    FH.renderFrame(ctx, fw, fh, FH.state.time);
    ctx.restore();
  }
  new ResizeObserver(() => {
    dpr = window.devicePixelRatio || 1; W = panel.clientWidth; H = panel.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); invalidate();
  }).observe(panel);

  /* ---------- 状態との連携 ---------- */
  const update = () => { syncMedia(); invalidate(); };
  ['change:time', 'change:speed', 'chart'].forEach(n => FH.on(n, update));
  FH.on('change:playing', p => { if (p) { const ac = audio.ensure(); if (ac) ac.resume(); } update(); });
  FH.on('project', () => { [...els.keys()].forEach(dispose); imgs.clear(); update(); });
})();

/* ============================================================
   Funscript(ステップ10)
   ・ノーツを置くと、位置(0〜100%)のキーフレームが自動で作られる
       シングル: 「平時の位置 → ノーツの時刻に反対側 → 平時の位置」の1往復(所要時間は strokeMs。近いノーツの間は平時の位置を中間に1つだけ置く)
       既定は平時=上端(100%)、ノーツで下端へ落ち込む。設定の「上下の基準」で反転できる。区間のイージングの既定はサイン
       ロング  : 「始点: 平時 → 中間: 反対側 → 終点: 平時」で1往復
   ・譜面タイムライン直下のタイムラインで、キーフレームの追加・移動・削除・範囲選択・数値編集ができる(横位置とズームは譜面と共有)
   ・手動で動かした項目(lt=時刻 / lp=位置)は固定され、ノーツを動かしても元に戻らない。「自動に戻す」で解除
   ・速度制限: 隣り合うキーフレーム間の動きが最大速度(%/秒)を超えないよう、位置を手前に寄せる(表示も出力も同じ結果)
   ・出力: { version, inverted, range, actions:[{at(ms), pos(0-100)}] }  → FH.fun.build(endT)
   ============================================================ */
(() => {
  const panel = document.getElementById('fun');
  panel.innerHTML = `<div class="fun-head"><span class="fun-title">Funscript</span>
      <label class="fun-lab">位置スナップ <select id="funSnap" class="u-sel" aria-label="位置スナップ"><option value="1">1%</option><option value="5">5%</option><option value="10">10%</option></select></label>
      <button class="ex-btn" id="funCfg" title="Funscript設定を開く">設定</button>
      <span class="fun-hint">ダブルクリック: 追加 / 編集・Delete: 削除・ドラッグ: 移動(Altでスナップなし)</span></div>
    <div class="fun-body">
      <div class="fun-main"><canvas role="img" aria-label="Funscriptキーフレーム"></canvas></div>
      <div class="fun-dev"><canvas role="img" aria-label="デバイスの動作プレビュー"></canvas></div>
    </div>`;
  const body = panel.querySelector('.fun-main'), cv = body.firstElementChild, ctx = cv.getContext('2d');
  const devBox = panel.querySelector('.fun-dev'), dcv = devBox.firstElementChild, dctx = dcv.getContext('2d');   // 右側: デバイスの動作プレビュー
  const snapSel = document.getElementById('funSnap');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const readC = () => ({ text: css('--text'), sub: css('--sub'), edge: css('--edge'), green: css('--green'), red: css('--red'), bg: css('--bg'), hl: css('--hl') });
  const C = readC();
  const FONT = '"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif';
  const PAD = 14, HIT = 9;
  let W = 0, H = 0, dw = 0, dh = 0, dpr = 1, queued = false, drag = null, mq = null, lastTs = 0;

  const F = () => FH.state.project.funscript;
  const r3 = v => Math.round(v * 1000) / 1000;
  const pps = () => FH.view.pps();
  const xOf = t => (t - FH.view.start) * pps();
  const tOf = x => FH.view.start + x / pps();
  const yOf = v => PAD + (100 - v) / 100 * (H - PAD * 2);
  const vOf = y => 100 - (y - PAD) / (H - PAD * 2) * 100;
  const invalidate = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };
  const select = ids => FH.set('selection', new Set(ids));
  const commit = l => { FH.set('dirty', true); FH.emit('chart'); FH.emit('commit', l); };

  /* ---------- ノーツからの自動割り当て ---------- */
  const derive = (n, r, st, nb) => {   // nb: 前のノーツの終わり(pe)と次のノーツの始まり(ns)
    const d = st.strokeMs / 1000, half = gap => Math.max(0, Math.min(d / 2, gap / 2)); let t;
    if (n.type === 'single') {          // 近いノーツとの間は、谷を2つのノーツの中間に1つだけ置く
      t = r === 'a' ? n.time - half(n.time - nb.pe) : r === 'b' ? n.time : n.time + half(nb.ns - n.time);
    } else t = r === 'a' ? n.start.time : r === 'b' ? (n.start.time + n.end.time) / 2 : n.end.time;
    const rest = st.restTop === false ? st.lo : st.hi, dip = st.restTop === false ? st.hi : st.lo;   // 平時の位置 / ノーツの位置での動き先
    return { t: r3(Math.max(0, t)), pos: r === 'b' ? dip : rest };
  };
  function sync() {                     // ノーツと同期: 削除されたノーツの分を消し、新しいノーツの分を作り、固定されていない項目を追従させる
    const p = FH.state.project, f = p.funscript; if (!f) return;
    const notes = new Map(p.chart.notes.map(n => [n.id, n]));
    const t0 = n => n.type === 'long' ? n.start.time : n.time, t1 = n => n.type === 'long' ? n.end.time : n.time;
    const order = [...notes.values()].sort((a, b) => t0(a) - t0(b)), nb = new Map();
    order.forEach((n, i) => nb.set(n.id, { pe: i ? t1(order[i - 1]) : -Infinity, ns: i < order.length - 1 ? t0(order[i + 1]) : Infinity }));
    f.keys = f.keys.filter(k => !k.n || notes.has(k.n));
    Object.keys(f.gen).forEach(id => { if (!notes.has(id)) delete f.gen[id]; });
    notes.forEach(n => {
      if (f.gen[n.id]) return;
      f.gen[n.id] = 1;
      ['a', 'b', 'c'].forEach(r => f.keys.push({ id: FH.uid('k_'), n: n.id, r, ...derive(n, r, f.settings, nb.get(n.id)) }));
    });
    f.keys.forEach(k => {
      if (!k.n) return;
      const d = derive(notes.get(k.n), k.r, f.settings, nb.get(k.n));
      if (!k.lt) k.t = d.t;
      if (!k.lp) k.pos = d.pos;
    });
  }

  /* ---------- 区間のイージング(プルダウン or 式) ----------
     式は自前の小さな構文解析で評価する(eval/Function は使わない。共有されたプロジェクトファイルの式でコードが実行されないようにするため) */
  const MFN = { sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan, abs: Math.abs, sqrt: Math.sqrt,
    pow: Math.pow, min: Math.min, max: Math.max, exp: Math.exp, log: Math.log, floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign };
  const MCONST = { pi: Math.PI, e: Math.E };
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  function parseFormula(src) {
    if (src.length > 200) throw new Error('too long');
    const toks = []; let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (/\s/.test(ch)) { i++; continue; }
      let m = /^(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)/.exec(src.slice(i));
      if (m) { toks.push({ n: parseFloat(m[1]) }); i += m[1].length; continue; }
      m = /^[A-Za-z_]\w*/.exec(src.slice(i));
      if (m) { toks.push({ id: m[0].toLowerCase() }); i += m[0].length; continue; }
      if ('+-*/^%(),'.includes(ch)) { toks.push({ op: ch }); i++; continue; }
      throw new Error('bad char');
    }
    let p = 0;
    const isOp = o => toks[p] && toks[p].op === o;
    const expr = () => {
      let l = term();
      while (isOp('+') || isOp('-')) { const o = toks[p++].op, r = term(), a = l; l = o === '+' ? u => a(u) + r(u) : u => a(u) - r(u); }
      return l;
    };
    const term = () => {
      let l = unary();
      while (isOp('*') || isOp('/') || isOp('%')) {
        const o = toks[p++].op, r = unary(), a = l;
        l = o === '*' ? u => a(u) * r(u) : o === '/' ? u => a(u) / r(u) : u => a(u) % r(u);
      }
      return l;
    };
    const unary = () => {
      if (isOp('-')) { p++; const a = unary(); return u => -a(u); }
      if (isOp('+')) { p++; return unary(); }
      const b = atom();
      if (isOp('^')) { p++; const e = unary(); return u => Math.pow(b(u), e(u)); }
      return b;
    };
    const atom = () => {
      const t = toks[p++];
      if (!t) throw new Error('unexpected end');
      if (t.n !== undefined) return () => t.n;
      if (t.op === '(') { const e = expr(); if (!isOp(')')) throw new Error('missing )'); p++; return e; }
      if (t.id) {
        if (isOp('(')) {
          p++; const args = [];
          if (!isOp(')')) { do { args.push(expr()); } while (isOp(',') && ++p); }
          if (!isOp(')')) throw new Error('missing )');
          p++;
          if (!own(MFN, t.id)) throw new Error('unknown function');
          const fn = MFN[t.id];
          if (!args.length || args.length < fn.length) throw new Error('too few arguments');
          return u => fn(...args.map(a => a(u)));
        }
        if (t.id === 'u' || t.id === 't' || t.id === 'x') return u => u;
        if (own(MCONST, t.id)) return () => MCONST[t.id];
      }
      throw new Error('bad token');
    };
    const node = expr();
    if (p !== toks.length) throw new Error('trailing');
    return u => { const v = node(u); return Number.isFinite(v) ? v : 0; };
  }
  const fcache = new Map();
  function compileFormula(src) {                       // 解釈できない式は null
    if (!fcache.has(src)) { let fn = null; try { fn = parseFormula(String(src)); } catch (e) { fn = null; } fcache.set(src, fn); }
    return fcache.get(src);
  }
  const easeOf = q => { const e = q.e || 'sine'; return e === 'formula' ? (compileFormula(q.f || 'u') || FH.EASE.linear) : (FH.EASE[e] || FH.EASE.linear); };

  /* ---------- 最終的な動き(イージングの展開 + 速度制限) ---------- */
  function compute() {
    const f = F(), st = f.settings, ks = [], out = [];
    [...f.keys].sort((a, b) => a.t - b.t).forEach(k => {
      const item = { at: Math.max(0, Math.round(k.t * 1000)), pos: FH.clamp(k.pos, 0, 100), k }, last = ks[ks.length - 1];
      if (last && last.at === item.at) ks[ks.length - 1] = item; else ks.push(item);     // 同じミリ秒は後のものを採用
    });
    if (!ks.length || ks[0].at > 0) ks.unshift({ at: 0, pos: st.restTop === false ? st.lo : st.hi, k: null });   // 0ミリ秒は平時の位置から始める
    ks.forEach((a, i) => {
      out.push({ at: a.at, pos: a.pos });
      const b = ks[i + 1];
      const en = a.k && (a.k.e || 'sine');                                                // 既定のイージングはサイン
      if (!b || !a.k || en === 'linear') return;                            // 次の区間がリニアなら補間は再生側に任せる
      const dt = b.at - a.at; if (dt < 2) return;
      if (en === 'hold') { out.push({ at: b.at - 1, pos: a.pos }); return; }          // ステップ: 次のキーフレーム直前まで保持
      const fn = easeOf(a.k), n = FH.clamp(Math.round(dt / 40), 2, 60);                  // 曲線は約40msごとの点に展開
      for (let j = 1; j < n; j++) { const u = j / n; out.push({ at: a.at + Math.round(dt * u), pos: FH.clamp(a.pos + (b.pos - a.pos) * fn(u), 0, 100) }); }
    });
    if (st.limitOn && st.maxSpeed > 0) {
      for (let i = 1; i < out.length; i++) {
        const maxD = st.maxSpeed * (out[i].at - out[i - 1].at) / 1000, d = out[i].pos - out[i - 1].pos;
        if (Math.abs(d) > maxD) out[i].pos = out[i - 1].pos + Math.sign(d) * maxD;
      }
    }
    return out;
  }
  function build(endT) {
    const acts = compute().filter(a => endT == null || a.at <= endT * 1000 + 1)
      .map(a => ({ at: a.at, pos: Math.max(0, Math.min(100, Math.round(a.pos))) }));
    return { version: '1.0', inverted: false, range: 100, actions: acts };
  }
  let effCache = null;                                 // 表示用の計算結果(譜面・キーフレームが変わったら破棄)
  const getEff = () => effCache || (effCache = compute());
  function valueAt(tMs) {                              // 時刻tMs(ミリ秒)でのデバイス位置(%)
    const e = getEff();
    if (tMs <= e[0].at) return e[0].pos;
    const last = e[e.length - 1]; if (tMs >= last.at) return last.pos;
    let lo = 0, hi = e.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (e[m].at <= tMs) lo = m; else hi = m; }
    return e[lo].pos + (e[hi].pos - e[lo].pos) * (tMs - e[lo].at) / (e[hi].at - e[lo].at);
  }
  FH.fun = { sync, compute, build, valueAt, compileFormula, easeOf };

  /* ---------- デバイスの動作プレビュー(右側): 現在位置のデバイスの動きを縦のストロークで表示 ---------- */
  function drawDevice() {
    if (!dw || !F()) return;
    const t = FH.state.time * 1000, v = valueAt(t), speed = (valueAt(t + 40) - valueAt(t - 40)) / 0.08;
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0); dctx.clearRect(0, 0, dw, dh);
    const top = 18, bot = dh - 18, tx = 40, tw = 16, y = pv => bot - pv / 100 * (bot - top);
    dctx.font = '10px ' + FONT; dctx.textAlign = 'right'; dctx.textBaseline = 'middle'; dctx.fillStyle = C.sub;
    [0, 50, 100].forEach(pv => dctx.fillText(String(pv), tx - tw / 2 - 5, y(pv)));
    dctx.fillStyle = C.edge; dctx.beginPath();                                          // 可動範囲
    if (dctx.roundRect) dctx.roundRect(tx - tw / 2, top - 6, tw, bot - top + 12, 8); else dctx.rect(tx - tw / 2, top - 6, tw, bot - top + 12);
    dctx.fill();
    dctx.fillStyle = C.green; dctx.globalAlpha = .35; dctx.fillRect(tx - 3, y(v), 6, bot - y(v)); dctx.globalAlpha = 1;   // 軸
    for (let i = 14; i >= 1; i--) {                                                     // 直近0.7秒の軌跡
      dctx.globalAlpha = .35 * (1 - i / 15); dctx.beginPath(); dctx.arc(tx, y(valueAt(t - i * 50)), 3, 0, Math.PI * 2); dctx.fillStyle = C.green; dctx.fill();
    }
    dctx.globalAlpha = 1; dctx.fillStyle = C.green; dctx.beginPath();                   // 可動部
    if (dctx.roundRect) dctx.roundRect(tx - 17, y(v) - 7, 34, 14, 5); else dctx.rect(tx - 17, y(v) - 7, 34, 14);
    dctx.fill(); dctx.strokeStyle = C.bg; dctx.lineWidth = 1.5; dctx.stroke();
    dctx.textAlign = 'left'; dctx.fillStyle = C.text; dctx.font = 'bold 16px ' + FONT; dctx.fillText(Math.round(v) + '%', tx + 28, dh / 2 - 8);
    dctx.fillStyle = C.sub; dctx.font = '11px ' + FONT; dctx.fillText(Math.round(Math.abs(speed)) + '%/秒', tx + 28, dh / 2 + 10);
  }

  /* ---------- 描画 ---------- */
  function draw() {
    queued = false;
    const f = F();
    if (!W || !f) return;
    const s = FH.state, P = s.project, T = FH.time, k = pps();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    const xs = xOf(0), xe = xOf(FH.duration());
    if (xs > 0) ctx.fillRect(0, 0, Math.min(xs, W), H);
    if (xe < W) ctx.fillRect(Math.max(xe, 0), 0, W - Math.max(xe, 0), H);

    const t0 = Math.max(0, tOf(0)), t1 = tOf(W);
    if (k * 60 / T.bpmAt(t0) >= 8) {                                         // 拍の縦線
      ctx.strokeStyle = C.edge; ctx.globalAlpha = .55; ctx.lineWidth = 1;
      T.gridTimes(t0, t1, 4).forEach(g => { const x = Math.round(xOf(g.time)) + .5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); });
      ctx.globalAlpha = 1;
    }
    ctx.font = '10px ' + FONT; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left';
    [0, 25, 50, 75, 100].forEach(v => {                                      // 位置の横線
      const y = Math.round(yOf(v)) + .5;
      ctx.strokeStyle = C.edge; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillStyle = C.sub; ctx.fillText(String(v), 4, y - 1);
    });
    ctx.fillStyle = C.sub; ctx.strokeStyle = C.sub;                          // ノーツの位置(上端の目印)
    P.chart.notes.forEach(n => {
      const x1 = xOf(n.type === 'long' ? n.start.time : n.time);
      if (n.type === 'long') { const x2 = xOf(n.end.time); if (x2 < 0 || x1 > W) return; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x1, 5); ctx.lineTo(x2, 5); ctx.stroke(); }
      else { if (x1 < -4 || x1 > W + 4) return; ctx.beginPath(); ctx.arc(x1, 5, 2.5, 0, Math.PI * 2); ctx.fill(); }
    });

    const raw = [...f.keys].sort((a, b) => a.t - b.t), eff = getEff();
    if (f.settings.limitOn && raw.length > 1) {                              // 速度制限前の線(破線)
      ctx.setLineDash([4, 3]); ctx.strokeStyle = C.sub; ctx.lineWidth = 1; ctx.beginPath();
      raw.forEach((q, i) => { const x = xOf(q.t), y = yOf(q.pos); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = C.green; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.beginPath();   // 出力される動き
    eff.forEach((a, i) => { const x = xOf(a.at / 1000), y = yOf(a.pos); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.stroke();
    f.keys.forEach(q => {                                                    // キーフレーム: 自動=中が空 / 手動=塗りつぶし
      const x = xOf(q.t); if (x < -10 || x > W + 10) return;
      const y = yOf(q.pos);
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = q.n && !q.lt && !q.lp ? C.bg : C.text; ctx.fill(); ctx.strokeStyle = C.green; ctx.lineWidth = 2; ctx.stroke();
      if (s.selection.has(q.id)) { ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.strokeStyle = C.hl; ctx.lineWidth = 2.5; ctx.stroke(); }
    });
    if (mq && mq.moved) {                                                    // 範囲選択の枠
      const r = mqRect();
      ctx.save(); ctx.globalAlpha = .15; ctx.fillStyle = C.green; ctx.fillRect(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
      ctx.globalAlpha = 1; ctx.strokeStyle = C.green; ctx.lineWidth = 1; ctx.strokeRect(r.x1 + .5, r.y1 + .5, r.x2 - r.x1, r.y2 - r.y1);
      ctx.restore();
    }
    const px = xOf(s.time);                                                  // 再生位置線
    if (px > -10 && px < W + 10) { ctx.strokeStyle = C.red; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke(); }
    drawDevice();
  }
  new ResizeObserver(() => {
    dpr = window.devicePixelRatio || 1; W = body.clientWidth; H = body.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); invalidate();
  }).observe(body);
  new ResizeObserver(() => {
    dpr = window.devicePixelRatio || 1; dw = devBox.clientWidth; dh = devBox.clientHeight;
    dcv.width = Math.round(dw * dpr); dcv.height = Math.round(dh * dpr); invalidate();
  }).observe(devBox);

  /* ---------- 操作 ---------- */
  const lx = e => e.clientX - cv.getBoundingClientRect().left, ly = e => e.clientY - cv.getBoundingClientRect().top;
  const snapT = (t, free) => Math.max(0, free ? t : FH.time.snap(t));                    // 時間は譜面グリッドにスナップ
  const snapV = (v, free) => { const st = F().settings.posSnap || 1; return FH.clamp(free ? Math.round(v * 10) / 10 : Math.round(v / st) * st, 0, 100); };
  const hit = (x, y) => {
    let best = null, bd = HIT;
    F().keys.forEach(q => { const d = Math.hypot(x - xOf(q.t), y - yOf(q.pos)); if (d <= bd) { bd = d; best = q; } });
    return best;
  };
  const mqRect = () => ({ x1: Math.min(xOf(mq.t0), mq.x), x2: Math.max(xOf(mq.t0), mq.x), y1: Math.min(yOf(mq.v0), mq.y), y2: Math.max(yOf(mq.v0), mq.y) });
  function applyMq() {                                                       // 始点は(時間, 位置)で持つので、スクロールしても追従してずれる
    const r = mqRect();
    const ids = F().keys.filter(q => { const x = xOf(q.t), y = yOf(q.pos); return x >= r.x1 - 5 && x <= r.x2 + 5 && y >= r.y1 - 5 && y <= r.y2 + 5; }).map(q => q.id);
    const key = ids.join(','); if (key === mq.key) return;
    mq.key = key; select([...mq.base, ...ids]);
  }
  const mqLoop = ts => {
    if (!mq) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    const dir = mq.x < 0 ? -1 : mq.x > W ? 1 : 0;
    if (dir) FH.view.start = FH.clamp(FH.view.start + dir * 240 * dt / pps(), -W * 0.5 / pps(), FH.duration());
    if (mq.moved) applyMq();
    invalidate(); requestAnimationFrame(mqLoop);
  };
  function dragTo(x, y, free) {
    const d = drag;
    if (!d.moved && Math.hypot(x - d.x0, y - d.y0) < 3) return;
    d.moved = true;
    const prim = d.orig.get(d.id), keys = F().keys.filter(q => d.orig.has(q.id));
    let dt = snapT(prim.t + (tOf(x) - d.t0), free) - prim.t, dv = snapV(prim.pos + (vOf(y) - d.v0), free) - prim.pos;
    let loT = -Infinity, loV = -Infinity, hiV = Infinity;
    keys.forEach(q => { const o = d.orig.get(q.id); loT = Math.max(loT, -o.t); loV = Math.max(loV, -o.pos); hiV = Math.min(hiV, 100 - o.pos); });
    dt = Math.max(dt, loT); dv = Math.min(Math.max(dv, loV), hiV);
    keys.forEach(q => {
      const o = d.orig.get(q.id); q.t = r3(o.t + dt); q.pos = r3(o.pos + dv);
      if (q.n) { if (dt) q.lt = true; if (dv) q.lp = true; }                 // 手動で動かした項目は固定
    });
    FH.emit('chart');
  }
  cv.addEventListener('pointerdown', e => {
    const x = lx(e), y = ly(e), s = FH.state, h = hit(x, y), multi = e.shiftKey || e.ctrlKey || e.metaKey;
    cv.setPointerCapture(e.pointerId);
    if (!h) {
      mq = { t0: tOf(x), v0: vOf(y), sx: x, sy: y, x, y, multi, base: multi ? new Set(s.selection) : new Set(), moved: false, key: null };
      lastTs = performance.now(); requestAnimationFrame(mqLoop); return;
    }
    const sel = new Set(s.selection), collapse = !multi && sel.has(h.id) && sel.size > 1;
    if (collapse) FH.state.multiHint = { ids: [...sel], at: performance.now() };
    if (multi) { sel.has(h.id) ? sel.delete(h.id) : sel.add(h.id); select(sel); if (!sel.has(h.id)) return; }
    else if (!sel.has(h.id)) select([h.id]);
    const orig = new Map();
    F().keys.forEach(q => { if (FH.state.selection.has(q.id)) orig.set(q.id, { t: q.t, pos: q.pos }); });
    drag = { id: h.id, orig, t0: tOf(x), v0: vOf(y), x0: x, y0: y, moved: false, collapse };
  });
  cv.addEventListener('pointermove', e => {
    const x = lx(e), y = ly(e);
    if (mq) { mq.x = x; mq.y = y; if (!mq.moved && Math.hypot(x - mq.sx, y - mq.sy) >= 3) mq.moved = true; if (mq.moved) applyMq(); return; }
    if (drag) { dragTo(x, y, e.altKey); return; }
    cv.style.cursor = hit(x, y) ? 'grab' : 'crosshair';
  });
  const endPointer = () => {
    if (mq) { if (!mq.moved && !mq.multi) select([]); mq = null; invalidate(); }
    if (!drag) return;
    if (drag.moved) commit('キーフレーム移動'); else if (drag.collapse) select([drag.id]);
    drag = null;
  };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('dblclick', e => {
    const x = lx(e), y = ly(e), h = hit(x, y);
    if (h) { FH.openConfig(h.id); return; }          // 既存: 数値編集タブを開く
    const q = { id: FH.uid('k_'), t: r3(snapT(tOf(x), e.altKey)), pos: snapV(vOf(y), e.altKey) };   // 空白: キーフレームを追加
    F().keys.push(q); select([q.id]); commit('キーフレーム追加');
  });
  cv.addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    FH.view.start = FH.clamp(FH.view.start + d / pps(), -W * 0.5 / pps(), FH.duration());
  }, { passive: false });
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || (e.key !== 'Delete' && e.key !== 'Backspace')) return;
    const f = F(), sel = FH.state.selection, mine = f.keys.filter(q => sel.has(q.id)).map(q => q.id);
    if (!mine.length) return;
    f.keys = f.keys.filter(q => !sel.has(q.id));
    select([...sel].filter(id => !mine.includes(id))); commit('キーフレーム削除');
  });
  snapSel.addEventListener('change', () => { F().settings.posSnap = +snapSel.value; commit('設定変更'); snapSel.blur(); });
  document.getElementById('funCfg').addEventListener('click', () => FH.emit('config', { id: 'fun' }));

  /* ---------- 状態との連携 ---------- */
  const refresh = () => { sync(); effCache = null; if (document.activeElement !== snapSel) snapSel.value = String(F().settings.posSnap || 1); invalidate(); };
  ['chart', 'project'].forEach(n => FH.on(n, refresh));
  ['view', 'change:time', 'change:selection', 'change:zoom'].forEach(n => FH.on(n, invalidate));
  FH.on('theme', () => { Object.assign(C, readC()); invalidate(); });
  refresh();
})();

/* ============================================================
   モーショントラッキング → Funscript
   動画の中の、追跡したい部分(ユーザーが矩形で指定)の縦(または横)の動きを追い、Funscriptのキーフレームに変換する
   1. 指定した基準フレームの矩形を見本(テンプレート)にして、後続・前の各コマで一番似ている位置を探す(SADによるテンプレートマッチング)
      ・各コマは縮小(幅320px以内)した白黒画像で比べる。探す範囲は直前の位置の周り。小数画素まで補間して滑らかにする
   2. 位置の時系列を、平滑化 → 上下2%を除いて0〜100%に正規化(縦は上=100%)→ 誤差が許容値以下になるよう間引く(Ramer-Douglas-Peucker)
   3. キーフレームにして Funscript に入れる(既存キーは範囲内を置き換え、または残して追加)
   ・動画のコマは <video> をシークして取り出す(Mediabunny等の外部ライブラリは使わない)
   ============================================================ */
(() => {
  /* ---------- 追跡(テンプレートマッチング) ---------- */
  function makeTracker(w, h, roi, o = {}) {                       // gray: 幅w×高さhの白黒画像(0〜255)
    const tw = FH.clamp(Math.round(roi.w), 4, w), th = FH.clamp(Math.round(roi.h), 4, h);
    let cx = FH.clamp(Math.round(roi.x), 0, w - tw), cy = FH.clamp(Math.round(roi.y), 0, h - th);
    const R = Math.max(4, Math.round(o.search ?? h * 0.15)), stride = tw * th > 2500 ? 2 : 1, alpha = o.update ? 0.08 : 0;
    const total = Math.ceil(th / stride) * Math.ceil(tw / stride);
    let tpl = null, g = null;
    const patch = (gray, x, y) => {
      const out = new Float32Array(tw * th);
      for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) out[j * tw + i] = gray[(y + j) * w + x + i];
      return out;
    };
    const sad = (x, y, limit) => {                                // 見本との差の合計。limitを超えたら打ち切る
      let sum = 0;
      for (let j = 0; j < th; j += stride) {
        const row = (y + j) * w + x, tr = j * tw;
        for (let i = 0; i < tw; i += stride) sum += Math.abs(g[row + i] - tpl[tr + i]);
        if (sum > limit) return Infinity;
      }
      return sum;
    };
    return {
      init(gray) { tpl = patch(gray, cx, cy); },
      step(gray) {
        g = gray;
        let best = Infinity, bx = cx, by = cy;
        for (let dy = -R; dy <= R; dy++) {
          const y = cy + dy; if (y < 0 || y + th > h) continue;
          for (let dx = -R; dx <= R; dx++) {
            const x = cx + dx; if (x < 0 || x + tw > w) continue;
            const pen = 0.02 * (Math.abs(dx) + Math.abs(dy));      // 似ている候補が並ぶときは、動きの小さい方を選ぶ
            const v = sad(x, y, (best - pen) * total) / total + pen;
            if (v < best) { best = v; bx = x; by = y; }
          }
        }
        const val = (x, y) => (x < 0 || y < 0 || x + tw > w || y + th > h) ? null : sad(x, y, Infinity) / total;
        const s0 = val(bx, by);
        const vertex = (a, b) => { if (a === null || b === null) return 0; const d = 2 * (a - 2 * s0 + b); return d > 1e-9 ? (a - b) / d : 0; };
        let fx = bx, fy = by; const ry = vertex(val(bx, by - 1), val(bx, by + 1)), rx = vertex(val(bx - 1, by), val(bx + 1, by));
        if (Math.abs(ry) <= 0.5) fy += ry;                          // 小数画素まで補間
        if (Math.abs(rx) <= 0.5) fx += rx;
        cx = bx; cy = by;
        if (alpha) { const q = patch(gray, cx, cy); for (let k = 0; k < tpl.length; k++) tpl[k] += alpha * (q[k] - tpl[k]); }   // 見た目の変化にゆっくり追従
        return { x: fx + tw / 2, y: fy + th / 2, score: best };
      }
    };
  }

  // a: { getFrame(t)→{w,h,gray}, tBase, tMin, tMax, fps, roi, update, search, onProgress, isCancelled }  → 時刻順の {t,x,y,score}
  async function analyze(a) {
    const dt = 1 / a.fps, out = [], f0 = await a.getFrame(a.tBase);
    const nF = Math.floor((a.tMax - a.tBase) * a.fps + 1e-6), nB = Math.floor((a.tBase - a.tMin) * a.fps + 1e-6), total = Math.max(1, nF + nB);
    let done = 0;
    out.push({ t: a.tBase, x: a.roi.x + a.roi.w / 2, y: a.roi.y + a.roi.h / 2, score: 0 });
    for (const dir of [1, -1]) {                                   // 基準フレームから、後ろ向きと前向きの両方へ追う
      const n = dir > 0 ? nF : nB; if (n <= 0) continue;
      const tr = makeTracker(f0.w, f0.h, a.roi, { update: a.update, search: a.search });
      tr.init(f0.gray);
      for (let k = 1; k <= n; k++) {
        if (a.isCancelled && a.isCancelled()) return null;
        const t = a.tBase + dir * k * dt, f = await a.getFrame(t), r = tr.step(f.gray);
        out.push({ t, x: r.x, y: r.y, score: r.score }); done++;
        if (a.onProgress) a.onProgress(done / total, t, r);
      }
    }
    return out.sort((p, q) => p.t - q.t);
  }

  /* ---------- 位置(0〜100%)への変換と間引き ---------- */
  function toSeries(samples, o) {                                  // o: {axis:'y'|'x', invert, smooth}
    const n = samples.length; if (!n) return [];
    const raw = samples.map(q => o.axis === 'x' ? q.x : q.y), half = ((Math.max(1, Math.round(o.smooth || 1)) | 1) - 1) >> 1;
    const sm = raw.map((_, i) => { let sum = 0, c = 0; for (let j = Math.max(0, i - half); j <= Math.min(n - 1, i + half); j++) { sum += raw[j]; c++; } return sum / c; });
    const sorted = [...sm].sort((p, q) => p - q), pct = f => sorted[Math.min(n - 1, Math.max(0, Math.round(f * (n - 1))))];
    const lo = pct(0.02), hi = pct(0.98), span = hi - lo;           // 外れ値の影響を避けるため、上下2%を除く
    return samples.map((q, i) => {
      const nv = span > 1e-6 ? FH.clamp((sm[i] - lo) / span, 0, 1) : 0.5, up = o.axis === 'x' ? nv : 1 - nv;   // 縦は上(yが小さい)=100%
      return { t: q.t, pos: 100 * (o.invert ? 1 - up : up) };
    });
  }
  function simplify(pts, eps) {                                    // 元の形からの縦のずれが eps(%)以下になるよう、キーフレームを減らす
    if (pts.length < 3 || eps <= 0) return pts.slice();
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [a, b] = stack.pop(); let md = 0, mi = -1;
      for (let i = a + 1; i < b; i++) {
        const u = (pts[i].t - pts[a].t) / ((pts[b].t - pts[a].t) || 1), d = Math.abs(pts[i].pos - (pts[a].pos + (pts[b].pos - pts[a].pos) * u));
        if (d > md) { md = d; mi = i; }
      }
      if (mi > 0 && md > eps) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
    }
    return pts.filter((_, i) => keep[i]);
  }
  const r3 = v => Math.round(v * 1000) / 1000;
  const keysFor = (item, pts) => pts.map(q => ({                   // メディア内の時刻 → プロジェクトの時刻。ノーツには連動しない手動キー(直線補間)
    id: FH.uid('k_'), t: Math.max(0, r3(item.start + (q.t - item.trimIn))), pos: Math.round(q.pos * 10) / 10, e: 'linear' }));
  function merge(f, keys, mode) {                                  // mode: 'replace'(キーの範囲内の既存キーを消す) | 'add'
    if (!keys.length) return;
    const t0 = Math.min(...keys.map(k => k.t)), t1 = Math.max(...keys.map(k => k.t));
    if (mode === 'replace') f.keys = f.keys.filter(k => k.t < t0 - 1e-6 || k.t > t1 + 1e-6);
    f.keys.push(...keys);
  }

  /* ---------- ダイアログ ---------- */
  const dlg = document.createElement('dialog');
  dlg.id = 'trackDlg'; dlg.setAttribute('aria-labelledby', 'trTitle');
  dlg.innerHTML = `
    <h2 id="trTitle">モーショントラッキング → Funscript</h2>
    <div class="cfg-empty" id="trItem"></div>
    <div class="cfg-empty">追跡したい部分(動いて見える対象)を、下の映像の上でドラッグして囲んでください。その縦(または横)の動きが、Funscriptの位置(0〜100%)になります。</div>
    <canvas id="trCv" width="560" height="315" style="width:100%;max-width:560px;background:#000;cursor:crosshair;margin:6px 0"></canvas>
    <div class="cfg-row"><label for="trBase">基準フレーム</label><input type="range" id="trBase" min="0" max="1" step="0.01" value="0" style="flex:1"><span id="trBaseT"></span></div>
    <div class="cfg-row"><label for="trFps">解析のコマ数</label><select id="trFps" class="u-sel"><option value="5">5</option><option value="10">10</option><option value="15" selected>15</option><option value="30">30</option></select><span class="cfg-empty">コマ/秒(多いほど細かく、時間がかかります)</span></div>
    <div class="cfg-row"><label for="trAxis">追跡する動き</label><select id="trAxis" class="u-sel"><option value="y">縦(上=100%)</option><option value="x">横(右=100%)</option></select>
      <label class="cfg-check" style="width:auto"><input type="checkbox" id="trInv"> 反転</label><label class="cfg-check" style="width:auto"><input type="checkbox" id="trUpd" checked> 見た目の変化に追従</label></div>
    <div class="cfg-row"><label for="trSmooth">なめらかさ</label><input type="range" id="trSmooth" min="1" max="9" step="2" value="3" style="width:160px"><span id="trSmoothV"></span></div>
    <div class="cfg-row"><label for="trEps">キーフレームの間引き</label><input type="range" id="trEps" min="0" max="10" step="0.5" value="2" style="width:160px"><span id="trEpsV"></span></div>
    <div class="cfg-row"><label for="trMode">既存のキー</label><select id="trMode" class="u-sel"><option value="replace">範囲内を置き換える</option><option value="add">残して追加する</option></select></div>
    <canvas id="trGraph" width="560" height="96" style="width:100%;max-width:560px;background:var(--bg);border:1px solid var(--edge);border-radius:4px"></canvas>
    <progress id="trProg" max="1" value="0" hidden></progress>
    <div id="trMsg" class="cfg-empty" role="status"></div>
    <div class="ex-btns"><button class="ex-btn" id="trGo">解析開始</button><button class="ex-btn" id="trApply" disabled>Funscriptに反映</button><button class="ex-btn" id="trClose">閉じる</button></div>`;
  document.body.append(dlg);
  const $ = id => dlg.querySelector('#' + id);
  const cv = $('trCv'), cx = cv.getContext('2d'), gv = $('trGraph'), gx = gv.getContext('2d');
  const baseEl = $('trBase'), baseT = $('trBaseT'), fpsEl = $('trFps'), axisEl = $('trAxis'), invEl = $('trInv'), updEl = $('trUpd');
  const smoothEl = $('trSmooth'), smoothV = $('trSmoothV'), epsEl = $('trEps'), epsV = $('trEpsV'), modeEl = $('trMode');
  const prog = $('trProg'), msg = $('trMsg'), goBtn = $('trGo'), applyBtn = $('trApply'), closeBtn = $('trClose');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let st = null;                                                   // 作業中の状態 {item, video, roi(映像表示上の座標), samples, pts, busy, cancelled}
  const blocker = e => e.stopImmediatePropagation();               // 解析中は他のキー操作を止める
  const setMsg = t => { msg.textContent = t; };

  const seek = (v, t) => new Promise(res => {
    if (Math.abs(v.currentTime - t) < 1e-3) { setTimeout(res, 0); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; v.removeEventListener('seeked', fin); res(); };
    v.addEventListener('seeked', fin); v.currentTime = t; setTimeout(fin, 4000);   // シークが返ってこなくても止まらないようにする
  });
  function draw(box) {                                              // 映像(現在のコマ)と、指定した矩形・追跡中の矩形
    const v = st.video; if (!v || !v.videoWidth) return;
    cv.height = Math.round(cv.width * v.videoHeight / v.videoWidth);
    cx.drawImage(v, 0, 0, cv.width, cv.height);
    const r = box || st.roi;
    if (r) { cx.strokeStyle = css('--hl') || '#ffd54a'; cx.lineWidth = 2; cx.strokeRect(r.x, r.y, r.w, r.h); }
  }
  async function showFrame(t) { await seek(st.video, t); baseT.textContent = FH.time.format(t - st.item.trimIn) + '(アイテム内)'; draw(); }

  function refresh() {                                              // 解析結果 → 位置の変換設定を反映してグラフを描く(再解析は不要)
    smoothV.textContent = smoothEl.value + 'コマ'; epsV.textContent = epsEl.value + '%';
    if (!st || !st.samples) return;
    const series = toSeries(st.samples, { axis: axisEl.value, invert: invEl.checked, smooth: +smoothEl.value });
    st.pts = simplify(series, +epsEl.value);
    const W = gv.width, H = gv.height, t0 = st.item.trimIn, t1 = st.item.trimIn + st.item.duration;
    const X = t => 4 + (t - t0) / ((t1 - t0) || 1) * (W - 8), Y = v => H - 6 - v / 100 * (H - 12);
    gx.clearRect(0, 0, W, H); gx.lineWidth = 1; gx.strokeStyle = css('--edge');
    [0, 50, 100].forEach(v => { gx.beginPath(); gx.moveTo(0, Y(v)); gx.lineTo(W, Y(v)); gx.stroke(); });
    gx.strokeStyle = css('--sub'); gx.beginPath(); series.forEach((q, i) => { if (i) gx.lineTo(X(q.t), Y(q.pos)); else gx.moveTo(X(q.t), Y(q.pos)); }); gx.stroke();   // 追跡した動き
    gx.strokeStyle = css('--green'); gx.lineWidth = 2; gx.beginPath(); st.pts.forEach((q, i) => { if (i) gx.lineTo(X(q.t), Y(q.pos)); else gx.moveTo(X(q.t), Y(q.pos)); }); gx.stroke();   // 出力されるキーフレーム
    st.pts.forEach(q => { gx.beginPath(); gx.arc(X(q.t), Y(q.pos), 3, 0, Math.PI * 2); gx.fillStyle = css('--green'); gx.fill(); });
    setMsg(`解析できました: キーフレーム${st.pts.length}個(元のコマ${series.length}個)。設定を変えるとグラフが更新されます。`);
    applyBtn.disabled = !st.pts.length;
  }
  ['input', 'change'].forEach(n => [smoothEl, epsEl, axisEl, invEl].forEach(e => e.addEventListener(n, refresh)));
  baseEl.addEventListener('input', () => { if (st && !st.busy) showFrame(+baseEl.value); });

  // 矩形の指定(映像の上でドラッグ)
  let drag = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / (r.width || cv.width), y: (e.clientY - r.top) * cv.height / (r.height || cv.height) }; };
  cv.addEventListener('pointerdown', e => { if (!st || st.busy) return; cv.setPointerCapture(e.pointerId); drag = pos(e); st.roi = null; });
  cv.addEventListener('pointermove', e => {
    if (!drag || !st) return;
    const q = pos(e); st.roi = { x: Math.min(drag.x, q.x), y: Math.min(drag.y, q.y), w: Math.abs(q.x - drag.x), h: Math.abs(q.y - drag.y) }; draw();
  });
  cv.addEventListener('pointerup', () => { drag = null; });

  async function run() {
    if (!st || st.busy) return;
    if (!st.roi || st.roi.w < 6 || st.roi.h < 6) { setMsg('追跡したい部分を、映像の上でドラッグして囲んでください。'); return; }
    const v = st.video, item = st.item;
    st.busy = true; st.cancelled = false; st.samples = null; st.pts = null;
    goBtn.disabled = true; applyBtn.disabled = true; baseEl.disabled = true; closeBtn.textContent = 'キャンセル';
    prog.hidden = false; prog.value = 0; window.addEventListener('keydown', blocker, true);
    const aw = Math.min(320, v.videoWidth), ah = Math.max(8, Math.round(aw * v.videoHeight / v.videoWidth)), k = aw / cv.width;
    const ac = document.createElement('canvas'); ac.width = aw; ac.height = ah;
    const ax = ac.getContext('2d', { willReadFrequently: true });
    const roi = { x: st.roi.x * k, y: st.roi.y * k, w: st.roi.w * k, h: st.roi.h * k };
    const getFrame = async t => {
      await seek(v, t); ax.drawImage(v, 0, 0, aw, ah);
      const d = ax.getImageData(0, 0, aw, ah).data, g = new Uint8ClampedArray(aw * ah);
      for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
      return { w: aw, h: ah, gray: g };
    };
    let n = 0, res = null;
    try {
      res = await analyze({ getFrame, tBase: +baseEl.value, tMin: item.trimIn, tMax: item.trimIn + item.duration, fps: +fpsEl.value, roi, update: updEl.checked,
        isCancelled: () => st.cancelled,
        onProgress: (p, t, r) => { prog.value = p; setMsg(`解析中… ${Math.round(p * 100)}%`); if (++n % 4 === 0) draw({ x: (r.x - roi.w / 2) / k, y: (r.y - roi.h / 2) / k, w: roi.w / k, h: roi.h / k }); } });
    } catch (err) { console.error(err); setMsg('解析に失敗しました: ' + ((err && err.message) || err)); }
    window.removeEventListener('keydown', blocker, true);
    st.busy = false; prog.hidden = true; goBtn.disabled = false; baseEl.disabled = false; closeBtn.textContent = '閉じる';
    if (res) { st.samples = res; refresh(); } else if (st.cancelled) setMsg('キャンセルしました。');
    await showFrame(+baseEl.value);
  }
  function apply() {
    if (!st || !st.pts || !st.pts.length) return;
    const keys = keysFor(st.item, st.pts), f = FH.state.project.funscript;
    merge(f, keys, modeEl.value);
    FH.set('selection', new Set(keys.map(q => q.id)));
    FH.set('dirty', true); FH.emit('chart'); FH.emit('commit', 'モーショントラッキングからFunscript生成');
    FH.toast(`トラッキングから、Funscriptのキーフレームを${keys.length}個作りました`);
    close();
  }
  function close() {
    if (st && st.video) { try { st.video.removeAttribute('src'); st.video.load(); } catch (e) { /* ignore */ } }
    st = null; if (dlg.open) dlg.close();
  }
  async function open(item) {
    if (!item || item.type !== 'video') { FH.toast('動画のアイテムを選んでください'); return; }
    FH.pause();
    const v = document.createElement('video'); v.muted = true; v.preload = 'auto';
    st = { item, video: v, roi: null, samples: null, pts: null, busy: false, cancelled: false };
    $('trItem').textContent = `対象: ${item.name}(キーフレームの時刻は、このアイテムの配置に合わせて変換されます)`;
    baseEl.min = item.trimIn; baseEl.max = item.trimIn + item.duration; baseEl.value = item.trimIn; baseEl.disabled = false;
    applyBtn.disabled = true; goBtn.disabled = false; prog.hidden = true; closeBtn.textContent = '閉じる'; gx.clearRect(0, 0, gv.width, gv.height);
    smoothV.textContent = smoothEl.value + 'コマ'; epsV.textContent = epsEl.value + '%'; setMsg('動画を読み込んでいます…');
    dlg.showModal();
    try {
      await new Promise((res, rej) => { v.addEventListener('loadedmetadata', res); v.addEventListener('error', () => rej(new Error('動画を読み込めません')));
        v.src = FH.mediaURL(item.mediaId); });
      await showFrame(item.trimIn); setMsg('追跡したい部分を、映像の上でドラッグして囲み、「解析開始」を押してください。');
    } catch (err) { setMsg((err && err.message) || String(err)); }
  }
  goBtn.addEventListener('click', run);
  applyBtn.addEventListener('click', apply);
  closeBtn.addEventListener('click', () => { if (st && st.busy) st.cancelled = true; else close(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); if (st && st.busy) st.cancelled = true; else close(); });   // Esc

  FH.track = { makeTracker, analyze, toSeries, simplify, keysFor, merge, open };
})();

/* ============================================================
   ファイル操作(ステップ8)
   ・取り消す/やり直す: 各編集の完了時に出る FH.emit('commit') ごとにプロジェクトのスナップショットを保存(最大200件)
   ・カット/コピー/ペースト: 選択中の譜面アイテム・メディアアイテムを内部クリップボードへ。貼り付けは再生位置が基準
   ・新規/開く/保存: ZIP形式(拡張子 .fhp)。project.json + media/<メディアID> に、使用中のメディアをすべて埋め込む
   ・ショートカット: Ctrl(⌘)+ Z / Shift+Z / Y / X / C / V / S
   ============================================================ */
(() => {
  const S = () => FH.state, P = () => FH.state.project, clone = o => JSON.parse(JSON.stringify(o));
  const select = ids => FH.set('selection', new Set(ids));
  const commit = l => { FH.set('dirty', true); FH.emit('chart'); FH.emit('commit', l); };
  const toastEl = document.getElementById('toast'); let tt;
  const toast = FH.toast = msg => {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { toastEl.hidden = true; }, 2800);
  };
  const nameIn = document.getElementById('projName'), fpsSel = document.getElementById('fpsSel');
  const title = () => { document.title = `${S().dirty ? '● ' : ''}${P().meta.name} - FapHero Editor`; };
  const syncName = () => { if (document.activeElement !== nameIn) nameIn.value = P().meta.name; fpsSel.value = P().meta.fps || 30; title(); };
  fpsSel.addEventListener('change', () => { P().meta.fps = +fpsSel.value; commit('フレームレート変更'); fpsSel.blur(); });
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') nameIn.blur(); });
  nameIn.addEventListener('change', () => {
    P().meta.name = nameIn.value.trim() || '無題'; nameIn.value = P().meta.name; commit('名前変更');
  });
  FH.on('change:dirty', title);
  window.addEventListener('beforeunload', e => { if (S().dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- 取り消す / やり直す ---------- */
  const H = { stack: [], idx: 0 };
  const snap = () => JSON.stringify(P());
  const canUndo = () => H.idx > 0, canRedo = () => H.idx < H.stack.length - 1;
  const buttons = () => {
    document.querySelectorAll('[data-act="undo"]').forEach(b => { b.disabled = !canUndo(); });
    document.querySelectorAll('[data-act="redo"]').forEach(b => { b.disabled = !canRedo(); });
  };
  const resetHistory = () => { H.stack = [snap()]; H.idx = 0; buttons(); };
  FH.on('commit', () => {
    const j = snap(); if (j === H.stack[H.idx]) return;
    H.stack.length = H.idx + 1; H.stack.push(j);
    if (H.stack.length > 200) H.stack.shift();
    H.idx = H.stack.length - 1; buttons();
  });
  function restore() {
    const p = JSON.parse(H.stack[H.idx]), c = p.chart;
    const ids = new Set([...c.notes, ...c.events, ...c.bpmEvents, ...c.timeSigEvents, ...p.items].map(o => o.id));
    FH.state.project = p;
    select([...S().selection].filter(id => ids.has(id)));
    FH.set('dirty', true); FH.setTime(S().time); FH.emit('chart'); syncName(); buttons();
  }
  const undo = () => { if (canUndo()) { H.idx--; restore(); } };
  const redo = () => { if (canRedo()) { H.idx++; restore(); } };

  /* ---------- カット / コピー / ペースト ---------- */
  let clip = null;
  const overlap = (a, b) => a !== b && a.layer === b.layer && a.start < b.start + b.duration - 1e-6 && b.start < a.start + a.duration - 1e-6;
  function copy(quiet) {
    const p = P(), c = p.chart, sel = S().selection, en = [];
    c.notes.forEach(n => sel.has(n.id) && en.push({ k: n.type, o: clone(n), t: n.type === 'long' ? n.start.time : n.time }));
    c.events.forEach(n => sel.has(n.id) && en.push({ k: 'event', o: clone(n), t: n.time }));
    c.bpmEvents.forEach(n => sel.has(n.id) && n.time > 1e-6 && en.push({ k: 'bpm', o: clone(n), t: n.time }));
    c.timeSigEvents.forEach(n => sel.has(n.id) && n.time > 1e-6 && en.push({ k: 'sig', o: clone(n), t: n.time }));
    p.items.forEach(n => sel.has(n.id) && en.push({ k: 'item', o: clone(n), t: n.start }));
    if (!en.length) return false;
    const base = k => Math.min(...en.filter(e => (e.k === 'item') === (k === 'item')).map(e => e.t));   // 譜面側 / アイテム側それぞれの最初の時刻
    clip = { base: { chart: base('chart'), item: base('item') }, en };
    FH.set('pasting', null);
    if (!quiet) toast(`${en.length}件をコピーしました`);
    return true;
  }
  function removeSelection() {
    const p = P(), c = p.chart, sel = S().selection, prot = o => o.time <= 1e-6;
    c.notes = c.notes.filter(o => !sel.has(o.id));
    c.events = c.events.filter(o => !sel.has(o.id));
    c.bpmEvents = c.bpmEvents.filter(o => !sel.has(o.id) || prot(o));
    c.timeSigEvents = c.timeSigEvents.filter(o => !sel.has(o.id) || prot(o));
    p.items = p.items.filter(o => !sel.has(o.id));
    select([]);
  }
  function cut() { if (copy(true)) { removeSelection(); commit('カット'); toast('カットしました'); } }
  function paste() {                       // 貼り付け待ち: 半透明のプレビューを位置決めし、クリックで配置(Escで終了)
    if (!clip) return;
    FH.set('pasting', clip);
    toast('貼り付ける位置をクリックしてください(Escでキャンセル)');
  }
  FH.pasteAt = (group, time, row = 0) => {   // group: 'chart'(譜面) | 'item'(アイテム)
    const cl = S().pasting;
    if (!cl || !isFinite(cl.base[group])) return;
    const p = P(), c = p.chart, ids = [], dt = time - cl.base[group];
    const pre = { single: 'n_', long: 'n_', event: 'ev_', bpm: 'bpm_', sig: 'ts_', item: 'item_' };
    const mine = cl.en.filter(e => (e.k === 'item') === (group === 'item'));
    const minL = Math.min(...mine.map(e => e.o.layer || 0));
    mine.forEach(e => {
      const o = clone(e.o); o.id = FH.uid(pre[e.k]);
      if (e.k === 'single') { o.time += dt; c.notes.push(o); }
      else if (e.k === 'long') { o.start.time += dt; o.end.time += dt; c.notes.push(o); }
      else if (e.k === 'event') { o.time += dt; c.events.push(o); }
      else if (e.k === 'bpm' || e.k === 'sig') {
        const list = e.k === 'bpm' ? c.bpmEvents : c.timeSigEvents; o.time += dt;
        if (o.time <= 1e-6 || list.some(x => Math.abs(x.time - o.time) < 1e-6)) return;   // 同じ時刻には置けない
        list.push(o);
      } else {
        o.start = Math.max(0, o.start + dt); o.layer = Math.max(0, row + (e.o.layer - minL));
        while (p.items.some(x => overlap(o, x))) o.layer++;                              // 空いている行まで下げる
        p.items.push(o);
      }
      ids.push(o.id);
    });
    if (!ids.length) { toast('この位置には貼り付けられません'); return; }
    const end = Math.max(0, ...ids.map(id => { const n = c.notes.find(x => x.id === id); return n ? (n.time ?? n.end.time) : 0; }));
    if (end > p.meta.duration - 2) p.meta.duration = Math.ceil(end) + 10;
    select(ids); commit('貼り付け');
    FH.set('pasting', null);                 // 1回置いたら貼り付け待ちを解除
  };

  /* ---------- 新規 / 開く / 保存 ---------- */
  const needZip = () => { if (window.JSZip) return true; toast('ZIPライブラリを読み込めませんでした。ネットワーク接続を確認してください'); return false; };
  const confirmDiscard = () => !S().dirty || confirm('保存されていない変更があります。破棄しますか?');

  function newProject() {
    if (!confirmDiscard()) return;
    FH.pause(); FH.blobs.clear(); FH.loadProject(FH.newProject()); FH.set('dirty', false);
    toast('新規プロジェクトを作成しました');
  }

  async function save() {
    if (!needZip()) return;
    const p = P(), used = new Set(p.items.map(i => i.mediaId));
    const out = { ...p, media: Object.fromEntries(Object.entries(p.media).filter(([id]) => used.has(id))) };   // 未使用メディアは含めない
    const zip = new JSZip();
    zip.file('project.json', JSON.stringify(out), { compression: 'DEFLATE' });
    let missing = 0;
    for (const id of used) {
      const b = FH.blobs.get(id);
      if (b) zip.file('media/' + id, b, { compression: 'STORE', binary: true }); else missing++;
    }
    toast('保存中…');
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (p.meta.name || 'project').replace(/[\\/:*?"<>|]/g, '_') + '.fhp';
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    FH.set('dirty', false);
    toast(missing ? `保存しました(メディア${missing}件が見つからず含まれていません)` : '保存しました');
  }

  async function openFile(f) {
    if (!needZip() || !confirmDiscard()) return;
    try {
      const zip = await JSZip.loadAsync(f), pj = zip.file('project.json');
      if (!pj) throw new Error('project.json がありません');
      const p = JSON.parse(await pj.async('string'));
      if (!p || p.version !== 1 || !p.chart || !Array.isArray(p.items)) throw new Error('対応していない形式です');
      const def = FH.newProject();                                  // 新しく増えた設定項目は既定値で補う
      p.meta = { ...def.meta, ...p.meta }; p.media = p.media || {}; p.groups = Array.isArray(p.groups) ? p.groups : [];
      const pf = p.funscript || {};                                  // 古いプロジェクトはノーツから自動生成される
      const fsSet = { ...def.funscript.settings, ...pf.settings };
      if (pf.settings && pf.settings.restTop === undefined) fsSet.restTop = false;   // 以前のプロジェクトは従来どおり(平時は下端)
      p.funscript = { settings: fsSet, keys: pf.keys || [], gen: pf.gen || {} };
      p.settings = { ...def.settings, chart: { ...def.settings.chart, ...(p.settings && p.settings.chart) } };
      FH.pause(); FH.blobs.clear();
      let missing = 0;
      for (const [id, m] of Object.entries(p.media)) {
        const zf = zip.file('media/' + id);
        if (!zf) { missing++; continue; }
        FH.blobs.set(id, new Blob([await zf.async('blob')], { type: m.mime || '' }));
      }
      const before = p.items.length;
      p.items = p.items.filter(i => FH.blobs.has(i.mediaId));      // メディアが無いアイテムは外す
      FH.loadProject(p); FH.set('dirty', false);
      toast(missing ? `開きました(メディア${missing}件が見つからず、${before - p.items.length}個のアイテムを除きました)` : '開きました');
    } catch (err) { toast('開けませんでした: ' + err.message); }
  }
  const openIn = document.createElement('input');
  openIn.type = 'file'; openIn.accept = '.fhp,.zip'; openIn.hidden = true; document.body.append(openIn);
  openIn.onchange = () => { const f = openIn.files[0]; openIn.value = ''; if (f) openFile(f); };

  /* ---------- 接続 ---------- */
  FH.on('action', a => ({
    new: newProject, open: () => openIn.click(), save, cut, copy: () => copy(false), paste, undo, redo
  })[a]?.());
  FH.on('project', () => { clip = null; FH.set('pasting', null); resetHistory(); syncName(); });
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'Escape' && S().pasting) { FH.set('pasting', null); return; }   // 貼り付け待ちをキャンセル
    if (!(e.ctrlKey || e.metaKey)) return;
    const fn = { z: () => e.shiftKey ? redo() : undo(), y: redo, x: cut, c: () => copy(false), v: paste, s: save }[e.key.toLowerCase()];
    if (fn) { e.preventDefault(); fn(); }
  });
  resetHistory(); syncName();
})();

/* ============================================================
   WebMエクスポート(ステップ9)
   ・プレビューと同じ FH.renderFrame を、書き出し用Canvasに描きながら実時間で再生して録画(MediaRecorder)
   ・音声は FH.audio.master を MediaStreamDestination にも接続して取り込む。書き出し中はスピーカーへの出力を止める
   ・解像度は480p/720p/1080p(16:9)。フレームレートはプロジェクトの設定(「情報と設定」タブ)
   ・範囲は「最後のアイテムまで(+1秒)」または「プロジェクト全体」
   ・書き出し中はキー操作を無効化。タブを非表示にすると録画が乱れるので、表示したままにする
   ============================================================ */
(() => {
  const dlg = document.createElement('dialog');
  dlg.id = 'exportDlg'; dlg.setAttribute('aria-labelledby', 'exTitle');
  dlg.innerHTML = `
    <h2 id="exTitle">エクスポート</h2>
    <div class="cfg-row"><label for="exFmt">形式</label>
      <select id="exFmt" class="u-sel"><option value="webm">WebM(VP9/Opus)</option><option value="mp4">MP4(H.264/AAC)</option><option value="fun">Funscriptのみ</option></select></div>
    <div class="cfg-row"><label for="exRes">解像度</label>
      <select id="exRes" class="u-sel"><option value="480">854 × 480</option><option value="720" selected>1280 × 720</option><option value="1080">1920 × 1080</option></select></div>
    <div class="cfg-row"><label for="exRange">範囲</label>
      <select id="exRange" class="u-sel"><option value="content">最後のアイテムまで(+1秒)</option><option value="all">プロジェクト全体</option></select></div>
    <div class="cfg-row"><label>フレームレート</label><span id="exFps"></span></div>
    <div class="cfg-row"><label></label><span><label class="cfg-check"><input type="checkbox" id="exFun"> Funscript(.funscript)も一緒に出力</label></span></div>
    <progress id="exProg" max="1" value="0" hidden></progress>
    <div id="exMsg" class="cfg-empty" role="status">実時間で再生しながら録画します。完了まで、このタブを表示したままにしてください。</div>
    <div class="ex-btns"><button class="ex-btn" id="exGo">書き出し開始</button><button class="ex-btn" id="exCancel">閉じる</button></div>`;
  document.body.append(dlg);
  const $ = id => dlg.querySelector('#' + id);
  const res = $('exRes'), range = $('exRange'), fpsEl = $('exFps'), prog = $('exProg'), msg = $('exMsg'), go = $('exGo'), cancel = $('exCancel');
  const fmt = $('exFmt'), funChk = $('exFun');
  let job = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const mimeOf = () => window.MediaRecorder && ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const blocker = e => e.stopImmediatePropagation();           // 書き出し中は他のキー操作を止める

  function contentEnd() {
    const P = FH.state.project, c = P.chart;
    const ends = [...P.items.map(i => i.start + i.duration), ...c.notes.map(n => n.type === 'long' ? n.end.time : n.time), ...c.events.map(e => e.time)];
    return (ends.length ? Math.max(...ends) : 0) + 1;
  }
  function openDialog() {
    FH.pause();
    fpsEl.textContent = (FH.state.project.meta.fps || 30) + ' fps(「情報と設定」タブで変更)';
    prog.hidden = true; go.disabled = false; res.disabled = fmt.value === 'fun'; range.disabled = false; cancel.textContent = '閉じる'; cancel.disabled = false;
    msg.textContent = '実時間で再生しながら録画します。完了まで、このタブを表示したままにしてください。';
    dlg.showModal(); refreshFormats();
  }

  const rangeEnd = () => range.value === 'all' ? FH.duration() : contentEnd();
  const baseName = () => (FH.state.project.meta.name || 'project').replace(/[\\/:*?"<>|]/g, '_');
  const saveBlob = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };
  function saveFun() {                                          // 動画と同じ名前の .funscript を保存(再生ソフトが同名で対応付けるため)
    FH.fun.sync();
    saveBlob(new Blob([JSON.stringify(FH.fun.build(rangeEnd()))], { type: 'application/json' }), baseName() + '.funscript');
  }

  /* MP4: WebCodecs(H.264/AAC)を使うMediabunnyで、録画したWebMをMP4へ変換する(MediaRecorder自体のMP4出力は使わない) */
  let mp4Ok = null;
  async function checkMp4() {
    if (mp4Ok !== null) return mp4Ok;
    try {
      if (!window.VideoEncoder || !window.AudioEncoder) throw new Error('no WebCodecs');
      const v = await VideoEncoder.isConfigSupported({ codec: 'avc1.640028', width: 1920, height: 1080, bitrate: 6e6, framerate: 30 });
      const a = await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192e3 });
      mp4Ok = !!(v.supported && a.supported);
    } catch (e) { mp4Ok = false; }
    return mp4Ok;
  }
  async function refreshFormats() {
    const opt = fmt.querySelector('option[value="mp4"]');
    opt.disabled = true; opt.textContent = 'MP4(H.264/AAC)— 対応を確認中…';
    const ok = await checkMp4();
    opt.disabled = !ok; opt.textContent = ok ? 'MP4(H.264/AAC)' : 'MP4(このブラウザでは使えません)';
    if (!ok && fmt.value === 'mp4') fmt.value = 'webm';
  }
  fmt.addEventListener('change', () => { res.disabled = fmt.value === 'fun'; });
  let mbPromise = null;
  function loadMb() {
    if (!mbPromise) mbPromise = (async () => {
      const urls = ['https://cdn.jsdelivr.net/npm/mediabunny@1.61.3/+esm', 'https://cdn.jsdelivr.net/npm/mediabunny@1.61.3/dist/bundles/mediabunny.min.mjs'];
      for (const u of urls) { try { return await import(u); } catch (e) { /* 次の候補へ */ } }
      mbPromise = null; throw new Error('Mediabunnyを読み込めませんでした(ネットワーク接続を確認してください)');
    })();
    return mbPromise;
  }
  async function toMp4(webm, fps, h, onProgress) {
    const mb = await loadMb();
    const input = new mb.Input({ source: new mb.BlobSource(webm), formats: mb.ALL_FORMATS });
    const output = new mb.Output({ format: new mb.Mp4OutputFormat(), target: new mb.BufferTarget() });
    const conv = await mb.Conversion.init({ input, output,
      video: { codec: 'avc', bitrate: h >= 1080 ? 12e6 : h >= 720 ? 6e6 : 3e6, frameRate: fps },    // 録画は可変フレームレートなので固定に揃える
      audio: { codec: 'aac', bitrate: 192e3 } });
    if (!conv.isValid) throw new Error('変換できないトラックがあります');
    conv.onProgress = onProgress;
    await conv.execute();
    return new Blob([output.target.buffer], { type: 'video/mp4' });
  }

  async function start() {
    if (fmt.value === 'fun') { saveFun(); msg.textContent = 'Funscriptを保存しました。'; return; }
    const mime = mimeOf();
    if (!mime) { msg.textContent = 'このブラウザはWebMの録画(MediaRecorder)に対応していません。'; return; }
    const P = FH.state.project, h = +res.value, w = Math.round(h * FH.OUT.w / FH.OUT.h / 2) * 2, fps = P.meta.fps || 30;
    const endT = rangeEnd();
    const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
    const c = cvs.getContext('2d'), draw = () => FH.renderFrame(c, w, h, FH.state.time);
    const prev = { time: FH.state.time, speed: FH.state.speed };

    const ac = FH.audio.ensure(); let dest = null;
    if (ac) {
      await ac.resume();
      dest = ac.createMediaStreamDestination(); FH.audio.master.connect(dest);
      try { FH.audio.master.disconnect(ac.destination); } catch (e) {}   // 書き出し中はスピーカーに出さない
    }
    const stream = cvs.captureStream(fps);
    if (dest) dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    let rec;
    const restore = () => {
      window.removeEventListener('keydown', blocker, true); FH.state.exporting = false;
      if (dest) {
        try { FH.audio.master.disconnect(dest); } catch (e) {}
        try { FH.audio.master.connect(ac.destination); } catch (e) {}
      }
      FH.pause(); FH.setSpeed(prev.speed); FH.setTime(prev.time);
    };
    try {
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: h >= 1080 ? 12e6 : h >= 720 ? 6e6 : 3e6, audioBitsPerSecond: 192000 });
    } catch (err) { restore(); msg.textContent = '録画を開始できませんでした: ' + err.message; return; }

    const chunks = [];
    job = { rec, cancelled: false, raf: 0 };
    const wantFun = funChk.checked, wantMp4 = fmt.value === 'mp4';
    const finalize = async ok => {
      restore();
      if (ok) {
        const webm = new Blob(chunks, { type: 'video/webm' }), name = baseName();
        if (wantMp4) {
          job.converting = true; cancel.disabled = true;
          msg.textContent = 'MP4に変換しています…(初回はライブラリを読み込むため、ネットワークが必要です)';
          prog.hidden = false; prog.value = 0;
          try {
            saveBlob(await toMp4(webm, fps, h, v => { prog.value = v; }), name + '.mp4');
            msg.textContent = '書き出しが完了しました(MP4)。';
          } catch (err) {
            console.error(err);
            saveBlob(webm, name + '.webm');
            msg.textContent = 'MP4へ変換できなかったため、WebMで保存しました(' + ((err && err.message) || err) + ')';
          }
        } else { saveBlob(webm, name + '.webm'); msg.textContent = '書き出しが完了しました。'; }
        if (wantFun) saveFun();
      } else msg.textContent = 'キャンセルしました。';
      prog.hidden = true; go.disabled = false; res.disabled = range.disabled = false; cancel.disabled = false; cancel.textContent = '閉じる'; job = null;
    };
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => finalize(!job.cancelled);

    window.addEventListener('keydown', blocker, true); FH.state.exporting = true;
    go.disabled = true; res.disabled = range.disabled = true; cancel.textContent = 'キャンセル';
    prog.hidden = false; prog.value = 0; msg.textContent = '録画中… このタブを表示したままにしてください。';
    FH.pause(); FH.setSpeed(1); FH.setTime(0); draw();
    await sleep(500);                                           // 動画の頭出し待ち
    if (!job || job.cancelled) return;
    rec.start(1000);
    FH.play();
    const finish = async () => {
      cancelAnimationFrame(job.raf); FH.pause(); draw(); await sleep(300);
      if (rec.state !== 'inactive') rec.stop();
    };
    const loop = () => {
      if (!job) return;
      draw(); const t = FH.state.time; prog.value = Math.min(1, t / endT);
      if (t >= endT - 0.001 || !FH.state.playing) finish(); else job.raf = requestAnimationFrame(loop);
    };
    job.raf = requestAnimationFrame(loop);
  }
  function abort() {
    if (!job || job.converting) return;
    job.cancelled = true; cancelAnimationFrame(job.raf);
    if (job.rec.state !== 'inactive') job.rec.stop();           // onstop で後片付け
    else job.rec.onstop();                                      // 録画開始前のキャンセル
  }
  go.addEventListener('click', start);
  cancel.addEventListener('click', () => { if (job) abort(); else dlg.close(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); if (job) abort(); else dlg.close(); });   // Esc
  FH.on('action', a => { if (a === 'export') openDialog(); });
})();

/* ============================================================
   開発用パネル: 状態の確認とキー操作テスト(ステップ6で置き換え)
   ============================================================ */
const dev = document.getElementById('dev'), devBody = document.getElementById('devBody');
function renderDev() {
  if (dev.hidden) return;
  const s = FH.state, T = FH.time;
  const rows = [
    ['現在時刻', T.format(s.time)], ['再生中', s.playing ? 'はい' : 'いいえ'],
    ['再生速度', Math.round(s.speed * 100) + '%'], ['ズーム', s.zoom.toFixed(2)],
    ['ツール', s.tool], ['グリッド', s.grid + '分'], ['全体の長さ', T.format(FH.duration())],
    ['現在のBPM', T.bpmAt(s.time)], ['現在の拍', T.timeToBeat(s.time).toFixed(2)],
    ['ノーツ / イベント / アイテム', `${s.project.chart.notes.length} / ${s.project.chart.events.length} / ${s.project.items.length}`]
  ];
  devBody.innerHTML = '<table>' + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>'
    + '<button id="demoBtn">サンプル譜面を読み込む</button>'
    + '<div class="hint"><kbd>ホイール</kbd> 譜面スクロール <kbd>Space</kbd> 再生/停止 <kbd>←</kbd><kbd>→</kbd> 1グリッド移動(スナップが1フレームのときは1フレーム) <kbd>Home</kbd> 先頭へ '
    + '<kbd>[</kbd><kbd>]</kbd> 速度 <kbd>-</kbd><kbd>+</kbd> ズーム</div>'
    + '<pre>' + JSON.stringify(s.project, null, 2) + '</pre>';
}
FH.on('change', k => { if (k !== 'time' || !FH.state.playing || (renderDev.skip = !renderDev.skip)) renderDev(); });
FH.on('project', renderDev);
FH.on('chart', renderDev);
renderDev();

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const s = FH.state, T = FH.time, beat = 4 / s.grid, fps = s.project.meta.fps || 30;
  const frame = d => FH.setTime((Math.round(s.time * fps) + d) / fps);   // 1フレームずつ
  const keys = {
    ' ': () => FH.toggle(), 'Home': () => FH.setTime(0),
    'ArrowRight': () => s.itemSnap === 'frame' ? frame(1) : FH.setTime(T.beatToTime(T.timeToBeat(s.time) + beat)),
    'ArrowLeft': () => s.itemSnap === 'frame' ? frame(-1) : FH.setTime(T.beatToTime(Math.max(0, T.timeToBeat(s.time) - beat))),
    ']': () => FH.stepSpeed(1), '[': () => FH.stepSpeed(-1),
    '+': () => FH.stepZoom(1), '=': () => FH.stepZoom(1), '-': () => FH.stepZoom(-1)
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
</script>
